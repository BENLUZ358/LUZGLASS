/* מעטפת מסך-מלא: הדף עצמו לא גולל, הגלילה היא באזורים הפנימיים.
   lg-ui.css לא קובע את זה כי זה נכון רק לדפי התחנות. */
html,body{height:100%;overflow:hidden;}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;}

/* TOPBAR */
.topbar{flex-shrink:0;background:var(--text);color:#f7f4ef;padding:0 16px;height:52px;display:flex;align-items:center;justify-content:space-between;z-index:20;}
.logo{font-size:16px;font-weight:900;}.logo span{color:var(--gold);}
.tbar-center{font-size:13px;font-weight:700;color:rgba(247,244,239,0.7);}
.tbar-right{display:flex;align-items:center;gap:8px;}
.counter{font-size:13px;font-weight:700;color:var(--gold-text);}
.nav-btn{padding:7px 14px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:#f7f4ef;font-family:'Heebo',sans-serif;font-size:13px;font-weight:600;cursor:pointer;border-radius:4px;transition:all 0.15s;}
.nav-btn:hover{background:rgba(255,255,255,0.14);}
.nav-btn:disabled{opacity:0.3;cursor:default;}
.back-link{color:rgba(247,244,239,0.5);font-size:12px;text-decoration:none;}
.back-link:hover{color:#f7f4ef;}

/* MAIN LAYOUT */
.main{flex:1;display:flex;overflow:hidden;}

/* SIDEBAR - list of queued sketches */
.sidebar{width:220px;flex-shrink:0;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.sb-hdr{padding:12px 14px;background:var(--bg2);border-bottom:1px solid var(--border);font-size:12px;font-weight:700;color:var(--text);letter-spacing:0.1em;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between;}
.sb-count{background:var(--red);color:#fff;border-radius:10px;padding:1px 7px;font-size:12px;font-weight:900;}
.sb-list{flex:1;overflow-y:auto;}
.sb-item{padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background 0.1s;position:relative;}
.sb-item:hover{background:var(--bg);}
.sb-item.active{background:rgba(184,146,42,0.08);border-right:3px solid var(--gold);}
.sb-name{font-size:13px;font-weight:700;color:var(--text);}
.sb-num{font-size:12px;color:var(--gold-text);font-weight:600;margin-bottom:2px;}
.sb-desc{font-size:12px;color:var(--muted);margin-top:2px;}
.sb-empty{padding:32px 16px;text-align:center;color:var(--muted);font-size:13px;}

/* SKETCH AREA */
.sketch-area{flex:1;display:flex;flex-direction:column;overflow:hidden;background:#1a1a1a;}
.sketch-meta{flex-shrink:0;padding:10px 16px;background:rgba(0,0,0,0.4);display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.sm-client{font-size:15px;font-weight:900;color:#f7f4ef;}
.sm-num{font-size:12px;color:var(--gold-text);background:rgba(184,146,42,0.2);padding:2px 8px;border-radius:3px;font-weight:700;}
.sm-desc{font-size:12px;color:rgba(247,244,239,0.6);}
.sketch-canvas{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
.sketch-canvas img{max-width:100%;max-height:100%;object-fit:contain;}
.sketch-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:rgba(255,255,255,0.25);}
.sketch-placeholder .icon{font-size:48px;}
.sketch-placeholder p{font-size:14px;}

/* EDITOR OVERLAY */

/* BOTTOM BAR */
.btm-bar{flex-shrink:0;padding:10px 14px;background:rgba(0,0,0,0.6);display:flex;align-items:center;gap:8px;}
.btm-btn{padding:10px 18px;font-family:'Heebo',sans-serif;font-size:13px;font-weight:700;border:none;cursor:pointer;border-radius:6px;display:flex;align-items:center;gap:6px;}
.btn-edit{background:rgba(255,255,255,0.1);color:#f7f4ef;border:1px solid rgba(255,255,255,0.2);}
.btn-finish{background:var(--green);color:#fff;flex:1;justify-content:center;font-size:14px;}
.btn-finish:hover{background:#229954;}
.btn-skip{background:rgba(255,255,255,0.08);color:rgba(247,244,239,0.6);border:1px solid rgba(255,255,255,0.1);font-size:12px;}
.no-sketch{color:rgba(247,244,239,0.4);font-size:12px;padding:10px 0;flex:1;text-align:center;}

/* DONE BANNER */
.done-banner{position:absolute;inset:0;background:rgba(39,174,96,0.95);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:10;}
.done-banner.show{display:flex;}
.done-icon{font-size:56px;}
.done-title{font-size:20px;font-weight:900;color:#fff;}
.done-sub{font-size:14px;color:rgba(255,255,255,0.8);}

/* EMPTY STATE */
.all-done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:rgba(255,255,255,0.3);}
.all-done .icon{font-size:56px;}
.all-done h2{font-size:18px;color:rgba(255,255,255,0.6);font-weight:700;}
.all-done p{font-size:13px;}

@media(max-width:600px){
  .sidebar{display:none;}
  .main{flex-direction:column;}
}

/* ═══ UNIFIED NAV ═══ */
.unav-sidebar{width:210px;background:#1a1714;display:flex;flex-direction:column;position:fixed;top:0;right:0;height:100vh;height:100dvh;overflow-y:auto;z-index:200;transform:translateX(100%);transition:transform 0.25s;box-shadow:-4px 0 20px rgba(0,0,0,0.4);}
.unav-logo{padding:20px 16px 12px;border-bottom:1px solid rgba(255,255,255,0.07);}
.unav-logo .lg{font-family:'Playfair Display',serif;font-size:18px;font-weight:900;color:#f7f4ef;}
.unav-logo .lg span{color:#b8922a;}
.unav-logo .sub{font-size:12px;color:rgba(247,244,239,0.3);letter-spacing:0.12em;text-transform:uppercase;margin-top:2px;}
.unav-nav{flex:1;padding:8px 0;}
.unav-sec{font-size:12px;font-weight:700;letter-spacing:0.15em;color:rgba(247,244,239,0.25);text-transform:uppercase;padding:12px 16px 4px;}
.unav-a{display:flex;align-items:center;gap:10px;padding:9px 16px;color:rgba(247,244,239,0.55);font-size:13px;text-decoration:none;transition:all 0.15s;cursor:pointer;border:none;background:none;width:100%;text-align:right;font-family:Heebo,sans-serif;}
.unav-a:hover{background:rgba(255,255,255,0.05);color:#f7f4ef;}
.unav-a.active{background:rgba(184,146,42,0.15);color:#b8922a;font-weight:700;}
.unav-a .ic{font-size:15px;flex-shrink:0;}
.unav-bot{padding:12px 16px;border-top:1px solid rgba(255,255,255,0.07);}
.unav-bot a{display:block;font-size:12px;color:rgba(192,57,43,0.55);text-decoration:none;padding:4px 0;}
.unav-bot a:hover{color:#e74c3c;}
.unav-topbar{display:none;background:#1a1714;padding:0 16px;height:52px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.unav-topbar .lg{font-family:'Playfair Display',serif;font-size:16px;font-weight:900;color:#f7f4ef;}
.unav-topbar .lg span{color:#b8922a;}
.unav-burger{background:none;border:none;cursor:pointer;padding:6px;display:flex;flex-direction:column;gap:4px;}
.unav-burger span{display:block;width:20px;height:2px;background:#f7f4ef;border-radius:1px;}
.unav-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:90;}
.unav-overlay.open{display:block;}
.unav-sidebar.open{transform:translateX(0);}
/* 900 ולא 768. אייפד לאורך הוא 810–834 רוחב, כלומר נפל בין הכיסאות:
   התפריט הראשי כבר התקפל ב-900, תפריט המשתמש נשאר סרגל קבוע, וסרגל
   הפתיחה שלו הוסתר — ולא הייתה שום דרך לפתוח אותו. נקודות השבירה של
   המערכת הן 600 / 900 / 1200, וזו אחת מהן. */
/* ─ שרטט במסך צר: כותרת אחת עם לוגו, וקישור חזרה שאפשר ללחוץ ─
   ≤900 יש שתי שורות: התפריט (לוגו + המבורגר) ומעליה שורת השרטט, שגם בה
   לוגו. "← אדמין" היה 18px — כמעט בלתי לחיץ. */
@media(max-width:900px){
  .topbar .logo{display:none;}
  .back-link{display:inline-flex;align-items:center;min-height:44px;padding:0 10px;margin-inline-start:-10px;font-size:13px;}
}

@media(max-width:900px){
  .unav-topbar{display:flex;}

  /* ── הכפתור הירוק שנעלם באייפד ──────────────────────────────────────
     .unav-topbar נוסף כאן בגובה 52px, אבל .app נשאר 100dvh — כלומר
     גובה המסך המלא *בנוסף* לסרגל. התחתית של .app נדחפה מתחת לקצה
     המסך, ו-body עם overflow:hidden מונע לגלול אליה. מה שיושב שם הוא
     .btm-bar עם "סיים סקיצה — שלח ל-OptyWay".
     הגובה מנוכה עכשיו, ולכן הסרגל התחתון תמיד בתוך המסך —
     גם לאורך וגם לרוחב. */
  .app{height:calc(100vh - 52px);height:calc(100dvh - 52px);}

  /* מטרה למגע: הכפתורים בסרגל התחתון נמוכים מ-44 פיקסלים */
  .btm-btn{min-height:44px;}
  .btn-finish{font-size:15px;padding:12px 18px;}
}

/* ═══ רספונסיביות — נקודות העצירה של lg-ui.css: 600 / 900 / 1200 ═══ */
@media (min-width:601px) and (max-width:900px){
  /* אייפד לאורך — הסרגל צר יותר כדי להשאיר מקום לשרטוט */
  .sidebar{width:180px;}
}

<script>

let queue=[], curIdx=0, curOrder=null;
// מונע מה-Firebase listener לנווט בזמן שבאנר "הסתיים" מוצג
let _showingDoneBanner = false;

// ═══ LOAD ═══
let _drafterUnsub = null;
function load(){
  if(_drafterUnsub) _drafterUnsub();
  _drafterUnsub = listenAllOrders(function(allOrders){
    // סנן לפי stage === 'drafter' || 'chash' — אותה לוגיקה כמו קודם
    const prevId = curOrder ? curOrder.id : null;
    queue = allOrders.filter(o => o.stage==='drafter'||o.stage==='chash')
      .map(o=>({
        id:            o.id,
        orderClient:   o.orderClient||o.client||'—',
        orderNum:      o.orderNum||o.refNum||'',
        sketchName:    o.sketchName||o.type||'',
        type:          o.type||'',
        glass:         o.glass||'',
        glassFullName: o.glassFullName||o.glass||'',
        finish:        o.finish||'',
        phone:         o.phone||'',
        status:        o.status||'',
        source:        o.source||'sketch',
        ...lgSketchFields(o),   // התמונה עצמה רק דרך השכבה — ר' firebase-db
        _editedSketch: o._editedSketch||null,
        date:          o.date||'',
        items:         o.items||[],
        panels:        o.panels||[],
        urgent:        o.urgent||false,
        // הערת הלקוח. בלי השדה כאן showOrder בודק o.notes על אובייקט שאין בו
        // notes, וחלון "💬 הערה על ההזמנה" לא נפתח אף פעם — ההערה לא הגיעה לשרטט.
        notes:         o.notes||'',
      }));
    // Sort: urgent first
    queue.sort((a,b)=>(b.urgent?1:0)-(a.urgent?1:0));
    renderSidebar();
    updateCounter();
    // אם באנר "הסתיים" מוצג — רק עדכן סידבר, אל תנווט (setTimeout ינווט)
    if(_showingDoneBanner) return;
    if(queue.length>0){
      const stillThere = prevId ? queue.findIndex(o=>o.id===prevId) : -1;
      if(stillThere>=0){ curIdx=stillThere; }
      else { curIdx=0; showOrder(queue[0]); }
    } else {
      showAllDone();
    }
  });
}

function updateCounter(){
  const n=queue.length;
  document.getElementById('qCounter').textContent=n+' בתור';
  document.getElementById('sbCount').textContent=n;
  document.getElementById('btnPrev').disabled=curIdx<=0;
  document.getElementById('btnNext').disabled=curIdx>=queue.length-1;
}

// ═══ SIDEBAR ═══
function renderSidebar(){
  const el=document.getElementById('sbList');
  if(!queue.length){
    el.innerHTML='<div class="sb-empty">אין סקיצות בתור</div>';
    return;
  }
  el.innerHTML=queue.map((o,i)=>`
    <div class="sb-item ${i===curIdx?'active':''}" onclick="jumpTo(${i})">
      <div class="sb-num">${lgEsc(o.orderNum||'—')} ${o.urgent?'⚡':''}</div>
      <div class="sb-name">${lgEsc(o.orderClient||'לקוח')}</div>
      <div class="sb-desc">${lgEsc(o.sketchName||o.type||'—')}</div>
    </div>`).join('');
}

// ═══ SHOW ORDER ═══
function showOrder(o){
  curOrder=o;
  document.getElementById('sketchPlaceholder').style.display='none';
  document.getElementById('allDone').style.display='none';
  document.getElementById('doneBanner').classList.remove('show');
  document.getElementById('sketchMeta').style.display='flex';
  document.getElementById('btmBar').style.display='flex';
  document.getElementById('smClient').textContent=o.orderClient||'לקוח';
  document.getElementById('smNum').textContent=o.orderNum||'—';
  document.getElementById('smDesc').textContent=[o.sketchName,o.type,o.glass].filter(Boolean).join(' · ');
  // Items tags
  const items=o.items||o.panels||[];
  document.getElementById('smItems').innerHTML=items.slice(0,4).map(it=>`
    <span style="font-size:12px;background:rgba(184,146,42,0.15);color:var(--gold-text);padding:2px 8px;border-radius:3px;font-weight:600">
      ${lgEsc(it.name||it.label||it.type||'פריט')} ${it.w ? lgDimsText(it.w, it.h) : ''}
    </span>`).join('');
  // Show sketch image
  const canvas=document.getElementById('sketchCanvas');
  // נקה canvas לגמרי — כולל img ישן
  canvas.querySelectorAll('img.sketch-img').forEach(el=>el.remove());
  // הפסק טעינה של תמונות ישנות
  canvas.querySelectorAll('img').forEach(el=>{ el.src=''; });
  if(lgHasSketch(o)||o._editedSketch){
    const img=document.createElement('img');
    img.className='sketch-img';
    img.style.cssText='max-width:100%;max-height:100%;object-fit:contain;display:block;';
    canvas.insertBefore(img, document.getElementById('skImgAnchor'));
    // ציור מקומי גובר על הסקיצה עצמה. אחרת דרך lgSketchIntoImg, שמציג את
    // מה שכבר בזיכרון ומחליף במה שמגיע מהצומת — ר' שלב 2 ב-firebase-db.
    if(o._editedSketch) img.src=o._editedSketch;
    else lgSketchIntoImg(img, o);
  } else {
    // Auto-generate SVG
    const svg=buildAutoSVG(o);
    if(svg){
      const img=document.createElement('img');
      img.className='sketch-img';
      img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
      img.style.cssText='max-width:100%;max-height:100%;object-fit:contain;display:block;';
      canvas.insertBefore(img, document.getElementById('skImgAnchor'));
    } else {
      document.getElementById('sketchPlaceholder').style.display='flex';
      document.getElementById('sketchPlaceholder').querySelector('p').textContent='אין סקיצה לטעינה';
    }
  }
  renderSidebar();
  updateCounter();
  // ההערה נכתבת בתור הסקיצות או בתחנת הבדיקה, ומי שפותח את הסקיצה צריך
  // לראות אותה. אחרי השהייה קצרה, אחרת הפופאפ קופץ לפני שהתמונה נטענה.
  if(o.notes) setTimeout(function(){ drShowNote(o.notes); }, 300);
}

// textContent ולא innerHTML — הטקסט מגיע ממשתמש.
function drShowNote(txt){
  var el = document.getElementById('drNoteText');
  if(!el || !txt) return;
  el.textContent = txt;
  document.getElementById('drNotePopup').style.display = 'flex';
}
function drDismissNote(){
  var el = document.getElementById('drNotePopup');
  if(el) el.style.display = 'none';
}

function buildMeasureTableSVG(o){
  const items=o.items||[];
  if(!items.length) return null;
  const W=480,PAD=16,ROW=34,HEAD=44,COLH=26,FOOT=18;
  const H=HEAD+COLH+items.length*ROW+FOOT;
  const rows=items.map((it,i)=>{
    const y=HEAD+COLH+i*ROW;
    const bg=i%2===0?'#f9f7f3':'#fff';
    const pc=it.chisum?'#8e44ad':'#2980b9';
    const pl=it.chisum?'🔥 חיסום':'✂ ליטוש';
    return `<rect x="${PAD}" y="${y}" width="${W-PAD*2}" height="${ROW}" fill="${bg}"/>
    <text x="${PAD+8}" y="${y+22}" font-family="Heebo,Arial" font-size="12" font-weight="700" fill="#1a1714">${it.name||it.glass||''}</text>
    <text x="${W/2}" y="${y+22}" text-anchor="middle" font-family="Heebo,Arial" font-size="14" fill="#333" font-weight="600">${it.w||0} × ${it.h||0}</text>
    <text x="${W-PAD-8}" y="${y+22}" text-anchor="end" font-family="Heebo,Arial" font-size="11" fill="${pc}" font-weight="700">${pl}</text>`;
  }).join('');
  const num=o.orderNum||o.refNum||'';
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" style="background:#fff">
    <rect width="${W}" height="${HEAD}" fill="#1a1714"/>
    <text x="${W-PAD}" y="20" text-anchor="end" font-family="Heebo,Arial" font-size="14" font-weight="900" fill="#c9a84c">הזמנת זכוכית לפי מידה</text>
    <text x="${W-PAD}" y="36" text-anchor="end" font-family="Heebo,Arial" font-size="10" fill="rgba(247,244,239,0.5)">${o.orderClient||''} · ${num} · ${items.length} פריטים</text>
    <rect x="0" y="${HEAD}" width="${W}" height="${COLH}" fill="rgba(184,146,42,0.12)"/>
    <text x="${PAD+8}" y="${HEAD+17}" font-family="Heebo,Arial" font-size="10" fill="#b8922a" font-weight="700">סוג זכוכית</text>
    <text x="${W/2}" y="${HEAD+17}" text-anchor="middle" font-family="Heebo,Arial" font-size="10" fill="#b8922a" font-weight="700">מידות (מ"מ)</text>
    <text x="${W-PAD-8}" y="${HEAD+17}" text-anchor="end" font-family="Heebo,Arial" font-size="10" fill="#b8922a" font-weight="700">עיבוד</text>
    ${rows}
    <rect x="0" y="${H-FOOT}" width="${W}" height="${FOOT}" fill="#f5f2ed"/>
    <text x="${W-PAD}" y="${H-5}" text-anchor="end" font-family="Heebo,Arial" font-size="9" font-weight="700" fill="#b8922a">LuzGlass</text>
  </svg>`;
}

function buildAutoSVG(o){
  if(o.type==='measure') return buildMeasureTableSVG(o);
  const items=o.items||o.panels||[];
  if(!items.length) return null;
  const W=500,PAD=40,GAP=12,H=260;
  const totalW=items.reduce((s,it)=>s+(it.w||60),0);
  const sc=Math.min(1,(W-PAD*2-GAP*(items.length-1))/Math.max(totalW,1));
  let panels='',cx2=PAD;
  items.forEach((it,i)=>{
    const pw=Math.round((it.w||60)*sc);
    const ph=Math.round(Math.min(H,(it.h||200)*sc*0.85));
    const py=PAD+24+(H-ph);
    const col=it.chisum?'rgba(142,68,173,0.15)':'rgba(180,215,240,0.15)';
    const stroke=it.chisum?'#8e44ad':'#2a5a8a';
    panels+=`<rect x="${cx2}" y="${py}" width="${pw}" height="${ph}" fill="${col}" stroke="${stroke}" stroke-width="2" rx="1"/>`;
    panels+=`<text x="${cx2+pw/2}" y="${py+ph/2+5}" text-anchor="middle" font-family="Heebo,Arial" font-size="11" fill="${stroke}" font-weight="700">${it.name||it.label||''}</text>`;
    panels+=`<text x="${cx2+pw/2}" y="${py-6}" text-anchor="middle" font-family="Heebo,Arial" font-size="10" fill="#888">${lgDimsText(it.w, it.h)}</text>`;
    cx2+=pw+GAP;
  });
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H+PAD+40}" style="background:#fff">
    <rect width="${W}" height="26" fill="#1a1714"/>
    <text x="${W/2}" y="18" text-anchor="middle" font-family="Heebo,Arial" font-size="11" font-weight="900" fill="#c9a84c">${o.orderClient||''} · ${o.orderNum||''}</text>
    ${panels}
    <rect x="0" y="${H+PAD+22}" width="${W}" height="18" fill="#f5f2ed"/>
    <text x="${W-8}" y="${H+PAD+34}" text-anchor="end" font-family="Heebo,Arial" font-size="9" font-weight="700" fill="#b8922a">LuzGlass</text>
  </svg>`;
}


function showAllDone(){
  document.getElementById('sketchMeta').style.display='none';
  document.getElementById('btmBar').style.display='none';
  document.getElementById('sketchPlaceholder').style.display='none';
  document.getElementById('allDone').style.display='flex';
  curOrder=null;
}

// ═══ NAVIGATION ═══
function navSketch(dir){
  const newIdx=curIdx+dir;
  if(newIdx<0||newIdx>=queue.length) return;
  jumpTo(newIdx);
}

function jumpTo(i){
  curIdx=i;
  showOrder(queue[i]);
}

// ═══ FINISH SKETCH ═══
function finishSketch(){
  if(!curOrder || _showingDoneBanner) return;
  const finishedId=curOrder.id;
  const finishedClient=curOrder.orderClient;
  curOrder = null;
  _showingDoneBanner = true;
  // updateStage מפעיל את ה-Firebase listener סינכרונית —
  // ה-listener כבר מסיר את ההזמנה מה-queue.
  // אסור לקרוא ל-queue.splice() אחרי זה — זה ימחק את ההזמנה הבאה.
  updateStage(finishedId,'opty').catch(e=>console.error('finishSketch:',e));
  document.getElementById('sketchCanvas').querySelectorAll('img.sketch-img').forEach(el=>el.remove());
  document.getElementById('doneTitle').textContent=finishedClient+' — עובר ל-OptyWay ✓';
  document.getElementById('doneBanner').classList.add('show');
  setTimeout(()=>{
    _showingDoneBanner = false;
    document.getElementById('doneBanner').classList.remove('show');
    // נקה את ההזמנה המסיימת אם Firebase איטי ועדיין לא הסיר אותה
    queue = queue.filter(o => o.id !== finishedId);
    if(queue.length>0){
      if(curIdx>=queue.length) curIdx=queue.length-1;
      showOrder(queue[curIdx]);
    } else {
      showAllDone();
    }
    updateCounter();
    renderSidebar();
  },1600);
}

// ═══ EDITOR ═══ — עורך הסקיצות המשותף (lg-sketch-editor.js, 19/10/2026).
// סימוני השרטט **פרטיים לתחנה** (_editedSketch) — לא נכתבים לסקיצה של הלקוח.
async function openEditor(){
  if(!curOrder) return;
  const o = curOrder;
  let base = o._editedSketch || (lgHasSketch(o) ? await lgLoadSketch(o).catch(()=>null) : null);
  if(!base){ const svg=buildAutoSVG(o); if(svg) base='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg); }
  if(!base || curOrder !== o) return;
  lgSketchEditor.open({
    title: (o.orderClient||'') + (o.sketchName ? ' — ' + o.sketchName : ''),
    baseSrc: base,
    layer: null,
    output: { mime: 'image/png' },          // כמו שהשרטט שמר תמיד
    onSave: ({ mergedSrc }) => edSave(mergedSrc),
  });
}

function edSave(newSrc){
  if(!curOrder) return;
  curOrder._editedSketch=newSrc;
  // Save to Firebase
  updateOrder(curOrder.id,{_editedSketch:newSrc}).catch(e=>console.error('edSave:',e));
  // Update displayed image
  document.querySelectorAll('#sketchCanvas img.sketch-img').forEach(el=>el.src=newSrc);
}

// ═══ KEYBOARD ═══
document.addEventListener('keydown',e=>{
  if(document.querySelector('.lg-se')) return;   // העורך פתוח — המקלדת שלו
  if(e.key==='ArrowLeft'||e.key==='ArrowDown') navSketch(+1);
  if(e.key==='ArrowRight'||e.key==='ArrowUp') navSketch(-1);
  if(e.key==='Enter'){
    e.preventDefault(); // מונע click נוסף על כפתור ב-focus
    finishSketch();
  }
});

// שער הרשאה אמיתי — כלי שרטוט פנימי, אדמין בלבד (drafter.html לא היה מוגן כלל עד עכשיו)
lgRequireAuthAsync('admin').then(session => {
  if(!session) return; // כבר הופנה ל-login.html בתוך lgRequireAuthAsync
  load();
});

function unavClose(){document.getElementById('unavSidebar').classList.remove('open');const ov=document.getElementById('unavOverlay');if(ov)ov.classList.remove('open');}
