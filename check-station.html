<style>
/* מעטפת מסך-מלא: הדף עצמו לא גולל, הגלילה היא באזורים הפנימיים.
   lg-ui.css לא קובע את זה כי זה נכון רק לדפי התחנות. */
html,body{height:100%;overflow:hidden;}
*{-webkit-tap-highlight-color:transparent;}
.app{display:flex;flex-direction:column;height:100vh;}
.topbar{flex-shrink:0;height:52px;background:var(--surface);border-bottom:1px solid var(--border);padding:0 12px;display:flex;align-items:center;gap:7px;z-index:20;}
.tb-logo{font-size:15px;font-weight:900;white-space:nowrap;}.tb-logo span{color:var(--gold);}
.tb-title{font-size:13px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tb-btn{padding:6px 10px;font-family:Heebo,sans-serif;font-size:12px;font-weight:700;border:none;cursor:pointer;border-radius:4px;white-space:nowrap;display:flex;align-items:center;gap:4px;}
.tb-out{background:transparent;color:var(--muted);border:1px solid var(--border);}
.tb-green{background:var(--green);color:#fff;}
.tb-purple{background:var(--purple);color:#fff;}
/* FILTERS */
.filters{flex-shrink:0;background:var(--s2);border-bottom:1px solid var(--border);padding:8px 12px;display:flex;gap:6px;flex-wrap:wrap;}
.fi{flex:1;min-width:80px;padding:7px 9px;background:var(--bg);border:1px solid var(--border);font-family:Heebo,sans-serif;font-size:12px;color:var(--text);outline:none;border-radius:4px;-webkit-appearance:none;}
.fi::placeholder{color:var(--muted);}.fi:focus{border-color:var(--gold);}
/* LIST */
.list-view{flex:1;overflow-y:auto;display:flex;flex-direction:column;}
.list-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);gap:12px;padding:40px;text-align:center;}
.order-card{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 14px 12px 14px;cursor:pointer;transition:background 0.12s;position:relative;}
.order-card:active{background:var(--s2);}
.order-card.done-card{border-right:4px solid var(--green);}
.order-card.partial-card{border-right:4px solid var(--gold);}
.oc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;}
.oc-client{font-size:15px;font-weight:900;}
.oc-badge{font-size:12px;font-weight:700;padding:3px 8px;border-radius:10px;white-space:nowrap;}
.b-new{background:rgba(136,136,136,0.15);color:var(--muted);}
.b-done{background:rgba(39,174,96,0.2);color:var(--green);}
.b-prog{background:rgba(201,168,76,0.2);color:var(--gold);}
.oc-meta{font-size:12px;color:var(--muted);margin-bottom:7px;}
.oc-tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px;}
.oc-tag{font-size:12px;font-weight:700;padding:2px 7px;border-radius:3px;}
.tg{background:rgba(41,128,185,0.15);color:#5dade2;}
.tc{background:rgba(142,68,173,0.15);color:#a569bd;}
.tm{background:rgba(255,255,255,0.06);color:var(--muted);}
.oc-prog{display:flex;align-items:center;gap:8px;}
.oc-bar{flex:1;height:4px;background:rgba(255,255,255,0.08);border-radius:2px;overflow:hidden;}
.oc-fill{height:100%;border-radius:2px;transition:width 0.3s;}
.oc-cnt{font-size:12px;font-weight:700;white-space:nowrap;}
.oc-note{font-size:12px;color:var(--gold);background:rgba(201,168,76,0.08);padding:4px 8px;border-right:2px solid var(--gold);margin-top:6px;border-radius:0 3px 3px 0;}
.note-btn-inline{background:rgba(201,168,76,0.15);border:none;color:var(--gold);font-size:13px;cursor:pointer;padding:2px 6px;border-radius:4px;line-height:1;}
.note-btn-inline:hover{background:rgba(201,168,76,0.3);}
/* SKETCH VIEW */
.sketch-view{flex:1;display:none;flex-direction:column;overflow:hidden;}
.sketch-hdr{flex-shrink:0;padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--border);}
.sh-client{font-size:14px;font-weight:900;color:var(--gold);}
.sh-meta{font-size:12px;color:var(--muted);margin-top:1px;}
.sh-note{font-size:12px;color:var(--gold);background:rgba(201,168,76,0.08);padding:3px 8px;border-right:2px solid var(--gold);margin-top:4px;}
.sketch-area{flex:1;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#0d0d0d;position:relative;min-height:0;touch-action:none;}
.sketch-wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center;transform-origin:center center;}
.sketch-wrap svg,.sketch-wrap img{width:100%;height:100%;object-fit:contain;display:block;}
.btmbar{flex-shrink:0;background:var(--surface);border-top:1px solid var(--border);padding:8px 12px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.zbtn{width:34px;height:34px;border-radius:4px;background:var(--s2);border:1px solid var(--border);color:var(--text);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.sp{flex:1;}
.icnt{font-size:12px;color:var(--muted);}.icnt strong{color:var(--gold);}
.prog-wrap{display:flex;align-items:center;gap:6px;}
.prog-text{font-size:12px;font-weight:700;color:var(--gold);}
.prog-bar{width:55px;height:5px;background:rgba(255,255,255,0.1);border-radius:3px;overflow:hidden;}
.prog-fill{height:100%;background:var(--green);border-radius:3px;transition:width 0.3s;}
.banner{position:absolute;inset:0;background:rgba(39,174,96,0.96);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:20;}
.banner h2{font-size:22px;font-weight:900;color:#fff;}
.ban-btn{padding:11px 22px;font-family:Heebo,sans-serif;font-size:13px;font-weight:900;border:none;cursor:pointer;border-radius:5px;}
/* SHEET */
.sheet{position:absolute;bottom:0;right:0;left:0;background:var(--surface);border-top:2px solid var(--gold);max-height:60%;overflow-y:auto;transform:translateY(100%);transition:transform 0.28s;z-index:10;}
.sheet.open{transform:translateY(0);}
.sh-head{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--surface);}
.sh-hdr-t{font-size:12px;font-weight:700;color:var(--gold);letter-spacing:0.1em;text-transform:uppercase;}
.si{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;cursor:pointer;}
.si:active{background:var(--s2);}.si.on{background:rgba(39,174,96,0.08);}
.si-chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
.si.on .si-chk{background:var(--green);border-color:var(--green);color:#fff;}
.si-name{font-size:13px;font-weight:700;flex:1;}.si-dim{font-size:12px;color:var(--muted);}
.si-tag{font-size:12px;padding:2px 7px;border-radius:2px;font-weight:700;}
.grp-hdr{padding:6px 14px;background:rgba(201,168,76,0.1);border-bottom:1px solid rgba(201,168,76,0.2);font-size:12px;font-weight:700;color:var(--gold);display:flex;justify-content:space-between;align-items:center;}
.note-area{padding:12px 14px;background:var(--s2);}
.note-area textarea{width:100%;padding:8px;background:var(--bg);border:1px solid var(--border);font-family:Heebo,sans-serif;font-size:13px;color:var(--text);outline:none;border-radius:4px;resize:vertical;min-height:64px;}
.note-area textarea:focus{border-color:var(--gold);}
.note-save{margin-top:6px;padding:8px 16px;background:var(--gold);color:#1a1714;font-family:Heebo,sans-serif;font-size:12px;font-weight:700;border:none;cursor:pointer;border-radius:4px;}
/* OVERLAYS */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.82);z-index:400;display:none;align-items:center;justify-content:center;padding:20px;}
.overlay.open{display:flex;}
.np-box{background:#fff;border-radius:12px;padding:28px 24px;max-width:340px;width:100%;text-align:center;font-family:Heebo,sans-serif;direction:rtl;}
.np-icon{font-size:44px;margin-bottom:12px;}.np-title{font-size:15px;font-weight:900;color:var(--red);margin-bottom:8px;}
.np-text{font-size:15px;color:#1a1714;line-height:1.6;margin-bottom:20px;font-weight:600;}
.np-ok{width:100%;padding:14px;background:var(--red);color:#fff;font-family:Heebo,sans-serif;font-size:15px;font-weight:900;border:none;cursor:pointer;border-radius:6px;}
.qn-box{background:var(--surface);border-radius:10px;padding:20px;max-width:320px;width:100%;direction:rtl;}
.qn-box h3{font-size:14px;font-weight:900;color:var(--gold);margin-bottom:12px;}
.qn-box textarea{width:100%;padding:10px;background:var(--bg);border:1px solid var(--border);font-family:Heebo,sans-serif;font-size:14px;color:var(--text);outline:none;border-radius:6px;resize:vertical;min-height:80px;}
.qn-btns{display:flex;gap:7px;margin-top:10px;}
.qn-save{flex:1;padding:10px;background:var(--gold);color:#1a1714;font-family:Heebo,sans-serif;font-size:13px;font-weight:900;border:none;cursor:pointer;border-radius:5px;}
.qn-cancel{padding:10px 14px;background:var(--s2);color:var(--muted);font-family:Heebo,sans-serif;font-size:12px;border:1px solid var(--border);cursor:pointer;border-radius:5px;}
.adv-box{background:#fff;border-radius:12px;padding:24px 20px;max-width:300px;width:100%;text-align:center;font-family:Heebo,sans-serif;direction:rtl;}
.cb-box{background:var(--surface);max-width:480px;width:100%;max-height:85vh;overflow-y:auto;border-radius:10px;}
.cb-hdr{padding:16px 18px;background:var(--purple);display:flex;align-items:center;justify-content:space-between;border-radius:10px 10px 0 0;}
.cb-hdr h3{font-size:15px;font-weight:900;color:#fff;}
.cb-body{padding:16px 18px;}
.cb-item{padding:10px 0;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.cb-foot{padding:14px 18px;border-top:1px solid var(--border);display:flex;gap:8px;}
/* EDITOR */
#csEd{display:none;position:fixed;inset:0;z-index:500;background:#1a1714;flex-direction:column;direction:rtl;}
#csEd.open{display:flex;}
.ed-top{flex-shrink:0;height:48px;background:#242424;border-bottom:1px solid rgba(255,255,255,0.07);display:flex;align-items:center;gap:7px;padding:0 13px;}
.ed-ttl{font-size:12px;font-weight:700;color:#f0ede8;flex:1;}
.ed-tools{flex-shrink:0;background:#1e1b18;border-bottom:1px solid rgba(255,255,255,0.07);padding:7px 12px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.eb{padding:5px 10px;border-radius:4px;font-family:Heebo,sans-serif;font-size:12px;font-weight:700;border:1px solid rgba(255,255,255,0.1);cursor:pointer;background:rgba(255,255,255,0.07);color:rgba(247,244,239,0.7);}
.eb.on{background:var(--gold);color:#1a1714;border-color:var(--gold);}
.esep{width:1px;height:22px;background:rgba(255,255,255,0.08);flex-shrink:0;}
.ecol{width:24px;height:24px;border-radius:50%;cursor:pointer;flex-shrink:0;border:2px solid rgba(255,255,255,0.15);}
.ecol.on{border-color:#fff;transform:scale(1.1);}
.erw{display:flex;align-items:center;gap:4px;}
.erw label{font-size:12px;color:rgba(247,244,239,0.35);white-space:nowrap;}
.erw input[type=range]{width:60px;cursor:pointer;}
.erw span{font-size:12px;color:rgba(247,244,239,0.4);min-width:16px;}
.ed-txtbar{flex-shrink:0;background:#1e1b18;border-bottom:1px solid rgba(255,255,255,0.07);padding:6px 12px;display:none;align-items:center;gap:7px;}
.ed-txtbar input{flex:1;padding:6px 9px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);color:#f0ede8;font-family:Heebo,sans-serif;font-size:14px;border-radius:4px;outline:none;}
.ed-canvas{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#111;touch-action:none;}
#edBg{position:absolute;max-width:100%;max-height:100%;object-fit:contain;user-select:none;pointer-events:none;}
#edCvs{position:absolute;touch-action:none;}
.eact{padding:6px 13px;font-family:Heebo,sans-serif;font-size:12px;font-weight:700;border:none;cursor:pointer;border-radius:4px;}
.esave{background:var(--green);color:#fff;}.ecancel{background:transparent;color:rgba(247,244,239,0.4);border:1px solid rgba(255,255,255,0.1);}
.eundo,.eclear{background:rgba(255,255,255,0.07);color:rgba(247,244,239,0.7);border:1px solid rgba(255,255,255,0.1);}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:10px 20px;border-radius:6px;font-family:Heebo,sans-serif;font-size:13px;font-weight:700;z-index:600;box-shadow:0 4px 20px rgba(0,0,0,0.4);pointer-events:none;}

/* ═══ UNIFIED NAV ═══ */
.unav-sidebar{width:210px;flex-shrink:0;background:#1a1714;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:50;}
.unav-logo{padding:20px 16px 12px;border-bottom:1px solid rgba(255,255,255,0.07);}
.unav-logo .lg{font-family:'Playfair Display',serif;font-size:18px;font-weight:900;color:#f7f4ef;}
.unav-logo .lg span{color:#b8922a;}
.unav-logo .sub{font-size:12px;color:rgba(247,244,239,0.3);letter-spacing:0.12em;text-transform:uppercase;margin-top:2px;}
.unav-nav{flex:1;padding:8px 0;}
.unav-sec{font-size:12px;font-weight:700;letter-spacing:0.15em;color:rgba(247,244,239,0.25);text-transform:uppercase;padding:12px 16px 4px;}
.unav-a{display:flex;align-items:center;gap:10px;padding:9px 16px;color:rgba(247,244,239,0.55);font-size:13px;text-decoration:none;transition:all 0.15s;cursor:pointer;border:none;background:none;width:100%;text-align:right;font-family:Heebo,sans-serif;}
.unav-a:hover{background:rgba(255,255,255,0.05);color:#f7f4ef;}
.unav-a.active{background:rgba(184,146,42,0.15);color:#b8922a;font-weight:700;}
.unav-a .ic{font-size:15px;flex-shrink:0;}
.unav-bot{padding:12px 16px;border-top:1px solid rgba(255,255,255,0.07);}
.unav-bot a{display:block;font-size:12px;color:rgba(192,57,43,0.55);text-decoration:none;padding:4px 0;}
.unav-bot a:hover{color:#e74c3c;}
.unav-topbar{display:none;background:#1a1714;padding:0 16px;height:52px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.unav-topbar .lg{font-family:'Playfair Display',serif;font-size:16px;font-weight:900;color:#f7f4ef;}
.unav-topbar .lg span{color:#b8922a;}
.unav-burger{background:none;border:none;cursor:pointer;padding:6px;display:flex;flex-direction:column;gap:4px;}
.unav-burger span{display:block;width:20px;height:2px;background:#f7f4ef;border-radius:1px;}
.unav-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:90;}
.unav-overlay.open{display:block;}
.unav-sidebar.mobile-open{transform:translateX(0)!important;}
/* ── אייפד / מובייל ── */
@media(max-width:1024px){
  /* כפתורים גדולים יותר למגע */
  .zbtn{width:44px;height:44px;font-size:20px;}
  .tb-btn{min-height:44px;padding:10px 16px;font-size:13px;}
}
@media(max-width:768px){
  .app{height:100vh;}
  /* btmbar קבוע לתחתית — לא נחתך */
  .btmbar{
    position:fixed;bottom:0;left:0;right:0;z-index:30;
    padding:10px 14px;
    padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
    background:var(--surface);
    border-top:1px solid var(--border);
  }
  /* מרווח מהכפתורים הקבועים */
  .sketch-area{padding-bottom:72px;}
  /* כפתור "סיים סקיצה" — רחב ובולט */
  #finishBtn{flex:1;font-size:15px;padding:12px 16px;justify-content:center;}
  /* הסתר כפתורי zoom על אייפד — ניתן לזום עם אצבעות */
  .zbtn-zoom{display:none;}
}

  </div>

  <div class="ed-canvas" id="edWrap"><img id="edBg" src="" alt=""><canvas id="edCvs"></canvas></div>

<script>
const safeStorage = {
  _mem: {},
  getItem(k){ try{ return localStorage.getItem(k); }catch(e){ return this._mem[k]||null; } },
  setItem(k,v){ try{ localStorage.setItem(k,v); }catch(e){ this._mem[k]=v; } },
  removeItem(k){ try{ localStorage.removeItem(k); }catch(e){ delete this._mem[k]; } }
};

// STATE
let orders=[],cs={},notes={},cur=null,scl=1,px=0,py=0,qnId=null,chDone=[];
let activeTab='active'; // 'active' | 'done'
let wdInChisum=[];
let _csUnsub=null, _wdRef=null, _checkEditsRef=null;
let _wdReady=false, _ordersReady=false; // דגלי טעינה — מונעים render לפני שהכל מוכן
let _sendingToFactory=false; // מונע double-tap על "שלח למפעל"
let _csGlobalPrices={}, _csClientPrices={}; // לנעילת מחיר במעבר ל-done (lgLockAndAdvance)
// סימונים זמניים לבדיקה — נשמרים ב-Firebase בנתיב נפרד, לא נוגעים ב-orders
window._csCheckEdits = {};

function setTab(t){
  activeTab=t;
  const tA=document.getElementById('tabActive');
  const tD=document.getElementById('tabDone');
  tA.style.color=t==='active'?'var(--gold)':'var(--muted)';
  tA.style.borderBottomColor=t==='active'?'var(--gold)':'transparent';
  tD.style.color=t==='done'?'var(--green)':'var(--muted)';
  tD.style.borderBottomColor=t==='done'?'var(--green)':'transparent';
  renderList();
}


function mapFirebaseOrder(o){
  // Firebase מחזיר לפעמים items כאובייקט {0:{..},1:{..}} — הבטח מערך
  const rawItems = o.items;
  const itemsArr = Array.isArray(rawItems) ? rawItems
    : (rawItems && typeof rawItems === 'object') ? Object.values(rawItems)
    : [];
  return {
    id:           String(o.id),
    orderClient:  o.orderClient||o.client||'—',
    orderNum:     o.orderNum||o.refNum||'',
    sketchName:   o.sketchName||o.type||'',
    type:         o.type||'',
    glass:        o.glassFullName||o.glass||'',
    glassFullName:o.glassFullName||o.glass||'',
    finish:       o.finish||'',
    source:       o.source||'sketch',
    sketch:       o.sketch||(o.files&&o.files.f0&&o.files.f0.data)||null,
    // ציור בדיקה זמני — מגיע מ-checkEdits Firebase (נתיב נפרד, לא נוגע ב-orders)
    // fallback: localStorage אם Firebase עדיין לא נטען
    _editedSketch: window._csCheckEdits[String(o.id)] ||
                   (()=>{ try{ return JSON.parse(safeStorage.getItem('lgCSEdits')||'{}')[String(o.id)]||null; }catch(e){ return null; } })(),
    items:        itemsArr,
    panels:       Array.isArray(o.panels)?o.panels:Object.values(o.panels||{}),
  };
}

function load(){
  // cs נטען מ-Firebase (ב-_wdRef) — localStorage משמש כ-fallback בלבד עד שהנתון מגיע
  cs=JSON.parse(safeStorage.getItem('lgCheckState')||'{}');
  notes=JSON.parse(safeStorage.getItem('lgOrderNotes')||'{}');

  // מחירים — נדרש כדי לנעול מחיר (lgLockAndAdvance) כשהזמנה מגיעה ל-done כאן
  listenAllPrices((gp, cp) => { _csGlobalPrices = gp; _csClientPrices = cp; });

  // Subscribe to workday — inChisum + checkState
  if(_wdRef) firebase.database().ref('workday').off('value', _wdRef);
  _wdRef = firebase.database().ref('workday').on('value', snap=>{
    const wd = snap.val()||{};
    function objToArr(v){ return v ? Object.values(v).map(String) : []; }
    wdInChisum = objToArr(wd.inChisum);

    // Firebase הוא מקור האמת לסימוני הבדיקה. localStorage הוא מטמון תצוגה בלבד.
    // קודם היה כאן ענף "שחזור" שדחף את התוכן המקומי בחזרה לענן כשהצומת היה ריק —
    // הוא נועד להגן מפני saveWorkDay שמחק את checkState, אבל אותו באג כבר תוקן
    // (update במקום set, בשני המקומות). מה שנשאר היה ההפך: הוא היה מבטל כל מחיקה
    // לגיטימית ומחזיר סימונים ישנים, כך שהזמנה חוזרת נראית "נבדקה" בלי שנבדקה.
    if(!_csLocalPending){
      cs = (wd.checkState && typeof wd.checkState === 'object') ? wd.checkState : {};
      safeStorage.setItem('lgCheckState', JSON.stringify(cs));
    }

    _wdReady = true;
    if(_ordersReady) _filterOrders();
  }, err => _csListenerFailed('workday', err));

  // Subscribe to checkEdits — סימונים זמניים בנתיב נפרד לגמרי מ-orders
  if(_checkEditsRef) firebase.database().ref('checkEdits').off('value', _checkEditsRef);
  _checkEditsRef = firebase.database().ref('checkEdits').on('value', snap=>{
    window._csCheckEdits = snap.val() || {};
    // עדכן גם localStorage כ-fallback
    try{ safeStorage.setItem('lgCSEdits', JSON.stringify(window._csCheckEdits)); }catch(e){}
    // רענן סקיצה אם פתוחה
    if(cur) renderSketch();
  }, err => console.error('[CS] checkEdits listener failed:', err)); // לא חוסם עבודה — רק ציורי בדיקה

  // Subscribe to all orders
  if(_csUnsub) _csUnsub();
  _csUnsub = listenAllOrders(function(fbOrders){
    window._allCsOrders = fbOrders;
    _ordersReady = true;
    if(_wdReady) _filterOrders();
  }, err => _csListenerFailed('orders', err));
}

function _filterOrders(){
  const fbOrders = window._allCsOrders || [];
  orders = fbOrders.filter(o=>wdInChisum.includes(String(o.id))).map(mapFirebaseOrder);
  // אם יש הזמנה פתוחה — עדכן cur לאובייקט החדש אבל שמר _editedSketch אם כבר טעון
  if(cur){
    const rebuilt = orders.find(o => o.id === cur.id);
    if(rebuilt){
      if(!rebuilt._editedSketch && cur._editedSketch) rebuilt._editedSketch = cur._editedSketch;
      cur = rebuilt;
    }
  }
  buildClients();
  renderList();
  updateTabCounts();
  // הסתר loading overlay אחרי הטעינה הראשונה
  const ov = document.getElementById('lgLoading');
  if (ov) { ov.style.opacity = '0'; ov.style.transition = 'opacity 0.3s'; setTimeout(() => ov.remove(), 320); }
}

// כשל listener (הרשאות/רשת) השאיר קודם ספינר טעינה לנצח בלי שום הודעה, כי
// ה-overlay מוסר רק ב-_filterOrders שלעולם לא רץ. עכשיו מוצגת שגיאה ברורה.
function _csListenerFailed(what, err){
  console.error('[CS] listener failed:', what, err);
  const ov = document.getElementById('lgLoading');
  if(ov){
    ov.innerHTML = `<div style="text-align:center;font-family:Heebo,sans-serif;direction:rtl;padding:24px;">
      <div data-icon="alert" style="width:38px;height:38px;margin:0 auto 10px"></div>
      <div style="font-size:15px;font-weight:700;margin-bottom:6px">לא ניתן לטעון את תחנת הבדיקה</div>
      <div style="font-size:12px;color:#888;margin-bottom:14px">${lgEsc(what)} — ${lgEsc((err && err.message) || 'שגיאת חיבור')}</div>
      <button onclick="location.reload()" style="padding:9px 20px;background:#b8922a;color:var(--on-gold);border:none;border-radius:6px;font-family:Heebo,sans-serif;font-size:13px;font-weight:700;cursor:pointer;">רענן</button>
    </div>`;
  } else {
    toast('⚠️ שגיאת חיבור — רענן את הדף');
  }
}

// _csLocalPending: מונע מה-listener לדרוס cs בזמן שאנחנו כותבים ל-Firebase
let _csLocalPending = false;

async function saveCS(){
  _csLocalPending = true;
  safeStorage.setItem('lgCheckState', JSON.stringify(cs));
  try {
    await firebase.database().ref('workday/checkState').set(cs);
  } catch(e) {
    console.error('[CS] saveCS Firebase error:', e);
    throw e; // חייב לעלות לקורא — אחרת finishSketch/checkItem "יצליחו" גם כשהשמירה נכשלה
  } finally {
    _csLocalPending = false;
  }
}
function saveNotes(){ safeStorage.setItem('lgOrderNotes',JSON.stringify(notes)); }
// מחזיר רק indices של פריטי חיסום (לא ליטוש)
function chisumIdxs(o){ return (o.items||[]).map((_,i)=>i).filter(i=>!!(o.items||[])[i]?.chisum); }
function buildClients(){
  const cl=[...new Set(orders.map(o=>o.orderClient).filter(Boolean))];
  document.getElementById('fClient').innerHTML='<option value="">כל הלקוחות</option>'+cl.map(c=>`<option value="${lgEsc(c)}">${lgEsc(c)}</option>`).join('');
}

// FILTER + RENDER LIST
function isDone(o){
  const idxs = chisumIdxs(o);
  if(!idxs.length) return false;
  return idxs.every(i => cs[o.id]?.[i]);
}

function getFiltered(){
  const q=(document.getElementById('fSearch')?.value||'').toLowerCase();
  const gf=document.getElementById('fGlass')?.value||'';
  const cf=document.getElementById('fClient')?.value||'';
  const sort=document.getElementById('fSort')?.value||'';
  let list=orders.filter(o=>{
    // tab filter
    if(activeTab==='active' && isDone(o)) return false;
    if(activeTab==='done'   && !isDone(o)) return false;
    if(q&&!(o.orderClient+o.sketchName+o.orderNum+(o.glassFullName||'')).toLowerCase().includes(q))return false;
    if(gf&&!(o.glassFullName||'').includes(gf))return false;
    if(cf&&o.orderClient!==cf)return false;
    return true;
  });
  if(sort==='desc') list=[...list].sort((a,b)=>{
    const mA=Math.max(...(a.items||[{w:1,h:1}]).map(i=>(i.w||0)*(i.h||0)));
    const mB=Math.max(...(b.items||[{w:1,h:1}]).map(i=>(i.w||0)*(i.h||0)));
    return mB-mA;
  });
  if(sort==='asc') list=[...list].sort((a,b)=>{
    const mA=Math.max(...(a.items||[{w:1,h:1}]).map(i=>(i.w||0)*(i.h||0)));
    const mB=Math.max(...(b.items||[{w:1,h:1}]).map(i=>(i.w||0)*(i.h||0)));
    return mA-mB;
  });

  return list;
}

function renderList(){
  const list=getFiltered();
  const el=document.getElementById('listView');
  if(!list.length){
    const doneCount = orders.filter(isDone).length;
    const emptyMsg = activeTab==='done'
      ? `<div class="list-empty"><div style="font-size:44px">✅</div><p style="font-size:14px">אין הזמנות שהושלמו עדיין</p><p style="font-size:12px;color:var(--muted)">סמן פריטים ולחץ "סיים סקיצה" כדי להעביר לכאן</p></div>`
      : doneCount>0
        ? `<div class="list-empty"><div style="font-size:44px">🎉</div><p style="font-size:14px;font-weight:700">כל הסקיצות הושלמו!</p><p style="font-size:12px;color:var(--muted)">עבור לטאב "הושלמו" כדי לשלוח דוח לחיסום</p></div>`
        : `<div class="list-empty"><div style="font-size:44px">🔍</div><p style="font-size:14px">אין הזמנות לבדיקה</p></div>`;
    el.innerHTML = emptyMsg;
    return;
  }
  // כפתור "שלח לחיסום" בטאב הושלמו
  const sendBtn = activeTab==='done' ? `<div style="padding:12px 14px;background:rgba(142,68,173,0.1);border-bottom:2px solid var(--purple);">
    <button onclick="sendAllToFactory()" style="width:100%;padding:13px;background:var(--purple);color:#fff;font-family:Heebo,sans-serif;font-size:14px;font-weight:900;border:none;cursor:pointer;border-radius:6px;">
      🔥 סיים יום — שלח ${list.length} הזמנות לחיסום והוצא דוח
    </button>
  </div>` : '';
  el.innerHTML = sendBtn + list.map(o=>{
    const idxs=chisumIdxs(o),total=idxs.length||1;
    const checked=idxs.filter(i=>cs[o.id]?.[i]).length;
    const pct=Math.round(checked/total*100),done=pct===100,fresh=checked===0;
    const note=notes[o.id]||'';
    const badgeCls=done?'b-done':fresh?'b-new':'b-prog';
    const badgeTxt=done?'✓ הושלם':fresh?'ממתין':`${checked}/${total}`;
    const cardCls=done?'done-card':checked>0?'partial-card':'';
    return `<div class="order-card ${cardCls}" onclick="selectOrder('${o.id}')">
      <div class="oc-top">
        <div class="oc-client">${lgEsc(o.orderClient)}</div>
        <div style="display:flex;align-items:center;gap:6px">
          <button class="note-btn-inline" onclick="event.stopPropagation();openQN('${o.id}')">📝</button>
          <span class="oc-badge ${badgeCls}">${badgeTxt}</span>
        </div>
      </div>
      <div class="oc-meta">${lgEsc(o.orderNum||'—')} · ${lgEsc(o.sketchName||o.type||'')}</div>
      ${o.sketch?`<img src="${lgEsc(o.sketch)}" style="width:100%;max-height:120px;object-fit:cover;border-top:1px solid var(--border);border-bottom:1px solid var(--border);" alt="סקיצה">` : ''}
      <div class="oc-tags">
        <span class="oc-tag tg">${lgEsc(o.glassFullName||o.glass||'')}</span>
        <span class="oc-tag tc">🔥 חיסום · ${total} פריטים</span>
        ${o.source==='upload'?'<span class="oc-tag tm">📎 העלאה</span>':''}
      </div>
      <div class="oc-prog">
        <div class="oc-bar"><div class="oc-fill" style="width:${pct}%;background:${done?'var(--green)':'var(--gold)'}"></div></div>
        <span class="oc-cnt" style="color:${done?'var(--green)':'var(--muted)'}">${checked}/${total} פריטים</span>
      </div>
      ${note?`<div class="oc-note">📌 ${lgEsc(note.slice(0,60))}${note.length>60?'...':''}</div>`:''}
    </div>`;
  }).join('');
}

// VIEW SWITCH

// SKETCH
function _attachSVGTouchHandlers(el){
  el.querySelectorAll('rect[data-idx]').forEach(rect=>{
    const idx=parseInt(rect.getAttribute('data-idx'));
    rect.addEventListener('touchend', e=>{
      e.preventDefault();
      e.stopPropagation();
      checkItem(idx);
    },{passive:false,once:true});
  });
}

function _showSketchImg(el, src, fallbackSrc, readOnly){
  el.innerHTML='';
  const img=document.createElement('img');
  img.style.cssText='width:100%;height:100%;object-fit:contain;display:block;';
  img.onerror=()=>{
    // תמונה נפגמה — נסה original sketch כ-fallback
    if(fallbackSrc && img.src !== fallbackSrc){
      console.warn('[CS] edited sketch failed to load, falling back to original');
      img.src=fallbackSrc;
    } else {
      // גם original לא זמין — הצג SVG
      el.innerHTML=buildSVG(cur, readOnly);
      if(!readOnly) _attachSVGTouchHandlers(el);
      setupPan();
    }
  };
  img.src=src;
  el.appendChild(img);
}

function renderSketch(){
  const el=document.getElementById('skWrap');
  scl=1;px=0;py=0;el.style.transform='';
  // תמיד קרא _editedSketch בזמן אמת — מונע snapshot ישן אחרי rebuild של orders
  const liveEdited = (window._csCheckEdits||{})[String(cur.id)] || cur._editedSketch || null;
  if(liveEdited && liveEdited !== cur._editedSketch) cur._editedSketch = liveEdited;
  const readOnly=curReadOnly;
  if(liveEdited){
    // edited sketch עם fallback ל-original אם נפגמה
    _showSketchImg(el, liveEdited, cur.sketch, readOnly);
  } else if(cur.sketch){
    // original sketch בלבד
    _showSketchImg(el, cur.sketch, null, readOnly);
  } else {
    // אין תמונה — הצג SVG
    el.innerHTML=buildSVG(cur, readOnly);
    if(!readOnly) _attachSVGTouchHandlers(el);
  }
  setupPan();
}

function buildSVG(o, readOnly=false){
  const idxs = chisumIdxs(o);
  const allItems = o.items||[];
  if(!idxs.length) return '<div style="color:#555;padding:20px;font-size:13px;text-align:center">אין פריטי חיסום</div>';
  const n=idxs.length,cols=Math.min(n,3),rows=Math.ceil(n/cols);
  const PW=150,PH=230,GAP=22,PX=50,PY=55,HDR=44,FTR=26;
  const W=PX*2+cols*PW+(cols-1)*GAP,H=HDR+PY+rows*PH+(rows-1)*GAP+PY*0.5+FTR;
  let p='';
  idxs.forEach((origIdx, pos)=>{
    const item=allItems[origIdx];
    const col=pos%cols,row=Math.floor(pos/cols),x=PX+col*(PW+GAP),y=HDR+PY+row*(PH+GAP);
    const ck=!!(cs[o.id]?.[origIdx]);
    const stk=ck?'#27ae60':'#8e44ad',fl=ck?'rgba(39,174,96,0.12)':'rgba(142,68,173,0.07)';
    const mx=x+PW/2,my=y+PH/2;
    p+=`<rect x="${x}" y="${y}" width="${PW}" height="${PH}" rx="4" fill="${fl}" stroke="${stk}" stroke-width="1.8" ${readOnly?'':'data-idx="'+origIdx+'" onclick="checkItem('+origIdx+')"'} style="cursor:${readOnly?'default':'pointer'}"/>`;
    if(ck)p+=`<text x="${mx}" y="${my-14}" text-anchor="middle" font-family="Heebo,sans-serif" font-size="24" fill="#27ae60">✓</text>`;
    p+=`<text x="${mx}" y="${ck?my+8:my-2}" text-anchor="middle" font-family="Heebo,sans-serif" font-size="12" font-weight="700" fill="${ck?'#27ae60':'#1a1714'}">${lgEsc(item.name||'')}</text>`;
    if(item.w&&item.h)p+=`<text x="${mx}" y="${ck?my+22:my+13}" text-anchor="middle" font-family="Heebo,sans-serif" font-size="11" fill="#666">${item.w}×${item.h} מ"מ</text>`;
    p+=`<line x1="${x}" y1="${y-6}" x2="${x+PW}" y2="${y-6}" stroke="rgba(201,168,76,0.5)" stroke-width="0.8"/>`;
    if(item.w)p+=`<text x="${mx}" y="${y-9}" text-anchor="middle" font-family="Heebo,sans-serif" font-size="9" fill="rgba(201,168,76,0.9)">${item.w}</text>`;
    p+=`<line x1="${x+PW+5}" y1="${y}" x2="${x+PW+5}" y2="${y+PH}" stroke="rgba(201,168,76,0.5)" stroke-width="0.8"/>`;
    if(item.h)p+=`<text x="${x+PW+17}" y="${my}" text-anchor="middle" font-family="Heebo,sans-serif" font-size="9" fill="rgba(201,168,76,0.9)" transform="rotate(90,${x+PW+17},${my})">${item.h}</text>`;
    p+=`<rect x="${mx-30}" y="${y+PH-19}" width="60" height="14" rx="3" fill="rgba(142,68,173,0.12)"/>`;
    p+=`<text x="${mx}" y="${y+PH-8}" text-anchor="middle" font-family="Heebo,sans-serif" font-size="9" font-weight="700" fill="#8e44ad">🔥 חיסום</text>`;
  });
  return`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;max-width:100%;max-height:100%">
    <rect width="${W}" height="${H}" fill="white"/>
    <rect x="0" y="0" width="${W}" height="${HDR}" fill="#1a1714"/>
    <text x="${W/2}" y="18" text-anchor="middle" font-family="Heebo,sans-serif" font-size="12" font-weight="700" fill="#c9a84c">${lgEsc(o.orderClient)}</text>
    <text x="${W/2}" y="34" text-anchor="middle" font-family="Heebo,sans-serif" font-size="9" fill="rgba(247,244,239,0.4)">${lgEsc([o.orderNum,o.sketchName||o.type].filter(Boolean).join(' · '))} · ${n} פריטי חיסום</text>
    ${p}
    <text x="${W-8}" y="${H-8}" text-anchor="end" font-family="Heebo,sans-serif" font-size="8" font-weight="700" fill="#b8922a">LuzGlass</text>
  </svg>`;
}

// CHECK
function checkItem(i){
  if(!cur||curReadOnly)return; // אסור לסמן פריטים בסקיצה שהושלמה
  // ה-listener של workday מחליף את כל אובייקט cs בכל שינוי בצומת (כולל
  // updatedAt שנכתב בכל שמירה של יום עבודה). בלי ההגנה הזו, שינוי כזה בזמן
  // שהזמנה פתוחה גרם ל-TypeError שקט בכל הקלקה — ומאותו רגע שום סימון לא נרשם.
  if(!cs[cur.id]) cs[cur.id] = {};
  cs[cur.id][i]=!cs[cur.id][i];
  saveCS().catch(()=>toast('⚠️ הסימון לא נשמר בענן — בדוק חיבור אינטרנט'));
  renderSketch();updateProg();
  if(document.getElementById('sheet').classList.contains('open'))renderSheet();
  const idxs=chisumIdxs(cur);
  if(idxs.length&&idxs.every(j=>cs[cur.id]?.[j])){
    showBanner();
    setTimeout(updateTabCounts,300);
  }
}

function updateTabCounts(){
  const active=orders.filter(o=>!isDone(o)).length;
  const done=orders.filter(o=>isDone(o)).length;
  document.getElementById('tabActive').textContent=`🔍 לבדיקה (${active})`;
  document.getElementById('tabDone').textContent=`✅ הושלמו (${done})`;
}

function updateProg(){
  if(!cur)return;
  const idxs=chisumIdxs(cur),total=idxs.length;
  const checked=idxs.filter(i=>cs[cur.id]?.[i]).length;
  const pct=total?Math.round(checked/total*100):0;
  document.getElementById('progText').textContent=`${checked}/${total}`;
  document.getElementById('progFill').style.width=pct+'%';
  document.getElementById('progFill').style.background=pct===100?'var(--green)':'var(--gold)';
  document.getElementById('iCnt').innerHTML=`<strong>${checked}</strong>/<strong>${total}</strong> חיסום`;
  document.getElementById('finishBtn').style.display='flex';
}

let _finishingSketch = false; // מונע לחיצה כפולה — משוחרר תמיד ב-finally, לא נשאר תקוע
async function finishSketch(){
  if(!cur || _finishingSketch) return;
  _finishingSketch = true;
  const btn = document.getElementById('finishBtn');
  if(btn) btn.disabled = true;
  try {
    if(!cs[cur.id]) cs[cur.id] = {};
    chisumIdxs(cur).forEach(i => { cs[cur.id][i] = true; });
    await saveCS(); // ממתין בפועל — לא מסתירים/מאפסים לפני שהשמירה אושרה
    hideBanner();
    cur = null;
    // נשאר בטאב "לבדיקה" — הסקיצה שהושלמה נעלמת אוטומטית מהרשימה (isDone מסנן אותה)
    // אין מעבר ל"הושלמו" — מונע לחיצה כפולה בטעות על אותה סקיצה
    setTab('active');
    showList();
    toast('✓ הסקיצה הושלמה');
  } catch(e) {
    console.error('[CS] finishSketch error:', e);
    toast('⚠️ השמירה נכשלה — בדוק חיבור אינטרנט ונסה שוב');
    // לא מאפסים cur/לא עוברים למסך הרשימה — המשתמש נשאר על הסקיצה כדי לנסות שוב
  } finally {
    _finishingSketch = false;
    if(btn) btn.disabled = false;
  }
}

// מספר רץ לדוחות חיסום — transaction אטומי, אותו דפוס כמו lgNextOrderNum
// ב-firebase-db.js. קודם זה היה once('value') ואז set(), כלומר שני טאבים או
// ריטריי יכלו להפיק את אותו מספר — ואז workday מקבץ שתי קבוצות שונות לדוח אחד.
async function _createReportNum(){
  const ref = firebase.database().ref('meta/chisumCounter');
  const result = await ref.transaction(current => (current || 0) + 1);
  return String(result.snapshot.val());
}

// שלח את כל ההזמנות שהושלמו למפעל + הפק דוח ממוספר
async function sendAllToFactory(){
  if(_sendingToFactory) return; // מונע double-tap
  _sendingToFactory = true;
  chDone = []; // אפס לפני כל שליחה חדשה
  const sendBtn = document.querySelector('button[onclick="sendAllToFactory()"]');
  if(sendBtn){ sendBtn.disabled=true; sendBtn.textContent='⏳ שולח...'; }
  // פתח חלון דוח עכשיו (sync, בתוך gesture) — browsers חוסמים window.open אחרי await
  const printWin = window.open('', '_blank');
  try {
  const doneOrds = orders.filter(isDone);
  if(!doneOrds.length){
    toast('אין הזמנות שהושלמו');
    if(printWin && !printWin.closed) printWin.close(); // אחרת נשאר טאב ריק פתוח
    return;
  }

  const reportId  = 'chisum_' + Date.now();
  const reportNum = await _createReportNum();

  // שלב 1: עדכן כל ההזמנות ב-Firebase — המתן לסיום לפני עדכון inChisum
  // (מונע מצב שבו inChisum מתעדכן לפני שה-stage של ההזמנה מוכן).
  // כל כשל נאסף ל-failed ולא נבלע: הזמנה שנכשלה נשארת בתור, לא נכנסת לדוח,
  // ולא מדווחת כ"נשלחה". קודם כל כשל נבלע — ההזמנה נמחקה מהתור, הודפסה בדוח
  // למפעל, והוצג "✓ נשלחו" בזמן שה-stage נשאר 'workday' והיא חזרה לליטוש.
  const _unpricedAll = [];
  const sent   = [];
  const failed = [];
  await Promise.all(doneOrds.map(o => {
    const hasRealChisum = (o.items||[]).some(i => i.chisum && !(i.name||'').includes('מראה'));
    if(!hasRealChisum){
      // done הוא שלב סופי לתמחור — חייב לעבור נעילת מחיר, אחרת ההזמנה
      // מגיעה ל-done בלי totalFinal/lockedItems (בדיוק כמו מסלולים אחרים).
      // מראות לא נוסעות למפעל, ולכן גם לא נכנסות ל-chDone (הדוח).
      return lgLockAndAdvance(String(o.id), o, _csGlobalPrices, _csClientPrices, 'done')
        .then(r => {
          if(r && r.unpricedNames && r.unpricedNames.length) _unpricedAll.push(...r.unpricedNames);
          sent.push(o);
        })
        .catch(e=>{ console.error('sendAllToFactory lgLockAndAdvance:',e); failed.push(o); });
    }
    return updateOrder(String(o.id), {
      stage:           'chisum',
      chisumArrived:   false,
      chisumReportId:  reportId,
      chisumReportNum: reportNum,
    })
      .then(()=>{ sent.push(o); chDone.push(o); })
      .catch(e=>{ console.error('sendAllToFactory updateOrder:',e); failed.push(o); });
  }));
  if(_unpricedAll.length) toast('⚠️ לא כל הפריטים תומחרו: ' + _unpricedAll.join(', '));

  // שלב 2: הסר מ-inChisum — רק את ההזמנות שבאמת עודכנו בהצלחה
  const sentIds   = new Set(sent.map(o => String(o.id)));
  const remaining = wdInChisum.filter(id => !sentIds.has(String(id)));
  const obj = {}; remaining.forEach((v,i) => {obj[i]=v;});
  await firebase.database().ref('workday').update({inChisum: remaining.length ? obj : null});

  // נקה סימוני בדיקה — גם checkEdits (ציורים) וגם checkState (הסימונים עצמם).
  // בלי ניקוי checkState, הזמנה שתחזור לתחנה בעתיד מגיעה עם כל הסימונים
  // דלוקים → isDone מחזיר true מיד → היא נשלחת למפעל בלי שאף אחד בדק אותה.
  sent.forEach(o => {
    firebase.database().ref('checkEdits/' + o.id).remove()
      .catch(e=>console.error('[CS] removeCheckEdit:', e));
    firebase.database().ref('workday/checkState/' + o.id).remove()
      .catch(e=>console.error('[CS] removeCheckState:', e));
    delete cs[o.id];
  });
  // חובה לעדכן גם את המטמון המקומי, אחרת מנגנון השחזור בליסנר מחזיר את המחיקה
  safeStorage.setItem('lgCheckState', JSON.stringify(cs));
  _clearCSEditsForOrders(sent.map(o=>o.id));

  if(chDone.length) printChisum(reportNum, printWin);
  else if(printWin && !printWin.closed) printWin.close();

  if(failed.length){
    toast(`⚠️ ${failed.length} מתוך ${doneOrds.length} נכשלו ונשארו בתור — נסה שוב`);
  } else {
    toast(`✓ דוח ${reportNum} — ${sent.length} הזמנות נשלחו למפעל`);
  }
  } catch(e) {
    console.error('[CS] sendAllToFactory error:', e);
    if(printWin && !printWin.closed) printWin.close();
    toast('שגיאה בשליחה — נסה שוב');
  } finally {
    _sendingToFactory = false;
    if(sendBtn){ sendBtn.disabled=false; sendBtn.textContent='🔥 שלח למפעל'; }
  }
}


// CHISUM REPORT
// דוח שיוצא פיזית למפעל. בעבר הוא נעטף ב-height:100vh;overflow:hidden (דוח ארוך
// נחתך לעמוד אחד בהדפסה), הכיל את תפריט הניווט של האפליקציה, והדפיס

  w.document.write(`<html dir="rtl"><head><meta charset="UTF-8"><title>${label}</title><style>
table{width:100%;border-collapse:collapse}
    th,td{padding:9px;border:1px solid #ddd;text-align:right}
    th{background:#f5f5f5}
    thead{display:table-header-group}  /* כותרת חוזרת בכל עמוד מודפס */
    tr{page-break-inside:avoid}
    .report-num{font-size:13px;font-weight:700;color:#b8922a;margin-bottom:4px}
    .report-title{font-size:18px;font-weight:700;margin-bottom:4px}
    .report-meta{font-size:12px;color:#888;margin-bottom:16px}
  </style></head><body>
<div class="report-num">מספר דוח: ${lgEsc(reportNum || '—')}</div>
<div class="report-title">🔥 ${label}</div>
<div class="report-meta">${new Date().toLocaleDateString('he-IL')} · ${items.length} פריטים · ${chDone.length} הזמנות</div>
<table><thead><tr><th>#</th><th>זכוכית</th><th>מידות (מ"מ)</th><th>לקוח</th><th>הזמנה</th></tr></thead><tbody>${items.map((item,i)=>`<tr><td>${i+1}</td><td>${lgEsc(item.name||'—')}</td><td>${item.w||''}×${item.h||''}</td><td>${lgEsc(item.client)}</td><td>${lgEsc(item.orderNum||'')}</td></tr>`).join('')}</tbody></table>

}

function renderSheet(){
  if(!cur){document.getElementById('shBody').innerHTML='<div style="padding:14px;color:var(--muted)">בחר הזמנה</div>';return;}
  const idxs=chisumIdxs(cur);
  const allItems=cur.items||[];
  document.getElementById('shTitle').textContent=cur.orderClient+' — '+idxs.length+' פריטי חיסום';
  const note=notes[cur.id]||'';

  let html=`<div class="note-area">
    <div style="font-size:12px;color:var(--muted);margin-bottom:4px">📝 הערה:</div>
    <textarea id="skNoteTA" placeholder="הוסף הערה...">${lgEsc(note)}</textarea>
    <button class="note-save" onclick="saveSkNote()">שמור</button>
  </div>`;

  // הצג רק פריטי חיסום — לחץ לסימון
  if(idxs.length){
    html+=`<div style="padding:8px 14px;font-size:12px;font-weight:700;color:var(--gold);letter-spacing:0.15em;background:var(--s2);border-bottom:1px solid var(--border)">🔥 פריטי חיסום — לחץ לסימון בדיקה</div>`;
    // קיבוץ לתצוגה בלבד לפי quantityGroupId — לא משנה את מערך הפריטים
    const dispGroups=[];const seenG={};
    idxs.forEach(origIdx=>{
      const it=allItems[origIdx];
      const gid=it?.quantityGroupId||('__solo_'+origIdx);
      if(gid in seenG){dispGroups[seenG[gid]].indices.push(origIdx);}
      else{seenG[gid]=dispGroups.length;dispGroups.push({quantityGroupId:it?.quantityGroupId||null,indices:[origIdx]});}
    });
    html+=dispGroups.map(grp=>{
      const isGrp=grp.quantityGroupId&&grp.indices.length>1;
      const grpChecked=grp.indices.filter(i=>cs[cur.id]?.[i]).length;
      let g='';
      if(isGrp){
        g+=`<div class="grp-hdr"><span>🔥 קבוצה (${grp.indices.length} יחידות)</span><span>${grpChecked}/${grp.indices.length} נבדקו</span></div>`;
      }
      g+=grp.indices.map(origIdx=>{
        const item=allItems[origIdx];
        const ck=cs[cur.id]?.[origIdx];
        return`<div class="si ${ck?'on':''}" onclick="checkItem(${origIdx})"${isGrp?' style="padding-right:22px"':''}>
          <div class="si-chk">${ck?'✓':''}</div>
          <div style="flex:1">
            <div class="si-name">${lgEsc(item?.name||'—')}${isGrp?` <span style="font-size:12px;color:var(--muted)">#${item?.groupIndex||''}</span>`:''}</div>
            <div class="si-dim">${item?.w||''}${item?.w&&item?.h?'×':''}${item?.h||''} מ"מ</div>
          </div>
          <div class="si-tag tc">🔥 חיסום</div>
        </div>`;
      }).join('');
      return g;
    }).join('');
  } else {
    html+=`<div style="padding:16px;font-size:13px;color:var(--muted);text-align:center">
      <div style="font-size:28px;margin-bottom:8px">📋</div>
      אין פריטי חיסום בהזמנה זו
    </div>`;
  }

  document.getElementById('shBody').innerHTML=html;
}
function saveSkNote(){if(!cur)return;const txt=document.getElementById('skNoteTA')?.value.trim();if(txt)notes[cur.id]=txt;else delete notes[cur.id];saveNotes();renderList();closeSheet();toast('הערה נשמרה ✓');}

// ZOOM/PAN
function doZoom(d){scl=Math.max(0.3,Math.min(5,scl+d));applyTr();}
function resetZoom(){scl=1;px=0;py=0;applyTr();}
function applyTr(){const el=document.getElementById('skWrap');el.style.transform=`translate(${px}px,${py}px) scale(${scl})`;el.style.transformOrigin='center center';}
function setupPan(){
  const a=document.getElementById('skArea');
  let lx=0,ly=0,pan=false,ld=0,pinch=false;
  a.ontouchstart=e=>{if(e.touches.length===2){pinch=true;ld=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);}else{pan=true;lx=e.touches[0].clientX;ly=e.touches[0].clientY;}};
  a.ontouchmove=e=>{e.preventDefault();if(pinch&&e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);scl=Math.max(0.3,Math.min(5,scl*(d/ld)));ld=d;applyTr();}else if(pan){px+=e.touches[0].clientX-lx;py+=e.touches[0].clientY-ly;lx=e.touches[0].clientX;ly=e.touches[0].clientY;applyTr();}};
  a.ontouchend=()=>{pan=false;pinch=false;};
}

// EDITOR
let edTl='draw',edCl='#e74c3c',edSz=5,edFt=26,edDrw=false,edHist=[],edCtx=null,edCvs=null,edBgW=0,edBgH=0;
function openEditor(){
  if(!cur)return;
  document.getElementById('csEd').classList.add('open');
  document.getElementById('edTitle').textContent='✏️ '+cur.orderClient;
  edCvs=document.getElementById('edCvs');edCtx=edCvs.getContext('2d');edHist=[];
  const bg=document.getElementById('edBg');
  // נקה handlers ישנים + src — מונע שימוש ב-state ישן מ-order קודם
  bg.onload=null;bg.onerror=null;bg.src='';

  const liveEdited=(window._csCheckEdits||{})[String(cur.id)]||cur._editedSketch||null;
  if(liveEdited) cur._editedSketch=liveEdited;

  function _tryLoadBg(src, isFallback){
    bg.onload=()=>{ requestAnimationFrame(()=>{edResize();edSnap();}); };
    bg.onerror=()=>{
      console.warn('[CS] editor bg failed to load, isFallback='+isFallback+' src.length='+(src&&src.length));
      if(!isFallback && cur.sketch && src!==cur.sketch){
        // הסקיצה הערוכה פגומה — נקה מ-Firebase ונסה original
        firebase.database().ref('checkEdits/'+cur.id).remove().catch(()=>{});
        delete (window._csCheckEdits||{})[String(cur.id)];
        cur._editedSketch=null;
        _tryLoadBg(cur.sketch, true);
      } else {
        // גם original נכשל — fallback ל-SVG
        bg.onerror=null;
        const svgSrc='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(buildSVG(cur,false));
        bg.onload=()=>{ requestAnimationFrame(()=>{edResize();edSnap();}); };
        bg.src=svgSrc;
      }
    };
    bg.style.display='block';
    bg.src=src;
    // תמונה כבר cache-ד — onload לא יירה, trigger ידני
    if(bg.complete&&bg.naturalWidth>0){
      requestAnimationFrame(()=>{edResize();edSnap();});
    }
  }

  if(liveEdited||cur.sketch){
    _tryLoadBg(liveEdited||cur.sketch, false);
  } else {
    // אין תמונה כלל — SVG
    bg.onerror=null;
    const svgSrc='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(buildSVG(cur,false));
    bg.onload=()=>{ requestAnimationFrame(()=>{edResize();edSnap();}); };
    bg.style.display='block';bg.src=svgSrc;
  }
  edTool('draw');edBindEv();
}
function closeEditor(){document.getElementById('csEd').classList.remove('open');edDrw=false;}
function edResize(){const bg=document.getElementById('edBg'),wrap=document.getElementById('edWrap'),dpr=window.devicePixelRatio||1,wr=wrap.getBoundingClientRect();let bw,bh;if(bg.naturalWidth){const r=bg.naturalWidth/bg.naturalHeight;bh=Math.min(wr.height,bg.naturalHeight);bw=bh*r;if(bw>wr.width){bw=wr.width;bh=bw/r;}}else{bw=wr.width;bh=wr.height;}edBgW=bw;edBgH=bh;edCvs.width=bw*dpr;edCvs.height=bh*dpr;edCvs.style.width=bw+'px';edCvs.style.height=bh+'px';edCvs.style.left=(wr.width-bw)/2+'px';edCvs.style.top=(wr.height-bh)/2+'px';edCtx.scale(dpr,dpr);}
function edSnap(){if(edCvs.width>0)edHist.push(edCtx.getImageData(0,0,edCvs.width,edCvs.height));if(edHist.length>50)edHist.shift();}
function edUndo(){if(edHist.length<=1)return;edHist.pop();edCtx.putImageData(edHist[edHist.length-1],0,0);}
function edClear(){edCtx.clearRect(0,0,edBgW,edBgH);edHist=[];edSnap();}
function edTool(t){edTl=t;['Draw','Text','Erase'].forEach(n=>{const b=document.getElementById('eb'+n);if(b)b.classList.toggle('on',t.toLowerCase()===n.toLowerCase());});document.getElementById('edTxtBar').style.display=t==='text'?'flex':'none';document.getElementById('edFtW').style.display=t==='text'?'flex':'none';document.getElementById('edWrap').style.cursor=t==='erase'?'cell':t==='text'?'text':'crosshair';}
function edColor(col,el){edCl=col;document.querySelectorAll('.ecol').forEach(e=>e.classList.remove('on'));el.classList.add('on');}
function edPos(e){const r=edCvs.getBoundingClientRect(),s=e.touches?e.touches[0]:e;return{x:s.clientX-r.left,y:s.clientY-r.top};}
function edBindEv(){const old=edCvs,nc=old.cloneNode(true);old.parentNode.replaceChild(nc,old);edCvs=nc;edCtx=nc.getContext('2d');edCtx.scale(window.devicePixelRatio||1,window.devicePixelRatio||1);nc.addEventListener('mousedown',edStart);nc.addEventListener('mousemove',edMove);nc.addEventListener('mouseup',edEnd);nc.addEventListener('touchstart',edStart,{passive:false});nc.addEventListener('touchmove',edMove,{passive:false});nc.addEventListener('touchend',edEnd,{passive:false});}
function edStart(e){e.preventDefault();const{x,y}=edPos(e);if(edTl==='text'){const txt=document.getElementById('edTxtIn').value.trim();if(!txt)return;edCtx.font=`bold ${edFt}px Heebo,Arial,sans-serif`;edCtx.fillStyle=edCl;edCtx.textAlign='right';edCtx.fillText(txt,x,y);edSnap();return;}edDrw=true;edCtx.beginPath();edCtx.moveTo(x,y);}
function edMove(e){e.preventDefault();if(!edDrw)return;const{x,y}=edPos(e);if(edTl==='erase'){edCtx.clearRect(x-edSz*2,y-edSz*2,edSz*4,edSz*4);}else{edCtx.strokeStyle=edCl;edCtx.lineWidth=edSz;edCtx.lineCap='round';edCtx.lineJoin='round';edCtx.lineTo(x,y);edCtx.stroke();edCtx.beginPath();edCtx.moveTo(x,y);}}
function edEnd(){if(!edDrw)return;edDrw=false;edSnap();}
async function edSave(){
  const bg=document.getElementById('edBg'),merge=document.createElement('canvas');
  const bw=bg.naturalWidth||edBgW,bh=bg.naturalHeight||edBgH;
  // מגביל רוחב ל-1400px — מונע JPEG >5MB שיוביל לכישלון Firebase (גבול 10MB/node)
  const W=Math.min(Math.max(bw,1200),1400),H=Math.round(W*(bh/Math.max(bw,1)));
  merge.width=W;merge.height=H;
  const mx=merge.getContext('2d');
  mx.imageSmoothingEnabled=true;mx.imageSmoothingQuality='high';
  if(bg.naturalWidth) mx.drawImage(bg,0,0,W,H);
  mx.save();mx.scale(W/Math.max(edBgW,1),H/Math.max(edBgH,1));mx.drawImage(edCvs,0,0,edBgW,edBgH);mx.restore();

  // דחוס ל-JPEG עם quality מדורג — מבטיח <5MB (≈6.7MB base64) לשמירה בטוחה ב-Firebase
  let quality=0.82, newSrc=merge.toDataURL('image/jpeg',quality);
  while(newSrc.length>6_500_000 && quality>0.3){
    quality=Math.round((quality-0.15)*100)/100;
    newSrc=merge.toDataURL('image/jpeg',quality);
  }
  if(newSrc.length>6_500_000){
    toast('⚠️ תמונה גדולה מדי לשמירה');
    closeEditor();
    return;
  }

  if(!cur){ closeEditor(); return; }

  const savedId = cur.id;
  cur._editedSketch=newSrc;
  window._csCheckEdits[String(savedId)]=newSrc; // עדכון אופטימי מיידי — המסך מתעדכן בלי לחכות לרשת
  try{
    const s=JSON.parse(safeStorage.getItem('lgCSEdits')||'{}');
    s[savedId]=newSrc;
    safeStorage.setItem('lgCSEdits',JSON.stringify(s));
  }catch(e){}
  renderSketch();
  closeEditor();

  // רק עכשיו — הכתיבה בפועל ל-Firebase. ממתינים לה כדי לדעת אם היא באמת הצליחה,
  // ולא מציגים "סומן ✓" מזויף אם היא נכשלה (העריכה נשארת שמורה מקומית בכל מקרה).
  try {
    await firebase.database().ref('checkEdits/'+savedId).set(newSrc);
    toast('סומן ✓');
  } catch(e) {
    console.error('[CS] edSave Firebase:', e);
    toast('⚠️ העריכה נשמרה מקומית בלבד — לא הועלתה לענן (בדוק חיבור אינטרנט)');
  }
}

// נקה ציורי בדיקה זמניים להזמנות שעברו לשלב הבא
function _clearCSEditsForOrders(ids){
  // נקה גם מהמצב בזמן אמת — מונע שימוש ב-snapshot ישן אחרי sendAllToFactory
  ids.forEach(id=>{ delete (window._csCheckEdits||{})[String(id)]; });
  try{
    const s=JSON.parse(safeStorage.getItem('lgCSEdits')||'{}');
    ids.forEach(id=>{ delete s[String(id)]; });
    safeStorage.setItem('lgCSEdits',JSON.stringify(s));
  }catch(e){}
}
window.addEventListener('resize',()=>{if(document.getElementById('csEd').classList.contains('open'))edResize();});

function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2800);}
