<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- מניעת cache — Safari, Chrome, כל דפדפן -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>LuzGlass — כניסה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

<!-- בסיס העיצוב המשותף — הדף כהה, ולכן body נושא lg-dark -->
<link rel="stylesheet" href="lg-ui.css?v=20260807">

<style>
  html,body{height:100%;}

  body{
    background:var(--dark-bg);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100vh;padding:20px;
  }

  /* background texture */
  body::before{
    content:'';position:fixed;inset:0;
    background:radial-gradient(ellipse at 60% 30%, rgba(184,146,42,0.07) 0%, transparent 60%),
               radial-gradient(ellipse at 20% 80%, rgba(184,146,42,0.04) 0%, transparent 50%);
    pointer-events:none;
  }

  .card{
    background:var(--dark-surface);border:1px solid var(--dark-border);
    border-radius:12px;padding:40px 36px;width:100%;max-width:400px;
    box-shadow:0 24px 64px rgba(0,0,0,0.5);position:relative;
  }

  .logo{
    text-align:center;margin-bottom:32px;
  }
  .logo-text{
    font-family:'Playfair Display',serif;font-size:30px;color:#f7f4ef;letter-spacing:0.02em;
  }
  .logo-text span{color:var(--gold);}
  .logo-sub{font-size:12px;color:var(--dark-muted);margin-top:6px;letter-spacing:0.12em;text-transform:uppercase;}

  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--dark-muted);margin-bottom:7px;letter-spacing:0.05em;}
  .field input{
    width:100%;padding:13px 14px;
    background:#1a1714;border:1px solid rgba(255,255,255,0.1);
    font-family:Heebo,sans-serif;font-size:15px;color:var(--dark-text);
    outline:none;border-radius:6px;transition:border 0.2s;
  }
  .field input:focus{border-color:var(--gold);}
  .field input::placeholder{color:var(--dark-muted);}

  .btn-login{
    width:100%;padding:15px;margin-top:8px;
    background:var(--gold);color:var(--on-gold);
    font-family:Heebo,sans-serif;font-size:15px;font-weight:900;
    border:none;cursor:pointer;border-radius:6px;
    transition:background 0.15s;
    letter-spacing:0.02em;
  }
  .btn-login:hover{background:#c9a84c;}
  .btn-login:active{transform:scale(0.98);}

  .error{
    background:rgba(192,57,43,0.15);border:1px solid rgba(192,57,43,0.3);
    color:#e74c3c;padding:10px 14px;border-radius:6px;
    font-size:13px;margin-bottom:16px;display:none;
  }

  .footer-text{
    text-align:center;margin-top:24px;
    font-size:12px;color:var(--dark-muted);
  }

  /* loading spinner */
  .spinner{
    display:none;width:20px;height:20px;border:2px solid rgba(26,23,20,0.3);
    border-top-color:#1a1714;border-radius:50%;animation:spin 0.7s linear infinite;
    margin:0 auto;
  }
  @keyframes spin{to{transform:rotate(360deg)}}


/* ═══ רספונסיביות — נקודות העצירה של lg-ui.css: 600 / 900 / 1200 ═══ */
@media (max-width:600px){
  body{padding:14px;}
  .card{padding:28px 20px;}
}
</style>
</head>
<body class="lg-dark">

<div class="card">
  <div class="logo">
    <div class="logo-text">Luz<span>Glass</span></div>
    <div class="logo-sub">מפעל עיבוד זכוכית</div>
  </div>

  <div class="error" id="errMsg">שם משתמש או סיסמה שגויים</div>

  <div class="field">
    <label>שם משתמש / טלפון</label>
    <input type="text" id="username" placeholder="054-1234567" autocomplete="username"
      onkeydown="if(event.key==='Enter')doLogin()">
  </div>
  <div class="field">
    <label>סיסמה</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password"
      onkeydown="if(event.key==='Enter')doLogin()">
  </div>

  <button class="btn-login" onclick="doLogin()">
    <span id="btnLabel">כניסה</span>
    <div class="spinner" id="spinner"></div>
  </button>

</div>

<div class="footer-text">© 2026 LuzGlass · כל הזכויות שמורות</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="firebase-db.js?v=20260601"></script>
<script>
// ── redirect אם כבר מחובר (רמז UX בלבד — היעד עצמו מגן על עצמו אמיתית) ──
(function(){
  // הגענו לכאן כי מישהו התחבר בלשונית אחרת והזהות בלשונית הזו הוחלפה.
  // בלי ההסבר הזה זה נראה כמו ניתוק אקראי.
  if(new URLSearchParams(location.search).has('switched')){
    const el = document.getElementById('errMsg');
    if(el){
      el.textContent = 'ההתחברות התחלפה בלשונית אחרת של אותו דפדפן, ולכן הסשן כאן נסגר. יש להתחבר מחדש.';
      el.style.display = 'block';
    }
    return;   // בלי redirect אוטומטי — אחרת נחזור מיד לזהות שרק עכשיו נסגרה
  }
  const s = lgGetSession();
  if(s.role === 'admin')  { window.location.href = 'admin.html';  return; }
  if(s.role === 'client') { window.location.href = 'portal.html'; return; }
})();

const _loginBtn = document.querySelector('.btn-login');

// ── התחברות ────────────────────────────────────────────────────────────
async function doLogin(){
  const phone    = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();
  const errEl    = document.getElementById('errMsg');
  errEl.style.display = 'none';

  if(!phone || !password){
    errEl.textContent = 'נא למלא מספר טלפון וסיסמה';
    errEl.style.display = 'block';
    return;
  }

  document.getElementById('btnLabel').style.display = 'none';
  document.getElementById('spinner').style.display  = 'block';
  _loginBtn.disabled = true;

  try {
    const user = await lgLoginByPhone(phone, password); // זורק שגיאה על פרטים שגויים

    // שם עסקי = primaryName לכל המערכת (orderClient, מחירונים, פורטל)
    const primaryName = (user.businessName||'').trim() || user.name;
    lgSetSession({
      id:          user.id,
      name:        primaryName,
      role:        user.role,
      phone:       user.phone || '',
      isMainAdmin: !!user.isMainAdmin,
      loginTime:   Date.now()
    });
    window.location.href = user.role === 'admin' ? 'admin.html' : 'portal.html';

  } catch(err){
    console.error('[login] error:', err);
    document.getElementById('btnLabel').style.display = 'block';
    document.getElementById('spinner').style.display  = 'none';
    _loginBtn.disabled = false;
    document.getElementById('password').value = '';
    const badCreds = ['auth/wrong-password','auth/user-not-found','auth/invalid-credential','auth/invalid-email'].includes(err.code);
    if (badCreds) {
      errEl.textContent = 'מספר טלפון או סיסמה שגויים';
    } else if (err.code === 'lg/timeout') {
      // תקיעה, לא דחייה — השרת לא ענה בזמן. אומרים למשתמש מה לעשות עכשיו.
      errEl.textContent = 'השרת לא הגיב. בדוק את חיבור האינטרנט ונסה שוב.';
    } else {
      errEl.textContent = 'שגיאת חיבור לשרת — בדוק חיבור אינטרנט ונסה שוב';
    }
    errEl.style.display = 'block';
  }
}
</script>
</body>
</html>
