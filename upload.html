<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>LuzGlass — העלאת סקיצה</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">

<!-- בסיס העיצוב המשותף — אין להגדיר :root בדף הזה -->
<link rel="stylesheet" href="lg-ui.css?v=20260807">
<style>
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;height:58px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;}
  .logo-main{font-family:'Playfair Display',serif;font-size:22px;font-weight:900;color:var(--text);}
  .logo-main span{color:var(--gold-text);}
  .back-btn{padding:8px 16px;background:var(--bg2);border:1px solid var(--border);font-family:'Heebo',sans-serif;font-size:13px;color:var(--muted);cursor:pointer;text-decoration:none;display:inline-block;}

  .page{max-width:560px;margin:0 auto;padding:28px 20px 60px;}

  .page-title{font-family:'Playfair Display',serif;font-size:26px;font-weight:900;margin-bottom:6px;}
  .page-sub{font-size:14px;color:var(--muted);margin-bottom:28px;line-height:1.6;}

  /* UPLOAD ZONE */
  .upload-zone{
    border:2px dashed rgba(184,146,42,0.4);
    background:rgba(184,146,42,0.03);
    padding:40px 20px;
    text-align:center;
    cursor:pointer;
    transition:all 0.2s;
    margin-bottom:16px;
    position:relative;
  }
  .upload-zone:hover,.upload-zone.drag{border-color:var(--gold-text);background:rgba(184,146,42,0.07);}
  .upload-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
  .uz-icon{font-size:44px;margin-bottom:12px;}
  .uz-title{font-size:16px;font-weight:700;margin-bottom:6px;}
  .uz-sub{font-size:13px;color:var(--muted);}
  .uz-types{font-size:12px;color:var(--muted);margin-top:8px;opacity:0.7;}

  /* PREVIEW */
  .preview-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;}
  .preview-item{position:relative;aspect-ratio:1;background:var(--bg2);border:1px solid var(--border);overflow:hidden;display:flex;flex-direction:column;}
  .preview-item img{width:100%;height:100%;object-fit:cover;}
  .preview-item .rm{position:absolute;top:4px;left:4px;width:22px;height:22px;background:rgba(192,57,43,0.85);color:#fff;border:none;border-radius:50%;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;}
  .preview-count{font-size:12px;color:var(--muted);margin-bottom:16px;text-align:center;}

  /* FORM */
  .form-section{display:flex;flex-direction:column;gap:14px;margin-bottom:24px;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:12px;font-weight:600;letter-spacing:0.1em;color:var(--gold-text);text-transform:uppercase;}
  .field input,.field select,.field textarea{
    padding:12px 14px;background:var(--surface);
    border:1px solid var(--border);
    font-family:'Heebo',sans-serif;font-size:14px;color:var(--text);
    outline:none;transition:border-color 0.15s;
    -webkit-appearance:none;border-radius:0;
  }
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold-text);}
  .field textarea{resize:none;line-height:1.6;}

  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

  /* הודעות ההעלאה — ליד הכפתור, לא alert. ניגודיות מעל 4.5:1 בשני המצבים. */
  .up-notice{
    margin:12px 0;padding:12px 14px;border-radius:8px;
    font-family:Heebo,sans-serif;font-size:14px;line-height:1.5;
  }
  .up-err{background:#fdecea;border:1px solid #f5c6c2;color:#8f2d24;}
  .up-ok {background:#eaf7ef;border:1px solid #bfe3cd;color:#1e6b3a;}

  /* SUBMIT */
  .btn-submit{
    width:100%;padding:16px;
    background:var(--gold);color:var(--on-gold);
    font-family:'Heebo',sans-serif;font-size:16px;font-weight:700;
    border:none;cursor:pointer;letter-spacing:0.04em;
    transition:background 0.2s;
  }
  .btn-submit:hover{background:#9a7520;}
  .btn-submit:disabled{background:#ccc;cursor:not-allowed;}

  /* SUCCESS */
  .success-screen{
    display:none;text-align:center;
    padding:60px 20px;
  }
  .success-screen.show{display:block;}
  .success-icon{font-size:64px;margin-bottom:20px;}
  .success-title{font-family:'Playfair Display',serif;font-size:26px;font-weight:900;margin-bottom:10px;}
  .success-sub{font-size:15px;color:var(--muted);line-height:1.7;max-width:340px;margin:0 auto 32px;}
  .success-ref{font-size:13px;color:var(--gold-text);font-weight:700;margin-bottom:28px;}
  .btn-back{display:inline-block;padding:14px 32px;background:var(--text);color:var(--bg);font-family:'Heebo',sans-serif;font-size:14px;font-weight:700;text-decoration:none;}

/* ═══ רספונסיביות — נקודות העצירה של lg-ui.css: 600 / 900 / 1200 ═══ */
@media (max-width:600px){
  .topbar{padding:0 14px;}
  .page{padding:20px 14px 48px;}
  .page-title{font-size:22px;}
  .page-sub{margin-bottom:20px;}
}
</style>
  <!-- Firebase SDK + LuzGlass DB -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="firebase-db.js?v=20260518"></script>
</head>
<body>
<a href="#formPage" class="skip-link">דלג לתוכן</a>


<div class="topbar">
  <div class="logo-main" onclick="logoClick()" style="cursor:pointer;">Luz<span>Glass</span></div>
  <a href="portal.html" class="back-btn">→ חזרה לפורטל</a>
</div>

<div class="page" id="formPage">
  <div class="page-title">העלאת סקיצה</div>
  <div class="page-sub">העלה תמונה של שרטוט ידני, מדידות, או כל קובץ רלוונטי — ואנחנו נטפל בזה.</div>

  <!-- UPLOAD ZONE -->
  <!-- File input ישירות בתוך ה-zone — תואם iOS Safari -->
  <label for="fileInput" class="upload-zone" id="dropZone" style="display:block;cursor:pointer;">
  <input type="file" id="fileInput" accept="image/*,.pdf" multiple
    style="position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;"
    onchange="handleFiles(this.files)">
    <div class="uz-icon">📎</div>
    <div class="uz-title">לחץ לבחירת קבצים</div>
    <div class="uz-sub">תמונות של שרטוטים, מדידות, רפרנסים</div>
    <div class="uz-types">JPG, PNG, PDF · עד 10MB לקובץ</div>
    <div style="margin-top:14px;">
      <span style="display:inline-block;padding:10px 24px;background:var(--gold);color:var(--on-gold);font-family:Heebo,sans-serif;font-size:13px;font-weight:700;border-radius:6px;cursor:pointer;">
        📂 בחר קובץ
      </span>
    </div>
  </label>

  <div class="preview-grid" id="previewGrid" style="display:none"></div>
  <div class="preview-count" id="previewCount"></div>

  <!-- FORM -->
  <div class="form-section">
    <div class="field">
      <label>הערות כלליות</label>
      <textarea id="notes" rows="3" placeholder="מידות, סוג זכוכית מבוקש, פרזול, הערות מיוחדות..."></textarea>
    </div>
  </div>

  <!-- הודעות ההעלאה יושבות כאן, ליד הכפתור שהמשתמש לוחץ עליו -->
  <div id="upNotice" class="up-notice" style="display:none" role="status" aria-live="polite"></div>

  <button class="btn-submit" id="submitBtn" type="button" onclick="submitUpload()" style="width:100%;min-height:50px;font-size:16px;">שלח סקיצה ←</button>
</div>

<!-- SUCCESS -->
<div class="success-screen" id="successScreen">
  <div class="success-icon">✅</div>
  <div class="success-title">הסקיצה נשלחה!</div>
  <div class="success-sub">קיבלנו את הסקיצה שלך ונטפל בה בהקדם. ניצור איתך קשר לאישור.</div>
  <div class="success-ref" id="successRef"></div>
  <a href="portal.html" class="btn-back">→ חזרה לפורטל</a>
</div>

<script>
// דף לא היה מוגן כלל עד עכשיו — כל אחד עם הקישור יכל לכתוב הזמנות ל-Firebase.
//
// הממתינים לתוצאה ולא קוראים את sessionStorage מיד: בטעינה ראשונה הוא עדיין
// ריק או מחזיק את הזהות הקודמת, ואז שם הלקוח בטופס נפתח על מישהו אחר.
let _clientName = '', _clientPhone = '';
lgRequireAuthAsync('client').then(session => {
  if(!session) return; // כבר הופנה ל-login.html
  _clientName  = session.name  || '';
  _clientPhone = session.phone || '';
  const cnEl = document.getElementById('clientName');
  if(cnEl && _clientName) cnEl.value = _clientName;
});

let uploadedFiles = [];

// Drag & drop
const dz = document.getElementById('dropZone');
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag'); });
dz.addEventListener('dragleave', () => dz.classList.remove('drag'));
dz.addEventListener('drop', e => {
  e.preventDefault(); dz.classList.remove('drag');
  handleFiles(e.dataTransfer.files);
});

// accept="" הוא רמז לחלון הבחירה בלבד: אפשר לבחור בו "כל הקבצים", וגרירה
// עוקפת אותו לגמרי. כך נכנס קובץ .url של Windows בן 513 בתים, נשמר כסקיצה,
// והוצג בכל מסך כתמונה שבורה.
//
// הסוג שהדפדפן מוסר ריק לפעמים — סיומת שהוא לא מכיר, או גרירה ממקומות
// מסוימים — ולכן הסיומת צריכה להכריע לבדה כשאין סוג.
function lgIsAcceptedUpload(file){
  var name = String((file && file.name) || '');
  var type = String((file && file.type) || '').toLowerCase();
  var dot  = name.lastIndexOf('.');
  var ext  = dot > 0 ? name.slice(dot + 1).toLowerCase() : '';
  var IMG_EXT = ['jpg','jpeg','png','gif','webp','heic','heif','bmp'];
  if (type.indexOf('image/') === 0) return { ok: true };
  if (type === 'application/pdf')   return { ok: true };
  if (!type) {
    if (ext === 'pdf')               return { ok: true };
    if (IMG_EXT.indexOf(ext) !== -1) return { ok: true };
  }
  return { ok: false,
           reason: 'הקובץ "' + (name || 'ללא שם') + '" אינו תמונה או PDF, ולכן לא צורף.' };
}

// alert חוסם, ובחלק מדפדפני הנייד הוא פשוט לא מוצג. ההודעה יושבת בדף,
// ליד הכפתור, ונקראת גם על ידי קורא מסך.
function uploadNotice(msg, kind){
  var el = document.getElementById('upNotice');
  if(!el){ console.warn('[upload]', msg); return; }
  el.textContent = msg || '';
  el.className = 'up-notice' + (kind === 'ok' ? ' up-ok' : ' up-err');
  el.style.display = msg ? 'block' : 'none';
}

function handleFiles(files) {
  Array.from(files).forEach(file => {
    const verdict = lgIsAcceptedUpload(file);
    if(!verdict.ok) { uploadNotice(verdict.reason); return; }
    if(file.size > 10 * 1024 * 1024) { uploadNotice(`הקובץ ${file.name} גדול מ-10MB`); return; }
    const reader = new FileReader();
    reader.onload = e => {
      uploadedFiles.push({ name: file.name, data: e.target.result, type: file.type });
      renderPreviews();
    };
    reader.readAsDataURL(file);
  });
}

function renderPreviews() {
  const grid = document.getElementById('previewGrid');
  const count = document.getElementById('previewCount');
  if (!uploadedFiles.length) { grid.style.display = 'none'; count.textContent = ''; return; }
  grid.style.display = 'grid';
  // אין כאן שדה שם. הלקוח מעלה סקיצות ברצף, בתצוגה מוקטנת שבה אי אפשר
  // באמת לראות מה בכל אחת — ולכן השם נקבע בתור הסקיצות, מול התמונה
  // בגודל מלא, יחד עם הכנסת הפריטים.
  grid.innerHTML = uploadedFiles.map((f, i) => `
    <div class="preview-item">
      ${f.type.startsWith('image')
        ? `<img src="${lgEsc(f.data)}" alt="${lgEsc(f.name)}">`
        : `<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:32px;">📄</div>`}
      <button aria-label="הסר קובץ" class="rm" onclick="removeFile(${i})">✕</button>
    </div>`).join('');
  count.textContent = `${uploadedFiles.length} קבצים נבחרו`;
}

function removeFile(i) {
  uploadedFiles.splice(i, 1);
  renderPreviews();
}

function compressImage(dataUrl, maxW, quality, cb){
  const img = new Image();
  img.onload = function(){
    const canvas = document.createElement('canvas');
    const scale = Math.min(1, maxW / img.width);
    canvas.width = Math.round(img.width * scale);
    canvas.height = Math.round(img.height * scale);
    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
    cb(canvas.toDataURL('image/jpeg', quality));
  };
  img.onerror = function(){ cb(dataUrl); }; // fallback
  img.src = dataUrl;
}

// משלוח אחד = מזהה אחד, שנשמר עד שהכל אומת. ניסיון חוזר משתמש בו שוב,
// כותב לאותם נתיבים, ולכן דורס במקום ליצור הזמנות כפולות. בלי זה כל ניסיון
// יצר מזהים חדשים לפי השעון, והזמנות שכבר נשמרו נשמרו בשנית.
//
// sessionStorage ולא localStorage: המשלוח שייך ללשונית הזו. חסום בגלישה
// פרטית — ואז נופלים לזיכרון, וההגנה שורדת ניסיון חוזר אך לא רענון דף.
var _lgBatchMem = null;
function lgUploadBatch(){
  var raw = null;
  try { raw = sessionStorage.getItem('lgUploadBatch'); } catch(e) { raw = _lgBatchMem; }
  if(!raw) raw = _lgBatchMem;
  if(raw){ try { return JSON.parse(raw); } catch(e) {} }
  var made = { batchId: String(Date.now()), refNum: null };
  lgUploadBatchSet(made);
  return made;
}
function lgUploadBatchSet(b){
  var s = JSON.stringify(b);
  _lgBatchMem = s;
  try { sessionStorage.setItem('lgUploadBatch', s); } catch(e) {}
}
function lgUploadBatchClear(){
  _lgBatchMem = null;
  try { sessionStorage.removeItem('lgUploadBatch'); } catch(e) {}
}

// "נשמר" פירושו שקראנו את זה בחזרה. set() שחזר אינו הוכחה שההזמנה שם.
// שדה בודד ולא ההזמנה כולה: הזמנה נושאת סקיצת base64, והורדתה לאימות
// הייתה עולה מאות קילובייטים על כל קובץ.
async function verifySaved(id){
  const snap = await _lgWithTimeout(
    firebase.database().ref('orders/' + id + '/id').once('value'),
    15000, 'אימות שמירה');
  return snap.exists() && snap.val() === id;
}

async function submitUpload() {
  // מי שנרשם על הסקיצה חייב להיות מי שבאמת מחובר, ולא מה שיושב במטמון
  // התצוגה. lgSession מוחלף כשמישהו מתחבר בלשונית אחרת — וכך סקיצות של
  // לקוח נשמרו על שם בן לוז ותור הסקיצות הראה את הלקוח הלא נכון.
  const sess = lgVerifiedSession();
  if (!sess) {
    alert('ההתחברות התחלפה או פגה, ולכן הסקיצה לא נשמרה — כדי שלא תירשם על לקוח אחר.\nיש להתחבר מחדש ולהעלות שוב.');
    window.location.href = 'login.html?switched=1';
    return;
  }
  const name = sess.name || sess.id || 'לקוח';
  const phone = sess.phone || '';
  const notes = document.getElementById('notes').value.trim();

  if (!uploadedFiles.length) { alert('נא להעלות לפחות קובץ אחד'); return; }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'מעבד...';

  const PROCESS_TIMEOUT_MS = 20000;
  const SAVE_TIMEOUT_MS    = 30000;

  // מספר ההזמנה נמשך פעם אחת למשלוח ונשמר איתו. בלי זה ניסיון חוזר היה
  // שורף מספר הזמנה נוסף בכל לחיצה.
  const batch = lgUploadBatch();
  if(!batch.refNum){ batch.refNum = await lgNextOrderNum(); lgUploadBatchSet(batch); }
  const refNum = batch.refNum;

  const now = new Date();
  const dateStr = now.toLocaleDateString('he-IL');
  const timeStr = now.toLocaleTimeString('he-IL', {hour:'2-digit',minute:'2-digit'});

  // שמור ל-Firebase — כל תמונה כ-submission נפרד, במזהה קבוע לפי המשלוח.
  // התמונה נשמרת ישירות כ-sketch (string), לא בתוך array (Firebase לא אמין עם arrays)
  async function saveAll(images){
    const failures = [];
    for (let i = 0; i < images.length; i++) {
      // המזהה נגזר מהמשלוח ומהמיקום, ולא מהשעון — ולכן ניסיון חוזר כותב
      // בדיוק לאותו נתיב ודורס, במקום ליצור הזמנה שנייה לאותה סקיצה.
      const id  = 'sub_' + batch.batchId + '_' + i;
      const num = refNum + (images.length > 1 ? '-' + (i + 1) : '');
      const fileName = images[i].name || '';
      try {
        await _lgWithTimeout(saveSubmission({
          id,
          refNum:      num,
          orderClient: name,
          client:      name,
          phone,
          // ריק בכוונה — ולא "סקיצה 1". שם אוטומטי נראה בתור בדיוק כמו שם
          // אמיתי, ואז אי אפשר לדעת מה עוד מחכה לשם. ריק נראה כ"ללא שם".
          sketchName:  '',
          orderNum:    num,
          notes,
          read:        false,
          fileName:    fileName,
          // שמור כ-sketch ישירות — Firebase מטפל במחרוזות base64 ללא בעיה
          sketch:      images[i].data || null,
          // שמור גם files לתאימות לאחור (ללא data — רק מטאדאטה)
          files:       [{ name: fileName, type: 'image/jpeg' }],
          date:        dateStr,
          time:        timeStr
        }), SAVE_TIMEOUT_MS, 'שמירת סקיצה');

        if(!await verifySaved(id)) throw new Error('ההזמנה לא נמצאה אחרי השמירה');
      } catch(e) {
        console.error('[upload] save failed', id, e);
        failures.push({ n: i + 1, name: fileName, msg: e.message });
      }
    }

    if(failures.length){
      uploadNotice('נשמרו ' + (images.length - failures.length) + ' מתוך ' + images.length +
                   '. נכשלו: ' + failures.map(f => f.name || ('קובץ ' + f.n)).join(', ') +
                   '. לחיצה נוספת על "שלח" תשלים את החסרים בלבד, בלי לשכפל.');
      btn.disabled = false;
      btn.textContent = 'שלח סקיצה ←';
      return;
    }

    // רק כאן. עד לרגע הזה המשלוח נשמר, כדי שניסיון חוזר יידע לדרוס.
    lgUploadBatchClear();
    uploadNotice('');
    document.getElementById('formPage').style.display = 'none';
    document.getElementById('successScreen').classList.add('show');
    document.getElementById('successRef').textContent = 'מספר פנייה: ' + refNum;
  }

  // הלולאה הקודמת ספרה סיומי דחיסה וקראה ל-saveAll רק כשהמונה השתווה
  // למספר הקבצים. קריאה חוזרת אחת שלא הגיעה — קובץ פגום, תמונה שנגמר עליה
  // הזיכרון, לשונית שהנייד הרדים — עצרה את הספירה לנצח: saveAll לא נקרא,
  // שום דבר לא נשלח, ושום שגיאה לא הוצגה. הכפתור נשאר "מעבד...".
  //
  // זמן קצוב לכל קובץ הופך את אותה תקלה בדיוק לשגיאה שהלקוח רואה.
  function compressOne(f){
    return new Promise(resolve => {
      compressImage(f.data, 1000, 0.6, d => resolve({ name: f.name, data: d }));
    });
  }

  let images;
  try {
    images = await Promise.all(uploadedFiles.map((f, i) => {
      const label = f.name || ('קובץ ' + (i + 1));
      const job = (f.type && f.type.startsWith('image/'))
        ? compressOne(f)
        : Promise.resolve({ name: f.name, data: f.data });
      return _lgWithTimeout(job, PROCESS_TIMEOUT_MS, 'עיבוד ' + label);
    }));
  } catch(e) {
    console.error('[upload] processing failed:', e);
    uploadNotice('העיבוד נכשל: ' + e.message + '. נסה שוב, או הסר את הקובץ הבעייתי.');
    btn.disabled = false;
    btn.textContent = 'שלח סקיצה ←';
    return;
  }

  await saveAll(images);
}

// Session auto-detected — no need to pre-fill

function logoClick(){
  const sess=JSON.parse(sessionStorage.getItem('lgSession')||'{}');
  if(sess.role==='admin') window.location.href='admin.html';
  else if(sess.role==='client') window.location.href='portal.html';
  else window.location.href='login.html';
}
</script>
