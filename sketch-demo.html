<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LuzGlass — בונה סקיצות</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">

<!-- בסיס העיצוב המשותף — אין להגדיר :root בדף הזה -->
<link rel="stylesheet" href="lg-ui.css?v=20260807">
<script src="lg-parse.js"></script>
<script src="lg-shapes.js"></script>
<script src="lg-layout.js"></script>
<script src="lg-catalog.js"></script>
<!-- הספרייה יושבת ב-RTDB. הדף עבד עד היום בלי Firebase, ולכן כל שימוש
     בו מוגן: בלי חיבור הגלריה עדיין מציגה את הצורות המשוגרות. -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="firebase-db.js?v=20260909"></script>
<style>
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 14px;position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;}
.topbar .ti{font-size:15px;font-weight:700;}.topbar .su{font-size:12px;color:var(--muted);}
.logo{font-size:16px;font-weight:900;}.logo span{color:var(--gold-text);}
.mode-tabs{display:flex;gap:2px;padding:8px 10px;background:var(--surface);border-bottom:1px solid var(--border);}
.mode-tab{flex:1;padding:9px;font-family:'Heebo',sans-serif;font-size:13px;font-weight:700;border:1px solid transparent;cursor:pointer;text-align:center;color:var(--muted);background:var(--bg);}
.mode-tab.active{background:var(--text);color:#f7f4ef;}
/* ── בונה השייפים ──────────────────────────────────────────────────
   הגלריה קצרה בכוונה. ההפרדה בין מה שנוגעים על הציור למה שנוגעים
   ברצועה היא לפי **גודל המטרה**: קו מידה הוא ~90×30px ונלחץ על הציור;
   ציר הוא ~10px ולכן יושב ברצועה. */
#btnFirstShape{min-height:44px;width:calc(100% - 20px);margin:10px;
  padding:10px 14px;border:1px solid var(--gold);border-radius:6px;
  background:var(--gold);color:var(--on-gold);
  font-family:'Heebo',sans-serif;font-size:15px;font-weight:700;cursor:pointer;}
#btnFirstShape:focus-visible{outline:2px solid var(--gold-text);outline-offset:2px;}
.shape-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));
  gap:8px;padding:10px;}
.shape-card{display:flex;flex-direction:column;align-items:stretch;gap:4px;
  border-radius:10px;border:1px solid var(--border);background:var(--bg);
  color:var(--text);padding:6px 4px;}
.sc-pick{display:flex;flex-direction:column;align-items:center;gap:6px;
  min-height:44px;padding:4px;cursor:pointer;border:0;background:none;
  color:inherit;font:inherit;border-radius:8px;}
.sc-flip{min-height:44px;font-size:12px;cursor:pointer;border-radius:8px;
  border:1px solid var(--border);background:var(--surface);color:var(--muted);}
.sc-flip.on{background:var(--gold);color:var(--on-gold);border-color:var(--gold);}
.sc-flip:focus-visible,.sc-pick:focus-visible{outline:2px solid var(--gold-text);outline-offset:2px;}
.shape-card canvas{display:block;width:74px;height:126px;}
.shape-card span{font-size:12px;line-height:1.25;text-align:center;}
.sh-own{font-size:12px;font-style:normal;color:var(--gold-text);}
.shape-card:focus-visible{outline:2px solid var(--gold-text);outline-offset:2px;}
@media (hover:hover){ .shape-card:hover{border-color:var(--gold);} }
.shape-chip{
  min-height:44px;padding:10px 8px;
  background:var(--bg);border:1px solid var(--border);border-radius:6px;
  font-family:'Heebo',sans-serif;font-size:13px;font-weight:700;
  color:var(--text);cursor:pointer;text-align:center;
  transition:background 180ms ease,border-color 180ms ease;
}
.shape-chip:hover{border-color:var(--gold);}
.shape-chip:focus-visible{outline:2px solid var(--gold-text);outline-offset:2px;}
.shape-chip .gi{display:block;font-size:20px;line-height:1.3;}

.shape-strip{
  display:flex;gap:8px;overflow-x:auto;padding:10px;
  background:var(--surface);border-top:1px solid var(--border);
  -webkit-overflow-scrolling:touch;
}
.strip-item{
  min-height:44px;min-width:88px;flex:0 0 auto;
  padding:8px 10px;border:1px solid var(--border);border-radius:6px;
  background:var(--bg);font-family:'Heebo',sans-serif;font-size:12px;
  display:flex;flex-direction:column;gap:4px;
}
.strip-item.bad{border-color:#c0392b;background:rgba(192,57,43,0.06);}
.strip-item .sn{font-weight:700;font-size:13px;}
.strip-row{display:flex;gap:4px;}
/* 32px ולא 44px במכוון: אלה פקדים משניים בתוך פריט שכולו כבר 44px,
   והם יושבים ברצועה דווקא כי הם מטרות קטנות. 8px ביניהם. */
.strip-row button{
  min-height:32px;min-width:32px;border:1px solid var(--border);
  background:var(--surface);border-radius:4px;cursor:pointer;font-size:13px;
  color:var(--text);
}
.strip-row button:hover{border-color:var(--gold);}
.strip-row button:focus-visible{outline:2px solid var(--gold-text);outline-offset:2px;}
.strip-row button.on{background:var(--gold);color:var(--on-gold);border-color:var(--gold);}
.strip-row{gap:8px;}
/* הקצוות אינם צורות — הם מה שיושב מעבר לצורה האחרונה */
/* ── גיליון המאפיינים ──────────────────────────────────────────────────
   נפתח מלמטה, כי שם האגודל. המנוע יודע פינוי, שיפוע בשני צירים, עובי
   וסוג זכוכית — ואף אחד מהם לא היה נגיש למי שבונה את הסקיצה. */
/* מעל שכבות המסך המלא (55–60): הגלריה נפתחת מה-+ שעל הציור,
   וגיליון המאפיינים הוא כל מטרתה של "עריכה מתקדמת" — שניהם נפתחים
   דווקא כשהציור תופס את כל המסך. */
.sheet-back{position:fixed;inset:0;background:rgba(26,23,20,0.45);z-index:70;
  opacity:0;pointer-events:none;transition:opacity .2s ease;}
.sheet-back.open{opacity:1;pointer-events:auto;}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:71;background:var(--surface);
  border-top-left-radius:16px;border-top-right-radius:16px;
  box-shadow:0 -4px 24px rgba(0,0,0,0.18);
  transform:translateY(100%);transition:transform .24s cubic-bezier(.32,.72,0,1);
  max-height:82vh;display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom);}
.sheet.open{transform:translateY(0);}
.sheet-grip{width:36px;height:4px;border-radius:2px;background:var(--border);
  margin:8px auto 0;flex:none;}
.sheet-head{display:flex;align-items:center;gap:10px;padding:10px 16px 8px;flex:none;}
.sheet-head h3{margin:0;flex:1;font-size:16px;}
.sheet-head .sub{font-size:12px;color:var(--muted);font-weight:400;}
.sheet-x{min-width:44px;min-height:44px;border:1px solid var(--border);
  background:var(--bg);border-radius:8px;cursor:pointer;font-size:16px;color:var(--text);}
.sheet-x:focus-visible{outline:2px solid var(--gold-text);outline-offset:2px;}
.sheet-body{overflow-y:auto;padding:0 16px 16px;-webkit-overflow-scrolling:touch;}
.sh-grp{border-top:1px solid var(--border);padding:12px 0 4px;}
.sh-grp:first-child{border-top:none;}
.sh-grp>h4{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:600;}
.sh-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap;}
.sh-row label{flex:0 0 96px;font-size:13px;}
/* 16px ולא פחות: קלט קטן מזה גורם ל-iOS לזום פנימה בכל נגיעה */
.sh-row input[type=number],.sh-row input[type=text],.sh-row select{
  flex:1;min-width:88px;min-height:44px;font-size:16px;padding:6px 10px;
  border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);}
.sh-row input:focus-visible,.sh-row select:focus-visible{outline:2px solid var(--gold-text);outline-offset:1px;}
.sh-seg{display:flex;gap:6px;flex:1;}
.sh-seg button{flex:1;min-height:44px;font-size:13px;border-radius:8px;cursor:pointer;
  border:1px solid var(--border);background:var(--bg);color:var(--text);}
.sh-seg button.on{background:var(--gold);color:var(--on-gold);border-color:var(--gold);}
.sh-seg button:focus-visible{outline:2px solid var(--gold-text);outline-offset:2px;}
/* שתי תוספות בבחירת הפרזול. 44px גם לתווית, כדי שהלחיצה תעבוד
   גם כשמנסים לפגוע במילה ולא בריבוע. */
.offer-text{margin:0 0 14px;font-family:'Heebo',sans-serif;font-size:14px;
  line-height:1.6;color:var(--text);}
.offer-text b{color:var(--gold-text);}
.offer-btns{display:flex;flex-direction:column;gap:8px;}
.offer-btns button{min-height:48px;border-radius:8px;cursor:pointer;
  font-family:'Heebo',sans-serif;font-size:15px;font-weight:700;}
.offer-yes{background:var(--gold);color:var(--on-gold);border:1px solid var(--gold);}
.offer-no{background:var(--bg);color:var(--text);border:1px solid var(--border);}
.offer-btns button:focus-visible{outline:2px solid var(--gold-text);outline-offset:2px;}
.add-tog{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
.add-tog label{display:flex;align-items:center;gap:8px;flex:1 1 46%;min-height:44px;
  padding:0 10px;border:1px solid var(--border);border-radius:8px;cursor:pointer;
  font-family:'Heebo',sans-serif;font-size:13px;color:var(--text);background:var(--bg);}
.add-tog input{width:18px;height:18px;accent-color:var(--gold);cursor:pointer;}
.add-tog label:focus-within{outline:2px solid var(--gold-text);outline-offset:2px;}
.sh-hole{border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:8px;}
.sh-hole-top{display:flex;align-items:center;justify-content:space-between;
  margin-bottom:8px;font-size:13px;font-weight:700;color:var(--gold-text);}
.sh-hole-x{min-width:44px;min-height:44px;border:1px solid var(--border);border-radius:8px;
  background:var(--bg);color:var(--text);cursor:pointer;font-size:15px;}
.sh-hole-x:focus-visible{outline:2px solid var(--gold-text);outline-offset:2px;}
.sh-hole-add{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 8px;}
.sh-hole-add button{flex:1 1 46%;min-height:44px;border-radius:8px;cursor:pointer;
  border:1px dashed var(--border);background:var(--bg);color:var(--text);
  font-family:'Heebo',sans-serif;font-size:13px;}
.sh-hole-add button:focus-visible{outline:2px solid var(--gold-text);outline-offset:2px;}
.sh-tog{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer;font-size:14px;}
.sh-tog input{width:22px;height:22px;accent-color:var(--gold);}
.sh-note{font-size:12px;color:var(--muted);margin:2px 0 8px;}
.sh-unit{font-size:12px;color:var(--muted);font-weight:400;}
.sh-gear{font-size:13px;}
@media (min-width:601px){
  .sheet{left:auto;right:0;top:0;bottom:0;width:380px;max-height:none;
    border-radius:0;transform:translateX(100%);border-left:1px solid var(--border);}
  .sheet.open{transform:translateX(0);}
  .sheet-grip{display:none;}
}
@media (prefers-reduced-motion:reduce){
  .sheet,.sheet-back{transition:none;}
}
.shape-err{
  margin:8px 10px;padding:10px 12px;border-radius:6px;
  background:#fdecea;border:1px solid #f5c6c2;color:#8f2d24;
  font-family:'Heebo',sans-serif;font-size:13px;line-height:1.5;
}
.shape-bom h5,.controls h5{margin:10px 0 4px;font-size:13px;color:var(--gold-text);}
.bom-row{display:flex;justify-content:space-between;gap:10px;font-size:13px;
  padding:3px 0;border-bottom:1px solid var(--border);}
.bom-row b{white-space:nowrap;}
.bom-sub{font-size:12px;color:var(--muted);padding:2px 0 6px;}
.bom-sku{font-family:ui-monospace,monospace;font-size:12px;color:var(--gold-text);}
.bom-tot{margin-top:8px;padding-top:6px;border-top:2px solid var(--gold);
  font-size:13px;font-weight:700;}
.controls{padding:0 12px 12px;}
.shape-bom{
  margin:8px 10px;padding:10px 12px;border:1px solid var(--border);
  background:var(--bg);font-family:'Heebo',sans-serif;font-size:13px;
}
.shape-bom b{color:var(--gold-text);}
@media (prefers-reduced-motion:reduce){
  .shape-chip,.strip-item{transition:none;}
}
/* היה כאן touch-action:none, שאומר לדפדפן "אני מטפל בכל מגע כאן". אבל
   על הקנבס יש רק מאזין click ואף מטפל מחוות — כלומר הגלילה נחסמה בתמורה
   לכלום. בפלאפון הקנבס תופס כמעט את כל המסך, ולכן לא נשארה שום רצועה
   לגלול ממנה והדף נתקע.
   pan-y מחזיר את הגלילה האנכית ומשאיר את הלחיצה על קווי המידה עובדת. */
/* ‏pan-x נוסף משהוגדל הקנבס מעבר למסך: בלעדיו אי אפשר לגלול אל החלק
   שיצא, ומחצית השרטוט הופכת לבלתי נגישה באצבע. */
#sk{touch-action:pan-x pan-y;}
/* מקלחון של ארבעה פאנלים יוצא רחב מפלאפון — כל פאנל צריך מקום למידות
   שלו, אחרת המספרים מתרחקים מהזכוכית או נחתכים. הקנבס גדל, והמכל גולל
   אליו. ‏overflow:hidden חתך את החלק שיצא, ואיתו כל מה שאפשר היה ללחוץ
   עליו שם. */
#addBtns{position:absolute;inset:0;pointer-events:none;}
.add-btn{position:absolute;width:44px;height:44px;transform:translate(-50%,-50%);
  pointer-events:auto;cursor:pointer;border-radius:50%;font-size:22px;line-height:1;
  border:1px solid var(--gold);background:var(--gold);color:var(--on-gold);
  box-shadow:0 2px 8px rgba(0,0,0,.18);display:flex;align-items:center;
  justify-content:center;padding:0;}
.add-btn:focus-visible{outline:2px solid var(--gold-text);outline-offset:3px;}
.canvas-wrap{background:var(--surface);margin:10px;border:1px solid var(--border);box-shadow:0 2px 12px rgba(0,0,0,0.06);position:relative;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;}
/* הקנבס נושא רוחב מפורש מ-setupCanvas ולא נמתח למכל: כשהוא רחב ממנו,
   מותר לו לגלוש והמכל גולל. ‏width:100% היה מכווץ אותו בחזרה ומועך את
   קנה המידה. */
canvas{display:block;height:auto;cursor:pointer;}
.dim-tip{position:absolute;background:var(--gold);color:var(--on-gold);padding:2px 7px;font-size:12px;font-weight:700;border-radius:3px;pointer-events:none;display:none;z-index:5;}

/* ── מצב עריכה ────────────────────────────────────────────────────
   הצייר מגיב למגע רק כאן. בלי זה, גרירה כדי לגלול נוחתת כלחיצה
   ופותחת משהו — ובפלאפון הקנבס תופס כמעט את כל המסך. */
.edit-bar{display:flex;gap:8px;margin:0 10px 10px;}
.edit-bar>button{flex:1;}
#btnAdvEdit{
  min-height:44px;padding:10px 14px;border:1px solid var(--border);
  border-radius:6px;background:var(--surface);color:var(--text);
  font-family:'Heebo',sans-serif;font-size:14px;font-weight:700;cursor:pointer;
}
#btnAdvEdit.on{background:var(--gold);color:var(--on-gold);border-color:var(--gold);}
#btnAdvEdit:focus-visible{outline:2px solid var(--gold-text);outline-offset:2px;}
.pick-bar{display:flex;align-items:center;gap:8px;margin:0 10px 10px;
  padding:6px;border:1px solid var(--gold);border-radius:6px;
  background:rgba(184,146,42,0.08);}
.pick-bar>button{min-height:44px;min-width:44px;cursor:pointer;border-radius:6px;
  border:1px solid var(--border);background:var(--bg);color:var(--text);
  font-size:16px;font-family:'Heebo',sans-serif;}
.pick-bar>button:focus-visible{outline:2px solid var(--gold-text);outline-offset:2px;}
.pick-bar .pick-go{background:var(--gold);color:var(--on-gold);border-color:var(--gold);
  font-weight:700;font-size:14px;padding:0 14px;}
#pickName{flex:1;text-align:center;font-size:14px;font-weight:700;color:var(--gold-text);}
#btnEditMode{
  min-height:44px;padding:10px 14px;
  border:1px solid var(--gold);border-radius:6px;
  background:var(--surface);color:var(--gold-text);
  font-family:'Heebo',sans-serif;font-size:14px;font-weight:700;cursor:pointer;
  transition:background 180ms ease,color 180ms ease;
}
#btnEditMode.on{background:var(--gold);color:var(--on-gold);}
#btnEditMode:focus-visible{outline:2px solid var(--gold-text);outline-offset:2px;}
.edit-hint{
  margin:0 10px 10px;padding:9px 12px;border-radius:6px;
  background:rgba(184,146,42,0.10);border:1px solid rgba(184,146,42,0.35);
  color:var(--text);font-family:'Heebo',sans-serif;font-size:13px;line-height:1.5;
}
/* הקנבס לעולם לא תופס את המחווה, גם במצב עריכה. הדפדפן כבר מבחין בין
   גרירה לנגיעה — click לא נורה על גרירה — ולכן אפשר גם לגלול מעל הציור
   וגם ללחוץ על מידה, באותו מצב. touch-action:none כאן חסם את הגלילה
   בדיוק כשהיא הכי נחוצה: כשמחפשים את המידה שרוצים לשנות. */
.canvas-wrap.editing{outline:2px solid var(--gold);outline-offset:-2px;}

/* ── מסך מלא לעריכה ──────────────────────────────────────────────
   שינוי תצוגה בלבד: אף אלמנט לא זז ב-DOM, אף מאזין לא נרשם מחדש,
   ואף פונקציה לא מקבלת מסלול שני. רק המעטפת גדלה, והציור מחושב
   מחדש כי רוחבו נגזר ממנה.

   ‏overflow-y חייב להשתנות ל-auto: במצב הרגיל גובה המעטפת נגזר
   מהקנבס והדף גולל, ובמסך מלא המעטפת קבועה בגובה החלון — עם hidden
   ציור של 2000 מ"מ היה נחתך. */
#fullBar{display:none;}
body.sketch-full{overflow:hidden;}
body.sketch-full #fullBar{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  position:fixed;top:0;left:0;right:0;height:52px;z-index:60;padding:0 12px;
  background:var(--surface);border-bottom:1px solid var(--border);
  font-family:'Heebo',sans-serif;font-size:15px;font-weight:700;color:var(--gold-text);
}
body.sketch-full #fullBar button{
  min-width:44px;min-height:44px;font-size:20px;cursor:pointer;
  border:1px solid var(--border);border-radius:8px;
  background:var(--bg);color:var(--text);
}
body.sketch-full #fullBar button:focus-visible{outline:2px solid var(--gold-text);outline-offset:2px;}
body.sketch-full .canvas-wrap{
  position:fixed;top:52px;left:0;right:0;bottom:var(--full-bottom,0px);
  margin:0;border-radius:0;z-index:55;
  overflow-x:auto;overflow-y:auto;
}
/* הפקדים נשארים מעל הציור ולא נעלמים מאחוריו */
body.sketch-full .edit-bar,
body.sketch-full .pick-bar,
body.sketch-full .edit-hint{
  position:fixed;left:0;right:0;z-index:58;margin:0;

}
/* הערימה נבנית מלמטה למעלה, וכל שכבה יושבת על גובה

   גופן או רוחב מסך. */
body.sketch-full .edit-bar{bottom:0;}
body.sketch-full .pick-bar{bottom:var(--full-bar-h,0px);border-radius:0;}
body.sketch-full .edit-hint{bottom:calc(var(--full-bar-h,0px) + var(--full-pick-h,0px));}

@media (prefers-reduced-motion:reduce){ #btnEditMode{transition:none;} }

.mm-row button.on{background:var(--gold);color:var(--on-gold);border-color:var(--gold);}

.add-btn:hover{background:var(--bg2);border-color:var(--gold-text);color:var(--text);}
.add-btn .ai{font-size:18px;}
.finish-btn{margin:6px 10px;padding:13px;background:var(--text);color:#f7f4ef;font-family:'Heebo',sans-serif;font-size:14px;font-weight:700;border:none;cursor:pointer;width:calc(100% - 20px);}
.finish-btn:hover{background:var(--gold);}
.specs{background:var(--surface);border:1px solid var(--border);margin:0 10px;padding:12px 14px;font-size:13px;line-height:1.85;color:var(--muted);border-right:3px solid var(--gold);}
.specs strong{color:var(--text);font-weight:700;font-size:13px;display:block;margin-bottom:4px;}
.btns{margin:10px;display:flex;gap:7px;}
.btn-add{flex:2;padding:14px;background:var(--gold);color:var(--on-gold);font-family:'Heebo',sans-serif;font-size:14px;font-weight:700;border:none;cursor:pointer;}
.btn-dl{flex:1;padding:14px;background:var(--text);color:var(--bg);font-family:'Heebo',sans-serif;font-size:13px;font-weight:600;border:none;cursor:pointer;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:#f7f4ef;padding:11px 20px;font-size:13px;font-weight:600;border-right:3px solid var(--gold);opacity:0;transition:all 0.3s;z-index:99;white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
.spacer{height:28px;}

/* ═══ רספונסיביות — נקודות העצירה של lg-ui.css: 600 / 900 / 1200 ═══ */
@media (min-width:901px){
  /* אייפד לרוחב ומעלה — הקנבס והפאנל זה לצד זה במקום זה מתחת לזה */
  .canvas-wrap{margin:14px;}
  /* שש הצורות נכנסות בשורה אחת, ואין צורך לגלול בשביל אף אחת מהן */
  .shape-gallery{grid-template-columns:repeat(6,1fr);}
  /* ברוחב הזה הרצועה לא צריכה לגלול — עדיף לראות את כל השייפים יחד */
  .shape-strip{flex-wrap:wrap;overflow-x:visible;}
}
@media (min-width:601px) and (max-width:900px){
  /* אייפד לאורך — שלוש בשורה, מטרה של כ-230px */
  .shape-gallery{grid-template-columns:repeat(3,1fr);}
}
@media (max-width:600px){
  .topbar{padding:10px;}
  .canvas-wrap{margin:8px;}
  /* חמש דוגמיות בשורה זה 62px כל אחת במסך 375 — צר מדי לאצבע */
  .mm-row{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
.mm-row button{flex:1;min-width:56px;min-height:44px;cursor:pointer;
  border:1px solid var(--border);border-radius:8px;background:var(--bg);
  color:var(--text);font-family:'Heebo',sans-serif;font-size:14px;font-weight:700;}
.mm-row button.on{background:var(--gold);color:var(--on-gold);border-color:var(--gold);}
.mm-row button:focus-visible{outline:2px solid var(--gold-text);outline-offset:2px;}
.mm-sku{margin-top:8px;font-size:13px;color:var(--muted);}
.mm-sku b{color:var(--gold-text);font-family:ui-monospace,monospace;}
.sw-grid{grid-template-columns:repeat(4,1fr);}
  .row{flex-wrap:wrap;row-gap:6px;}
  .row label{flex:1 1 100%;}
  .row input[type=number],.row input[type=text],.row select{width:100%;}
  /* שלוש בשורה על 375px זה 116px לצ'יפ שנושא אייקון וגם שתי מילים.
     שתיים נותנות 175px — מטרה נוחה לאגודל, והטקסט לא נשבר. */
  .shape-gallery{grid-template-columns:repeat(2,1fr);gap:8px;}
  .shape-chip{font-size:14px;}
  .strip-item{min-width:104px;}
}

<body>
<a href="#sdMain" class="skip-link">דלג לתוכן</a>

<div class="topbar">
  <div><div class="ti">בונה סקיצות</div><div class="su">LuzGlass</div></div>
  <div class="logo">Luz<span>Glass</span></div>
</div>
<div class="mode-tabs" id="sdMain">
  <button class="mode-tab active" id="mTab1" onclick="setMode('combo')">⬡ קומבינציה</button>
  <button class="mode-tab" id="mTab3" onclick="setMode('shape')">◫ שייפים</button>
  <button class="mode-tab" id="mTab2" onclick="setMode('item')">＋ פריט פריט</button>
</div>
<div class="sn-wrap" style="margin-top:10px;">
  <input class="sn-input" id="sketchName" placeholder="שם / מספר סקיצה" oninput="draw()">
</div>
<div id="clientSelectWrap" style="display:none;margin:0 10px 8px;">
  <select id="clientSelect" onchange="updateSketchClient()"
    style="width:100%;padding:9px 12px;background:#f7f4ef;border:1px solid rgba(0,0,0,0.12);font-family:Heebo,sans-serif;font-size:13px;color:#1a1714;outline:none;direction:rtl;">
    <option value="">-- בחר לקוח --</option>
  </select>
</div>
<!-- הסרגל של מצב מסך מלא. מוצג רק כשאחד ממצבי העריכה פעיל, וה-X שלו
     קורא לאותן פונקציות שהכפתורים הרגילים קוראים — אין מסלול יציאה שני. -->
<div id="fullBar" aria-hidden="true">
  <span id="fullBarTitle">מצב עריכה</span>
  <button type="button" onclick="exitFullEdit()" aria-label="סגור וחזור">✕</button>
</div>
<div class="canvas-wrap" id="canvasWrap">
  <canvas id="sk"></canvas>
  <!-- כפתורי ההוספה. הם יושבים מעל הקנבס במקום הפאה שאליה יתחבר השייף
       הבא, ומופיעים רק בצד שמנוע החוקיות מתיר. -->
  <div id="addBtns" aria-hidden="false"></div>
  <div class="dim-tip" id="dimTip"></div>
  <!-- נפתח במקום שבו נגעו במידה, כדי שהעין לא תעזוב את הציור -->
  <div id="dimEditor" role="dialog" aria-label="שינוי מידה">
    <span id="dimEditorLabel"></span>
    <!-- מאיפה מודדים. מוצג רק למידות שיש להן ייחוס, כמו גובה הידית. -->
    <span class="dim-ed-row" id="dimEditorRef" style="display:none">
      <button type="button" id="dimRefBot" onclick="dimEditorSetRef('bottom')">מלמטה</button>
      <button type="button" id="dimRefTop" onclick="dimEditorSetRef('top')">מלמעלה</button>
    </span>
    <input id="dimEditorInput" type="text" inputmode="decimal" autocomplete="off"
           onkeydown="if(event.key==='Enter'){event.preventDefault();dimEditorApply();}
                      else if(event.key==='Escape'){closeDimEditor();}">
    <!-- היחידה שבה מוקלד המספר. הכל נשמר במילימטרים; זו רק השפה שבה
         נוח למי שמזין. מי שרגיל למדוד בסנטימטרים יקליד 20 ולא 200. -->
    <span class="dim-ed-row" id="dimEditorUnit">
      <button type="button" id="dimUnitMm" onclick="dimEditorSetUnit('mm')">מ״מ</button>
      <button type="button" id="dimUnitCm" onclick="dimEditorSetUnit('cm')">ס״מ</button>
    </span>
    <span class="dim-ed-row">
      <button class="dim-ed-ok" onclick="dimEditorApply()">שמור</button>
      <button class="dim-ed-x"  onclick="closeDimEditor()">ביטול</button>
    </span>
  </div>
</div>

<!-- גיליון המאפיינים של שייף בודד. כל מה שהמנוע יודע לצייר ולא היה
     דרך להזין: פינוי מדרגה, שיפוע בשני צירים, עובי וסוג זכוכית. -->
<!-- הגלריה. נפתחת מלחיצה על + ומסוננת לצד שממנו נלחץ, כדי שהבחירה
     תהיה בין מה שאפשר לחבר שם — ולא רשימה שחלקה ייפסל. -->
<div class="sheet-back" id="galleryBack" onclick="closeGallery()"></div>
<div class="sheet" id="gallerySheet" role="dialog" aria-modal="true"
     aria-labelledby="galleryTitle" onkeydown="if(event.key==='Escape')closeGallery()">
  <div class="sheet-grip" aria-hidden="true"></div>
  <div class="sheet-head">
    <h3 id="galleryTitle">בחר זכוכית</h3>
    <button class="sheet-x" onclick="closeGallery()" aria-label="סגור">✕</button>
  </div>
  <div class="sheet-body">
    <div class="shape-gallery" id="shapeGallery"></div>
  </div>
</div>

<!-- ההצעה לזווית רצפה. **הצעה, לא חוק.** אין לה אקס ואין לה רקע
     שנסגר בלחיצה: שאלה שנסגרת בלי תשובה תישאל שוב בציור הבא, וזה
     נודניק. שתי התשובות מפורשות, ו"לא" הוא גם Escape. -->
<div class="sheet-back" id="offerBack"></div>
<div class="sheet" id="offerSheet" role="dialog" aria-modal="true"
     aria-labelledby="offerTitle" onkeydown="if(event.key==='Escape')offerAnswer(false)">
  <div class="sheet-grip" aria-hidden="true"></div>
  <div class="sheet-head"><h3 id="offerTitle">להוסיף זווית רצפה?</h3></div>
  <div class="sheet-body">
    <p id="offerText" class="offer-text"></p>
    <div class="offer-btns">
      <button type="button" class="offer-yes" onclick="offerAnswer(true)">כן, הוסף זווית רצפה</button>
      <button type="button" class="offer-no"  onclick="offerAnswer(false)">לא, תודה</button>
    </div>
  </div>
</div>

<div class="sheet-back" id="shapeSheetBack" onclick="closeShapeSheet()"></div>
<div class="sheet" id="shapeSheet" role="dialog" aria-modal="true"
     aria-labelledby="shapeSheetTitle" onkeydown="if(event.key==='Escape')closeShapeSheet()">
  <div class="sheet-grip" aria-hidden="true"></div>
  <div class="sheet-head">
    <h3 id="shapeSheetTitle">מאפייני הזכוכית</h3>
    <button class="sheet-x" onclick="closeShapeSheet()" aria-label="סגור">✕</button>
  </div>
  <div class="sheet-body" id="shapeSheetBody"></div>
</div>
<!-- מחוץ למצב עריכה הצייר אינו מגיב למגע, כדי שאפשר יהיה לגלול מעליו
     בלי לפתוח דברים בטעות. -->
<div class="edit-bar" id="editBar">
  <button id="btnEditMode" onclick="setEditMode(!editMode)">✎ מצב עריכה</button>
  <button id="btnAdvEdit" onclick="setPickMode(!pickMode)">⚙ עריכה מתקדמת</button>
</div>
<!-- בחירת שייף לעריכה. אינו פותח חלון מיד: קודם בוחרים על מה עובדים,
     ואז פותחים — כדי שהמשתמש יראה במה הוא נוגע לפני שהוא נוגע. -->
<div id="pickBar" class="pick-bar" style="display:none" role="group"
     aria-label="בחירת זכוכית לעריכה">
  <button type="button" onclick="pickStep(-1)" aria-label="הזכוכית שמשמאל">→</button>
  <span id="pickName" aria-live="polite"></span>
  <button type="button" onclick="pickStep(1)" aria-label="הזכוכית שמימין">←</button>
  <button type="button" class="pick-go" onclick="pickEdit()">ערוך</button>
</div>
<div id="editHint" class="edit-hint" style="display:none">
  לחץ על מידה בציור כדי לשנות אותה. בסיום — <b>שמור וסיים</b>.
</div>

<!-- COMBO UI -->
<div id="comboUI">
  <div class="combo-wrap">
    <div class="cat-tabs">
      <button class="cat-tab active" onclick="setCat('pinati',this)">פינתי</button>
      <button class="cat-tab" onclick="setCat('hazit',this)">חזיתי</button>
      <button class="cat-tab" onclick="setCat('ambatyon',this)">אמבטיון</button>
      <button class="cat-tab" onclick="setCat('kavua',this)">קבוע</button>
    </div>
    <div class="combo-grid" id="comboGrid"></div>
  </div>
  <div class="controls" id="comboCtrl"></div>

<!-- ITEM UI -->
<!-- בונה השייפים. שש צורות, ושתיים מהן קיצורי דרך ולא סוגים נפרדים:
     "קבוע משופע" הוא קבוע עם hasSlope מסומן מראש, ו"צורה חופשית" היא
     ה-kind:'shape' שכבר קיים בכלי. אף פריט בגלריה לא נושא פרזול — המנוע
     גוזר אותו מהצמתים, וצ'יפ עם ספירת צירים משלו היה סותר אותו. -->
<div id="shapeUI" style="display:none;">

// לליקוט — אותה שרשרת אחת, בלי עותק של המידע על המסך.
function setExtra(field,on){

  else if(field==='blackTrim')  selBlackTrim =!!on;

function renderExtras(){

  // ממשיך להזין אותו — הסיכום וההזמנה השמורה ממשיכים לעבוד כפי שעבדו.
  sand = (selWork==='chalavi');
  afterGlassChange();
}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}

// במצב שייפים המצב יושב לפי מזהה השייף ולא לפי מיקום, כדי שהזזה או
// מחיקה של שייף באמצע לא תזיז את המידות של השכנים.
// ‏getPStates נופל ל-mkPS כששייף עדיין בלי מצב, ולכן הציור עבד; ‏getPS
// לא נפל, ולכן **העריכה** לא עבדה — לחיצה על מספר החזירה undefined
// והחלון פשוט לא נפתח, בלי שום סימן. אותו מקור, אותה נפילה.
function getPS(pfx,i){
  if(appMode==='shape'){
    const s=shapeList[i]; if(!s) return null;
    if(!shapePS[s.id]) shapePS[s.id]=mkPS({type:s.kind});
    return shapePS[s.id];
  }
  if(pfx==='combo'){
    // אותה סיבה: פאנל בלי מצב קיבל ברירות מחדל טריות בכל קריאה
    if(!panelState[i]) panelState[i]=mkPS(curCombo.panels[i]||{type:'fixed'});
    return panelState[i];
  }
  return items[i];
}

function setPSv(pfx,i,k,el){
  const ps=getPS(pfx,i);if(!ps)return;
  if(k==='w'||k==='h'||k==='slopeH1'||k==='slopeH2'){
    const r=lgParseDimensionInput(el.value);
    const span=el.nextElementSibling;
    if(span&&span.classList&&span.classList.contains('dim-prev')){
      span.textContent=r.ok?el.value.trim()+' → '+r.mm+' מ"מ':r.error;
      span.style.color=r.ok?'var(--gold)':'#c0392b';
    }
    if(!r.ok)return;
    ps[k]=r.mm;
  }else{
    ps[k]=parseFloat(el.value)||0;
  }
  draw();
}
function setPSb(pfx,i,k,val){const ps=getPS(pfx,i);if(!ps)return;ps[k]=val;if(pfx==='combo')renderPanelCtrl();else renderItemList();draw();}
function setPSs(pfx,i,k,val){const ps=getPS(pfx,i);if(!ps)return;ps[k]=typeof val==='string'?val:val.value;if(pfx==='combo')renderPanelCtrl();else renderItemList();draw();}
function addHole(pfx,i){const ps=getPS(pfx,i);if(!ps)return;if(!ps.holes)ps.holes=[];ps.holes.push({diam:12,fromTop:100,fromRight:10});if(pfx==='combo')renderPanelCtrl();else renderItemList();draw();}
function rmHole(pfx,i,hi){const ps=getPS(pfx,i);if(!ps)return;ps.holes.splice(hi,1);if(pfx==='combo')renderPanelCtrl();else renderItemList();draw();}
function setHole(pfx,i,hi,k,el){const ps=getPS(pfx,i);if(ps&&ps.holes[hi])ps.holes[hi][k]=parseFloat(el.value)||0;draw();}

// ══════════════ בונה השייפים ══════════════
//
// הרכבה לינארית: הקבלן מניח צורה אחרי צורה, והמנוע גוזר מה יושב בכל
// צומת. אין כאן שדה פרזול — הוא נגזר, ולכן אי אפשר לסתור את הציור.
let shapeList=[];

// מה יושב בכל קצה של המקלחון. קיר או כלום.
//
// היה כאן קיר משני הצדדים, ולכן קבוע בודד קיבל ארבע זוויות — שתיים לכל
// צד. אבל קבוע בודד יושב על קיר אחד, ומהפאה השנייה אין כלום: שתי זוויות.
// זה תלוי בשטח ולא בסוג הצורה, ולכן זו בחירה של המפעיל ולא ניחוש.
//
// קבוע שדלת נתלית עליו הוא מקרה אחר לגמרי — שם הצומת הוא זכוכית-זכוכית,
// המנוע מחזיר hinge-gg, והצירים מצוירים על הקבוע. ר' _lgSidesOf.
// למקלחון יש **צד קיר וצד כניסה**. הזכוכית נשענת על הקיר, והכניסה היא
// הפתח — ולכן קבוע בודד מקבל שתי זוויות, לא ארבע. לקוח שמזמין לוח בודד
// להחלפה מקבל בדיוק את מה שנחתך בו.
//
// מה שכן היה שבור זה ש-sideBlocked הפך את צד הקיר ל**מחסום**: הכפתור
// לא הופיע שם בכלל. אבל קיר אינו מחסום — הוא מה שהזכוכית הבאה נשענת
// עליו, ולכן השרשרת גדלה גם לכיוונו.
//
// ‏let ולא const: התמונה בגלריה מצוירת בהקשר משוקף כשהכרטיס הפוך,
// וההקשר מוחלף לרגע וחוזר — כמו shapeList ו-shapePS לצדו.
let shapeBoundary={right:'wall',left:'open'};

function _shapeShower(){
  // אותה שרשרת שהציור עובר, ולא בנייה מקבילה. הרצועה מציגה את השגיאות
  // ואת הליקוט; כשהיא בנתה מקלחון משלה, היא יכלה לומר משהו אחר ממה
  // שמצויר — וזה בדיוק איך ששני מסלולים נפרדים.
  return _lgShowerOf(_shapePanels(), getPStates());
}

// המצב שהצייר צורך — אותו מבנה בדיוק שהקומבינציות מייצרות, כדי שלא יהיה
// נתיב ציור שני.
//
// wallSide נכתב על הפאנלים החיצוניים כי הגשר _lgShowerOf גוזר ממנו את
// הגבולות. בלעדיו קבוע במצב שייפים לא היה מקבל אף זווית קיר.
// מקבל רשימה, כדי שאפשר יהיה לשאול על **הרכבה מועמדת** בלי להחליף
// גלובלים. בלי זה, מי שרצה לבדוק חוקיות של הוספה נאלץ לבנות את המקלחון
// בעצמו — וכל בנייה מקבילה היא מסלול שני שיכול לענות תשובה אחרת.
function _shapePanels(list){
  const src=list||shapeList;
  const n=src.length;
  return src.map((s,i)=>{
    // ⚠️ שתי מוסכמות הפוכות, וזה היה הבאג:
    //
    //   המנוע:  'right' = לכיוון השייף הקודם במערך  → שמאל על הקנבס
    //   הצייר:  hingeSide==='left' ? x : x+pw       → 'left' = שמאל על הקנבס
    //
    // כלומר 'right' של המנוע הוא 'left' של הצייר. בלי ההיפוך, דלת שנתלית
    // על הקבוע צוירה עם הצירים על הקיר שמנגד — ובמקביל המנוע צייר סימוני
    // ציר בפאה המשותפת. שניהם יחד, וזה בלתי אפשרי פיזית.
    //
    // אומת מול הקומבינציות הקיימות: p_kd כותב hingeSide:'left' יחד עם
    // hingeOnFixed:'prev', כלומר אצל הצייר 'left' פונה לפאנל הקודם.
    const canvasHinge = s.hingeSide==='right' ? 'left'
                      : s.hingeSide==='left'  ? 'right' : undefined;
    const p={
      type: s.kind==='door'?'door':s.kind==='mirror'?'mirror':s.kind==='shape'?'shape':'fixed',
      label: s.label,
      hingeSide: canvasHinge,
      handleSide: canvasHinge==='right'?'left':'right',
      // prev/next נמדד על המערך, ולכן הוא נגזר מהמוסכמה של המנוע ולא מהקנבס
      hingeOnFixed: s.kind==='door' ? (s.hingeSide==='right'?'prev':'next') : undefined,
      // ההצהרה "זוויות בלבד" נוסעת עם הזכוכית עד למנוע, אחרת הכלל היה
      // מוכרע בכרטיס ולא בחוקיות.
      carriesDoor: s.carriesDoor,
    };
    const rW=shapeBoundary.right==='wall', lW=shapeBoundary.left==='wall';
    if(n===1)            p.wallSide = rW&&lW?'both':rW?'right':lW?'left':'none';
    else if(i===0)       p.wallSide = rW?'right':'none';
    else if(i===n-1)     p.wallSide = lW?'left':'none';
    else                 p.wallSide = 'none';
    return p;
  });
}

// lgEsc מוגדר ב-firebase-db.js, שהדף הזה לא טוען. שם צורה נכתב על ידי
// המשתמש ולכן חייב בריחה — בלי זה, שם עם < היה נכנס כ-HTML.
function _shEsc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,c=>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

let _shapeSeq=0;

// ─── קבוע שנושא דלת ──────────────────────────────────────────────────
//
// הצירים על הקבוע אינם נכתבים ביד. ההרכבה נבנית לרגע — הקבוע ולידו דלת
// שנתלית עליו — והמנוע נשאל **איפה הוא שם את הצירים בפועל**. התשובה
// מומרת חזרה למילימטרים ונשמרת על הזכוכית.
//
// זאת הסיבה שהצד לא יכול לסתור את המנוע: הוא לא נבחר כאן, הוא נמדד.
// הפעם הקודמת שכתבתי אותו ביד נתנה דלתות שהידית והציר שלהן באותו צד.
//
// כשדלת אמיתית תישען על הקבוע הזה, הצומת יטפל בפאה והקדחים המוצהרים
// יושמטו — פיסת מתכת אחת, ספירה אחת, כמו שנקבע.
function hingeHolesFromEngine(doorOn,mirrorCtx){
  const fixedFirst = doorOn==='right';
  const fx={id:'f',kind:'fixed',hingeSide:undefined,label:''};
  // ‏hingeSide של המנוע הפוך לקנבס; הדלת חייבת להיתלות **על הקבוע**
  const dr={id:'d',kind:'door',hingeSide:fixedFirst?'right':'left',label:''};
  const saveList=shapeList, savePS=shapePS, saveB=shapeBoundary;
  shapeList = fixedFirst ? [fx,dr] : [dr,fx];
  shapePS   = {f:mkPS({type:'fixed'}), d:mkPS({type:'door'})};
  // נמדד באותו הקשר שבו הוא ייצויר; אחרת הקדח נמדד מול קיר אחד ומצויר
  // מול אחר, ו"אותה פאה" מפסיקה להיות אותה פאה.
  if(mirrorCtx) shapeBoundary={right:shapeBoundary.left,left:shapeBoundary.right};
  let holes=[];
  try{
    const pss=Object.fromEntries(shapeList.map((x,i)=>[i,shapePS[x.id]]));
    const L=lgLayout(_lgShowerOf(_shapePanels(),pss),{canvasW:600});
    const fi=shapeList.findIndex(x=>x.id==='f');
    const g=L.shapes.find(x=>x.idx===fi);
    if(g){
      const sc=L.scale, left=g.x, right=g.x+g.w, bottom=g.y+g.h;
      holes=L.hardware.filter(h=>h.kind==='hinge').map(h=>({
        role:'hinge', dia:20,
        x:{from: Math.abs(h.x-left)<Math.abs(h.x-right) ? 'left' : 'right',
           mm: Math.round(Math.min(Math.abs(h.x-left),Math.abs(h.x-right))/sc)},
        y:{from:'bottom', mm: Math.round((bottom-h.y)/sc)},
      }));
    }
  } catch(e){ holes=[]; }
  finally { shapeList=saveList; shapePS=savePS; shapeBoundary=saveB; }
  return holes;
}

// הקשר קבוע לתמונה: קיר בשמאל הקנבס, פתוח בימין. אינו נקרא מהקנבס
// החי, כדי שהגלריה לא תשתנה לפי מה שהמשתמש בונה כרגע.
const THUMB_BOUNDARY={right:'wall',left:'open'};

function shapeThumb(cv, entry){
  const a=entry.add||{};
  // אותה זכוכית בדיוק ש-shapeAdd היה יוצר, על מקלחון של פריט אחד
  const ghost=[{id:'t',kind:a.kind,hingeSide:a.hingeSide,label:''}];
  const st=mkPS({type:a.kind});
  if(a.slope) st.hasSlope=true;
  if(a.slopeFlip){ const t=st.slopeH1; st.slopeH1=st.slopeH2; st.slopeH2=t; }
  if(a.notch) Object.assign(st,NOTCH_DEF);
  if(a.notchSide)  st.notchSide=a.notchSide;
  if(a.slopeSideV) st.slopeSideV=a.slopeSideV;
  if(a.hingesFor) st.holes=hingeHolesFromEngine(a.hingesFor,entry.flipped);
  if(a.holes) st.holes=a.holes.map(h=>({role:h.role,dia:h.dia,
                x:{from:h.x.from,mm:h.x.mm}, y:{from:h.y.from,mm:h.y.mm}}));

  // ── ההקשר מתהפך יחד עם הזכוכית ──
  //
  // "הפוך" הוא שיקוף של התמונה, ותמונה כוללת את מה שהזכוכית נשענת עליו.
  // בלי זה השיקוף היה חלקי וגרוע משבור: הזוויות נגזרות מהקיר, ולכן הן
  // נשארו במקומן בזמן שהצירים עברו צד — ואז הצירים נחתו על הפאה שהקיר
  // כבר תפס, וכלל "פיסת מתכת אחת לצומת" השמיט אותם. הציר לא נעלם בבאג;
  // הוא הושמט על ידי כלל נכון, בהקשר שלא שוקף.
  //
  // ⚠️ מוסכמת הגבולות הפוכה לקנבס: ‏boundary.right הוא שמאל הקנבס.
  // שיקוף אופקי הוא בדיוק החלפת השניים.
  const bound = entry.flipped
    ? {right:THUMB_BOUNDARY.left, left:THUMB_BOUNDARY.right}
    : THUMB_BOUNDARY;

  const saveList=shapeList, savePS=shapePS, saveB=shapeBoundary;
  shapeList=ghost; shapePS={t:st}; shapeBoundary=bound;
  let L=null;
  try { L=lgLayout(_lgShowerOf(_shapePanels(),{0:st}),{canvasW:260}); }
  finally { shapeList=saveList; shapePS=savePS; shapeBoundary=saveB; }
  if(!L) return;

  const box=cv.width, boxH=cv.height;
  const k=Math.min(box/L.canvas.w, boxH/L.canvas.h);
  const g=cv.getContext('2d');
  g.clearRect(0,0,box,boxH);
  const saveCx=cx, saveHits=dimHits;
  cx=g;
  g.save();
  g.translate((box-L.canvas.w*k)/2,(boxH-L.canvas.h*k)/2); g.scale(k,k);
  try {
    // המידות אינן נכנסות לכרטיס — בגודל הזה הן רעש. ‏hwMin מוגדל ביחס
    // ההקטנה, כדי שרצפת הקריאוּת של הצייר תישאר שלוש פיקסלים **על
    // הכרטיס** ולא תתכווץ איתו.
    engPaint({...L, dims:[]},'thumb',0,null,{hwMin:3/k});
  }
  finally { g.restore(); cx=saveCx; dimHits=saveHits; }
}


// כל הצורות שהגלריה מציגה: המשוגרות תחילה, ואחריהן מה שנשמר.
function galleryEntries(){
  const seeds=(typeof lgCatalogSeeds==='function')?lgCatalogSeeds():[];
  return seeds.concat(libFactory,libPersonal);
}

function renderShapeGallery(){
  const host=document.getElementById('shapeGallery');
  if(!host) return;
  const all=galleryEntries();
  // אחרי לחיצה על + הגלריה מציגה רק מה שחוקי באותו צד. זה אינו סינון
  // נוסף על החוקיות אלא **אותה תשובה** של lgValidate, בתצוגה.
  // אחרי לחיצה על + הגלריה מציגה רק מה שחוקי באותו צד, **ובאוריינטציה
  // שהמנוע אישר**. זה לא סינון נוסף על החוקיות אלא אותה תשובה בתצוגה.
  const only = addSide ? allowedAt(addSide) : null;
  const okEnt = only ? new Map(only.map(c=>[c.i,c.ent])) : null;
  const rows=[];
  all.forEach((e,i)=>{
    if(okEnt&&!okEnt.has(i)) return;
    const shown = okEnt ? okEnt.get(i) : galleryShown(i);
    rows.push('<div class="shape-card">'+
      '<button type="button" class="sc-pick" onclick="shapeAddFromCatalog('+i+')" '+
        'aria-label="הוסף '+_shEsc(shown.name)+'">'+
        '<canvas width="148" height="252"></canvas>'+
        '<span>'+_shEsc(shown.name)+'</span>'+
        (e.origin&&e.origin!=='seed'
          ? '<em class="sh-own">'+(e.origin==='factory'?'מפעל':'שלי')+'</em>' : '')+
      '</button>'+
      // ההיפוך מוצע רק כשהקנבס באמת מרשה את שתי האוריינטציות. כפתור
      // שמחזיר צורה שאי אפשר להרכיב כאן הוא הבטחה שהמערכת תפר.
      (entryCanFlip(e) && (!addSide || _bothFit(e,addSide))
        ? '<button type="button" class="sc-flip'+(flipped[e.id]?' on':'')+'" '+
          'onclick="galleryFlip('+i+')">⇄ הפוך</button>' : '')+
    '</div>');
  });
  host.innerHTML=rows.join('');
  const cards=host.querySelectorAll('.shape-card');
  let n=0;
  all.forEach((e,i)=>{ if(okEnt&&!okEnt.has(i)) return;
                       const cv=cards[n++]&&cards[n-1].querySelector('canvas');
                       if(cv) shapeThumb(cv, okEnt ? okEnt.get(i) : galleryShown(i)); });
}

// מה הכרטיס מציג כרגע — הערך עצמו, או ההיפוך שלו.
function galleryShown(i){
  const e=galleryEntries()[i];
  if(!e) return null;
  return flipped[e.id] ? lgFlipEntry(e) : e;
}

// צורה סימטרית אין מה להפוך בה, וכפתור שלא עושה כלום מבלבל.
function entryCanFlip(e){
  if(!e||!e.add||typeof lgFlipAdd!=='function') return false;
  return JSON.stringify(lgFlipAdd(e.add))!==JSON.stringify(e.add);
}

function galleryFlip(i){
  const e=galleryEntries()[i]; if(!e) return;
  flipped[e.id]=!flipped[e.id];
  renderShapeGallery();
}

// ─── לאן מותר להוסיף ─────────────────────────────────────────────────
//
// ה-UI **שואל** את מנוע החוקיות; הוא לא מחזיק עותק שלו. השאלה "מותר
// להוסיף בצד הזה?" נענית בדרך היחידה שאי אפשר לזייף: בונים את ההרכבה
// המועמדת ומריצים עליה את lgValidate. אם היא נקייה — מותר.
//
// לכן אין כאן שום תנאי מסוג "אם זה קבוע אז ימין". קיר, קבוע שאין לו על
// מה להישען, דלת שנתלית על אוויר — כולם נפסלים במקום אחד, וה-UI רק
// מציית לתשובה. לכתוב את הכללים גם כאן היה מאפשר למסך להציע חיבור
// שההזמנה תדחה.
//
// ‏side הוא **צד על הקנבס**: 'left' לפני הראשון במערך, 'right' אחרי
// האחרון, כי אינדקס גדל עם x.
function _tryArrangement(list,extraPS){ return _arrangementErrors(list,extraPS).length===0; }

// המקלחון המועמד נבנה **באותה שרשרת** שהציור עובר: פאנלים, ואז
// ‏lgFromPanels. זה לא ייעול — הבנייה המקבילה החזירה תשובה אחרת.
//
// ‏lgFromPanels קובע שדלת בקצה הופכת את הקצה לקיר, כי דלת תמיד נתלית על
// משהו. הבדיקה כאן שאלה עם shapeBoundary הגולמי, שבו הקצה עדיין פתוח,
// וקיבלה "לדלת אין על מה להיתלות" — אז כרטיס הדלת נעלם מהגלריה אחרי
// לחיצה על +, בזמן שהציור היה מצייר אותה בלי שום בעיה.
function _arrangementErrors(list,extraPS){
  if(typeof lgValidate!=='function') return [];
  const ex=extraPS||{};
  const pss=Object.fromEntries(list.map((s,i)=>[i, ex[s.id]||shapePS[s.id]||{}]));
  return lgValidate(_lgShowerOf(_shapePanels(list),pss));
}

// אילו ערכים מהגלריה מותר להוסיף בצד הזה. הרשימה הזאת היא גם התשובה
// לשאלה אם להציג + בכלל: רשימה ריקה פירושה שאין חיבור חוקי.
function allowedAt(side){
  const cand=[];
  galleryEntries().forEach((e,i)=>{
    const ent=_legalVariant(e,side);
    if(ent) cand.push({i:i, ent:ent});
  });
  return cand;
}

// ─── האוריינטציה שהקנבס מרשה ──────────────────────────────────────────
//
// **הקנבס הוא מקור האמת, לא הכרטיס.** צורה יכולה להיראות בשתי
// אוריינטציות, והשאלה איזו מהן מתאימה כאן נענית בדרך היחידה שאי אפשר
// לזייף: בונים את ההרכבה המועמדת ומריצים עליה את מנוע החוקיות.
//
// זה מחליף שתי החלטות נפרדות שהיו כאן. ‏flipped היה מתג תצוגה שלא ידע
// כלום על הקנבס, ורק **היד** של הדלת תוקנה לפי המנוע — כך שכל שאר שדות
// הצד (‏hingesFor, ‏notchSide, קדחים) הגיעו מהמתג בזמן שהיד הגיעה
// מהחוקיות. שני מקורות לאוריינטציה אחת, ומשם הסתירות.
//
// העדפת המשתמש נשמרת: אם הוא הפך את הכרטיס, מנסים קודם את מה שהוא
// רואה. היא רק לא גוברת על מה שאי אפשר להרכיב.
function _variantsOf(e){
  const flippedFirst = !!flipped[e.id];
  if(typeof lgFlipEntry!=='function' || !entryCanFlip(e)) return [e];
  const other = lgFlipEntry(e);
  return flippedFirst ? [other, e] : [e, other];
}

// המצב שערך קטלוג מייצר. **פונקציה אחת** ללוח אמיתי ולגשוש כאחד:
// כשהגשוש נשא רק kind ו-hingeSide, הוא לא ידע על המדרגה — ולכן שתי
// האוריינטציות "התאימו", נבחרה הראשונה, והלוח שנוצר יצא לא חוקי.
// מה שנבדק חייב להיות מה שנוצר.
function _stateFromAdd(a){
  const extra = a.notch ? Object.assign({},NOTCH_DEF) : {};
  if(a.carriesDoor!=null) extra.carriesDoor=a.carriesDoor;
  // הגבהים מוחלפים כאן ולא בקטלוג: המספרים באים מ-mkPS, והקטלוג נושא
  // רק את הכוונה. אותה החלפה בדיוק נעשית בתמונה שבגלריה.
  if(a.slopeFlip){ const d=mkPS({type:a.kind});
                   extra.slopeH1=d.slopeH2; extra.slopeH2=d.slopeH1; }
  if(a.notchSide)  extra.notchSide=a.notchSide;
  if(a.slopeSideV) extra.slopeSideV=a.slopeSideV;
  // הכוונה נשמרת לצד הקדחים שנגזרו ממנה. הקדחים הם תוצאה של
  // חישוב ולא הצהרה, ובלעדיה שמירת הצורה לספרייה היתה צריכה
  // לנחש מהם באיזה צד תיתלה הדלת.
  if(a.hingesFor){ extra.hingesFor=a.hingesFor;
                   extra.holes=hingeHolesFromEngine(a.hingesFor); }
  // עותק ולא הפניה: ערך בקטלוג משמש כל לוח שנוצר ממנו, ומערך משותף
  // היה גורם לעריכת קדח בלוח אחד לשנות אותו בכל השאר.
  if(a.holes) extra.holes=a.holes.map(h=>({role:h.role,dia:h.dia,
                x:{from:h.x.from,mm:h.x.mm}, y:{from:h.y.from,mm:h.y.mm}}));
  return extra;
}

function _fits(ent,side){
  const a=ent.add||{};
  const probe={id:'__probe',kind:a.kind,hingeSide:a.hingeSide,
               carriesDoor:a.carriesDoor};
  const list = side==='left' ? [probe].concat(shapeList) : shapeList.concat([probe]);
  return _tryArrangement(list, {'__probe': _stateFromAdd(a)});
}

// האם שתי האוריינטציות מתאימות כאן. רק אז יש טעם בכפתור "הפוך".
function _bothFit(e,side){
  const vs=_variantsOf(e);
  return vs.length>1 && vs.every(v=>_fits(v,side));
}

function _legalVariant(e,side){
  const vs=_variantsOf(e);
  for(let k=0;k<vs.length;k++) if(_fits(vs[k],side)) return vs[k];
  return null;
}


// ‏+ יושב על **כל קצה פנוי של השרשרת**, בשני הכיוונים, ובלי תלות בכמה
// זכוכיות כבר יש. אין כאן שום ידע על "הראשונה" או "השנייה": כל זכוכית
// שאפשר לצמוד אליה משהו מקבלת את אותו כפתור, מאותו מנגנון.
//
// מה שהיה כאן קודם — sideBlocked — הפך קיר למחסום. אבל קיר בקצה הוא
// בדיוק מה שהזכוכית הבאה נשענת עליו, ולכן הוא **מאפשר** הוספה ולא אוסר
// אותה. הבדיקה היחידה שנשארה היא זו של מנוע החוקיות.

// למה המנוע סירב. ההודעה באה **ממנו**, כדי שהמסך לא ינחש סיבה שאינה
// הסיבה האמיתית. נבדקות כל האוריינטציות, כי צורה שנפסלה בכיוון אחד
// עשויה להיות חוקית בשני.
function _whyNot(entry,side){
  if(!side) return 'החיבור אינו חוקי';
  const vs=_variantsOf(entry);
  let first='החיבור אינו חוקי';
  for(let k=0;k<vs.length;k++){
    const a=vs[k].add||{};
    const probe={id:'__probe',kind:a.kind,hingeSide:a.hingeSide,carriesDoor:a.carriesDoor};
    const list = side==='left' ? [probe].concat(shapeList) : shapeList.concat([probe]);
    const errs=_arrangementErrors(list,{'__probe':_stateFromAdd(a)});
    if(!errs.length) return '';        // דווקא חוקי — אין מה להסביר
    if(k===0) first=errs[0].msg;
  }
  return first;
}

function canAddAt(side){ return allowedAt(side).length>0; }

// ─── ציור כפתורי ההוספה ──────────────────────────────────────────────
//
// הכפתור יושב על הפאה שאליה יתחבר השייף הבא, ולא בשורית כפתורים בצד.
// המיקום נלקח מהפריסה — אותו מקום שבו הזכוכית מצוירת — ולכן הוא נשאר
// נכון גם כשהקנבס רחב מהמסך והמעטפת נגללת.
function renderAddButtons(){
  const host=document.getElementById('addBtns');
  if(!host) return;
  if(appMode!=='shape'||!lastL||!lastL.shapes||!lastL.shapes.length){
    host.innerHTML=''; return;
  }
  const k=(C.clientWidth||lastL.canvas.w)/lastL.canvas.w;
  // בונים **משמאל לימין**: הזכוכית הראשונה יושבת על הקיר השמאלי, וכל מה
  // שנוסף ממשיך ימינה. לכן יש כפתור אחד, על הפאה הימנית של האחרונה —
  // כפתור בשמאל היה מציע לבנות אחורה לתוך הקיר.
  const ends=[...lastL.shapes].sort((a,b)=>a.x-b.x);
  const g=ends[ends.length-1];
  if(!g||!canAddAt('right')){ host.innerHTML=''; return; }
  const x=(g.x+g.w)*k, y=(g.y+g.h/2)*k;
  host.innerHTML='<button type="button" class="add-btn" style="left:'+x.toFixed(0)+
    'px;top:'+y.toFixed(0)+'px" onclick="addAt(&quot;right&quot;)" '+
    'aria-label="הוסף זכוכית מימין">+</button>';
}

// לחיצה על + פותחת את הגלריה, מסוננת לצד שממנו נלחצה.
//
// הגלריה כבר אינה יושבת מתחת לקנבס. זכוכית נכנסת **דרך ה-+ בלבד**, ולכן
// אין טעם להציג רשימה שלמה כל הזמן — היא נפתחת כשמבקשים אותה, ומראה רק
// את מה שאפשר לחבר במקום שביקשו.
let addSide=null;

function addAt(side){
  addSide=side;
  renderShapeGallery();
  document.getElementById('galleryBack')?.classList.add('open');
  const sh=document.getElementById('gallerySheet');
  if(sh){ sh.classList.add('open');
          setTimeout(()=>sh.querySelector('.sc-pick')?.focus(),60); }
}

function closeGallery(){
  addSide=null;
  document.getElementById('galleryBack')?.classList.remove('open');
  document.getElementById('gallerySheet')?.classList.remove('open');
}


// ─── טעינת הספריות ───────────────────────────────────────────────────
//
// הכל מוגן: הדף הזה עבד עד היום בלי Firebase, ואם החיבור נופל הגלריה
// חוזרת לצורות המשוגרות במקום להישבר. ספרייה היא תוספת, לא תנאי.
async function loadShapeLibraries(){
  if(typeof lgLoadShapes!=='function') return;
  try { libFactory = await lgLoadShapes('factory'); } catch(e){ libFactory=[]; }
  if(_clientPhone){
    try { libPersonal = await lgLoadShapes('personal',_clientPhone); }
    catch(e){ libPersonal=[]; }
  }
  renderShapeGallery();
}

// ─── שמירת צורה ──────────────────────────────────────────────────────
//
// נשמר **ערך קטלוג ולא ציור**: שם, ומה להוסיף. הצורה נבנית מהמנוע בכל
// פעם מחדש, ולכן צורה שנשמרה לפני חצי שנה מציירת את עצמה לפי הכללים של
// היום. ציור שמור היה קופא ברגע השמירה ומשקר בפעם הבאה שכלל משתנה.
function shapeSaveOpen(id){
  const s=shapeList.find(x=>x.id===id); if(!s) return;
  const ps=shapePS[id]||{};
  const suggest = s.label + (ps.notchW>0?' עם מדרגה':'') + (ps.hasSlope?' משופע':'');
  const name=(prompt('שם הצורה בספרייה:',suggest)||'').trim();
  if(!name) return;
  // נשמר **רק מה שאפשר לשחזר**. שדה שהשמירה מקבלת והטעינה אינה
  // מחזירה הוא הבטחה שלא תקוים, והצורה תיפתח בפעם הבאה אחרת.
  const add={kind:s.kind};
  if(s.kind==='door') add.hingeSide=s.hingeSide;
  if(s.carriesDoor!=null) add.carriesDoor=s.carriesDoor;
  if(ps.hingesFor) add.hingesFor=ps.hingesFor;
  if(ps.hasSlope) add.slope=true;
  if(Number(ps.notchW)>0&&Number(ps.notchH)>0){
    add.notch=true;
    if(ps.notchSide==='left'||ps.notchSide==='right') add.notchSide=ps.notchSide;
  }
  // **רק קדחים שהצורה נושאת בעצמה.** ציר וזווית קיר נגזרים ממה
  // שהזכוכית נפגשת איתו, והם ישבו ב-ps.holes רק כתוצאה של חישוב.
  // שמירתם כהצהרה היא בדיוק מקור אמת שני — ו-lgCatalogValidate פוסל
  // אותם, כך שעד היום שמירת קבוע נושא דלת פשוט נכשלה.
  const own=(Array.isArray(ps.holes)?ps.holes:[])
    .filter(h=>h&&h.role&&typeof LG_CAT_OWN_ROLES!=='undefined'&&LG_CAT_OWN_ROLES[h.role]);
  if(own.length) add.holes=own.map(h=>({role:h.role,dia:h.dia,
    x:{from:h.x.from,mm:h.x.mm}, y:{from:h.y.from,mm:h.y.mm}}));
  const entry={name:name,add:add};
  const errs=(typeof lgCatalogValidate==='function')?lgCatalogValidate(entry):[];
  if(errs.length){ shapeToast(errs.join(' · '),true); return; }
  shapeSaveTo(entry);
}

async function shapeSaveTo(entry){
  const admin=_sess.role==='admin';
  const scope = admin
    ? (confirm('לשמור בספריית המפעל? (ביטול = לשמור אצלי בלבד)') ? 'factory' : 'personal')
    : 'personal';
  if(scope==='personal'&&!_clientPhone){
    shapeToast('אין טלפון לשמור עליו — התחבר כדי לשמור צורה',true); return;
  }
  if(typeof lgSaveShape!=='function'){ shapeToast('אין חיבור לספרייה',true); return; }
  try{
    const rec=await lgSaveShape(entry,scope,_clientPhone);
    if(scope==='factory') libFactory=libFactory.concat([rec]);
    else                  libPersonal=libPersonal.concat([rec]);
    renderShapeGallery();
    shapeToast('נשמר: '+entry.name);
  }catch(e){ shapeToast('השמירה נכשלה: '+(e&&e.message||''),true); }
}

function shapeToast(msg,bad){
  const el=document.getElementById('shapeErr'); if(!el) return;
  el.style.display='block';
  el.textContent=msg;
  el.style.color = bad ? '' : 'var(--gold-text)';
  if(!bad) setTimeout(()=>{ el.style.color=''; renderShapeUI(); },2500);
}


function shapeAddFromCatalog(i){
  const e0=galleryEntries()[i];
  if(!e0) return;
  // **אין מסלול בלי +.** הצד שממנו נלחץ הוא מה שקובע מה חוקי, ובלעדיו
  // אין שאלה לשאול את המנוע. הגלריה נפתחת רק מ-+, ולכן addSide תמיד
  // מלא כשמגיעים לכאן; הבדיקה היא רשת ביטחון לקורא עתידי.
  const side=addSide;
  if(!side) return;

  // ── האוריינטציה נקבעת פעם אחת ──
  //
  // כשמוסיפים דרך + , **הקנבס מכריע**: המנוע מחזיר את הצורה באוריינטציה
  // שהוא מסוגל להרכיב, וזו בדיוק זו שהוצגה בכרטיס. בלי + אין הקשר,
  // ואז מה שרואים הוא מה שנבחר.
  //
  // קודם תוקנה כאן **היד בלבד** לפי המנוע, בזמן שכל שאר שדות הצד —
  // ‏hingesFor, ‏notchSide, קדחים — הגיעו ממתג התצוגה. שני מקורות
  // לאוריינטציה אחת, ומשם באו הסתירות בין מה שהוצג למה שנכנס.
  const e = side ? _legalVariant(e0,side) : galleryShown(i);
  if(!e){ shapeToast('אי אפשר לחבר כאן: '+_whyNot(e0,side),true); return; }

  const a=e.add||{};
  const extra=_stateFromAdd(a);

  shapeAdd(a.kind,a.hingeSide,a.slope,Object.keys(extra).length?extra:null,side);
}

// ─── השער היחיד שדרכו נכנסת זכוכית ───────────────────────────────────
//
// **הבדיקה יושבת כאן ולא אצל הקורא.** קודם היא ישבה ב-shapeAddFromCatalog
// ורצה רק כשהיה addSide — כלומר רק אחרי לחיצה על +. לחיצה ישירה על
// כרטיס בגלריה השאירה אותו null, וכל מנגנון ה-Shape→Shape נעקף: הזכוכית
// נדחפה לסוף המערך בעיוורון. משם הגיעה "דלת על דלת".
//
// כל מי שמוסיף זכוכית — הגלריה, ה-+, וכל קורא עתידי — עובר כאן, ולכן
// אין יותר מסלול עוקף.
function shapeAdd(kind,hingeSide,slope,extra,side){
  const id='sh'+(_shapeSeq+1);
  const label = kind==='door' ? 'דלת' : kind==='mirror' ? 'מראה'
              : kind==='shape' ? 'צורה' : (slope?'קבוע משופע':'קבוע');
  const item={id,kind,hingeSide:hingeSide||undefined,label};
  if(extra&&extra.carriesDoor!=null) item.carriesDoor=extra.carriesDoor;

  // מצב הזכוכית נבנה **לפני** הבדיקה, כי החוקיות קוראת אותו: מדרגה,
  // שיפוע וקדחים כולם משתתפים בשאלה אם החיבור אפשרי.
  const st=mkPS({type:kind});
  if(slope) st.hasSlope=true;
  if(extra) Object.assign(st,extra);

  // אינדקס גדל => x גדל: תחילת המערך היא שמאל הקנבס וסופו ימין.
  const at = side==='left' ? 'left' : 'right';
  const cand = at==='left' ? [item].concat(shapeList) : shapeList.concat([item]);
  const errs=_arrangementErrors(cand, {[id]: st});
  if(errs.length){ shapeToast('אי אפשר לחבר כאן: '+errs[0].msg, true); return false; }

  _shapeSeq++;
  if(at==='left') shapeList.unshift(item); else shapeList.push(item);
  shapePS[id]=st;
  // הבחירה נעשתה: הסינון יורד **והגלריה מצוירת מחדש**. בלי הציור מחדש
  // היא נשארה תקועה על הסינון הקודם, צורות נעלמו ממנה ולא חזרו.
  addSide=null;
  closeGallery();
  renderShapeUI(); draw();
  return true;
}


function shapeRemove(id){
  shapeList=shapeList.filter(s=>s.id!==id);
  delete shapePS[id];
  renderShapeUI(); draw();
}
// צד הציר תלוי בשטח — אותה דלת נבנית ימין או שמאל. הליקוט לא משתנה.
function shapeFlipHinge(id){
  const s=shapeList.find(x=>x.id===id);
  if(!s||s.kind!=='door') return false;
  const to = s.hingeSide==='right'?'left':'right';
  // גם ההיפוך עובר בשער. בלי זה אפשר היה להרכיב הרכבה חוקית ואז להפוך
  // ציר ולהגיע לאותו "דלת על דלת" מהדלת האחורית.
  const cand=shapeList.map(x=>x===s?Object.assign({},x,{hingeSide:to}):x);
  const errs=_arrangementErrors(cand);
  if(errs.length){ shapeToast('אי אפשר להפוך כאן: '+errs[0].msg, true); return false; }
  s.hingeSide=to;
  renderShapeUI(); draw();
  return true;
}
let shapePS={};
let _galleryDrawn=0;
// הגלריה = הצורות המשוגרות ואחריהן מה שנשמר. הספריות נטענות פעם אחת,
// ואם אין חיבור נשארות ריקות — הגלריה עובדת בלעדיהן.
let libFactory=[], libPersonal=[];
// איזה כרטיס בגלריה מוצג הפוך כרגע. ההיפוך הוא מצב תצוגה של הכרטיס,
// ולא צורה נוספת בקטלוג — בחירה לוקחת את מה שרואים.
let flipped={};
let lastL=null;

// שם הסוג במקום אחד. שלוש רשימות נפרדות בצייר, ברצועה ובגיליון היו
// מתפצלות — וצורה חופשית באמת הוצגה כ"קבוע" בשניים מהם.
const KIND_HE={door:'דלת',mirror:'מראה',shape:'צורה חופשית',fixed:'קבוע'};
function kindName(k){ return KIND_HE[k]||KIND_HE.fixed; }
// זכוכית שאינה חלק מהרכבת המקלחון: אין לה פרזול ואיש אינו נתלה עליה.
function isFreeGlass(k){ return k==='shape'||k==='mirror'||k==='panel'; }

// ════════════════════════════════════════════════════════════════════════
//  גיליון המאפיינים
// ════════════════════════════════════════════════════════════════════════
//
// המנוע ידע לצייר פינוי מדרגה, שיפוע בשני צירים, עובי וסוג זכוכית —
// ולאף אחד מהם לא הייתה דרך להיכנס. הגיליון הוא הדרך.
//
// הוא כותב ישירות ל-ps ומצייר מחדש. אין כאן שכבת מצב שנייה: מה שהמנוע
// קורא הוא מה שהגיליון כותב, ולכן אין מה שיתפצל.
let sheetId=null, sheetPfx='shape';

// הגיליון שירת את טאב השייפים בלבד וחיפש ב-shapeList. אותו חלון נדרש
// עכשיו גם בקומבינציה, ולכן המטרה מפורשת: איזה מצב, ואיזה אינדקס בו.
// שני גיליונות היו שתי מערכות הגדרות לאותה זכוכית.
function _sheetIdx(){
  if(sheetPfx!=='shape') return (sheetId==null?-1:Number(sheetId));
  return shapeList.findIndex(s=>s.id===sheetId);
}
function _sheetMeta(i){
  if(sheetPfx==='shape'){ const s=shapeList[i]; return s?{label:s.label,kind:s.kind}:null; }
  const p=(getPanels()||[])[i];
  return p?{label:p.label||('זכוכית '+(i+1)),kind:p.type==='door'?'door':p.type||'fixed'}:null;
}

function openShapeSheet(id,pfx){
  sheetPfx = pfx || (appMode==='shape' ? 'shape' : appMode);
  sheetId=id;
  if(_sheetIdx()<0){ sheetId=null; return; }
  renderShapeSheet();
  document.getElementById('shapeSheetBack').classList.add('open');
  document.getElementById('shapeSheet').classList.add('open');
}
function closeShapeSheet(){
  sheetId=null; sheetPfx='shape';
  document.getElementById('shapeSheetBack').classList.remove('open');
  document.getElementById('shapeSheet').classList.remove('open');
}

// שינוי שדה בודד. ריק מוחק את השדה במקום לכתוב אפס — כך חוזרים
// לברירת המחדל של המנוע במקום לקבע ערך ששווה לה במקרה.
function sheetSet(field,val,redraw){
  const i=_sheetIdx();
  if(i<0) return;
  const ps=getPS(sheetPfx,i); if(!ps) return;
  if(val===''||val==null) delete ps[field];
  else ps[field]=val;
  if(redraw!==false){ renderShapeSheet(); renderShapeUI(); draw(); }
}
function sheetNum(field,el){
  const v=String(el.value).trim();
  if(v===''){ sheetSet(field,null); return; }
  const r=_dimParse(v);
  if(!r.ok){ el.style.borderColor='#c0392b'; return; }
  el.style.borderColor='';
  sheetSet(field,r.mm);
}
// הדלקה **כותבת את הערכים**, וכיבוי מוחק אותם.
//
// קודם היה כאן ps[k]==null — שמירה על מספרים שנושא המשתמש כבר הקליד.
// זה נשבר בשתי דרכים בבת אחת:
//
//   1. ב-JavaScript השוואה false==null היא **לא**. ו-mkPS נותן hasSlope:false
//      לכל לוח, ולכן הדגל לא נדלק מעולם — התיבה נדלקה ומיד
//      נכבתה בציור מחדש. שיפוע ברוחב כן עבד, כי hasSlopeW אינו
//      קיים ב-mkPS בכלל — וזה בדיוק ההבדל שנראה על המסך.
//
//   2. גם לו-הדגל היה נדלק, slopeH1/H2 של mkPS הם 2000/1800 קבועים.
//      אלה אינם מספרים שמישהו בחר — הם "מה יהיה אם תדליק" — ולוח
//      בגובה 2200 היה מקבל שיפוע 2000/1800, זאת אומרת נמוך מעצמו.
//      המספרים שהגיליון שולח נגזרים מהגובה האמיתי של הלוח.
//
// כיבוי מוחק בלאו הכי את הערכים, ולכן כיבוי-והדלקה מאפס גם היום.
// הכתיבה כאן אינה מאבדת שום דבר שלא היה אבוד בלאו הכי.
function sheetToggle(field,on,defaults){
  const i=_sheetIdx();
  if(i<0) return;
  const ps=getPS(sheetPfx,i); if(!ps) return;
  if(on) Object.keys(defaults).forEach(k=>{ ps[k]=defaults[k]; });
  else   Object.keys(defaults).forEach(k=>delete ps[k]);
  renderShapeSheet(); renderShapeUI(); draw();
}

function _shSeg(field,opts,cur){
  return '<span class="sh-seg">'+opts.map(o=>
    '<button type="button" class="'+(cur===o[0]?'on':'')+'" '+
    'onclick="sheetSet(\''+field+'\',\''+o[0]+'\')">'+_shEsc(o[1])+'</button>').join('')+'</span>';
}
// אותה יחידה כמו חלון המידה, ומצוינת בתווית. מספר בלי יחידה לידו הוא
// הזמנה לטעות של פי עשרה, וזו טעות שבית מלאכה לזכוכית משלם עליה.
function _shNum(field,label,val,ph){
  const shown = val==null ? '' : _dimToUnit(val);
  const hint  = (ph==null||ph==='') ? '' : String(_dimToUnit(Number(ph)||0));
  return '<div class="sh-row"><label for="sh_'+field+'">'+_shEsc(label)+
      ' <span class="sh-unit">'+_dimUnitLabel()+'</span></label>'+
    '<input id="sh_'+field+'" type="text" inputmode="decimal" value="'+shown+'" '+
    'placeholder="'+hint+'" onchange="sheetNum(\''+field+'\',this)"></div>';
}

// ─── קדחים שהצורה נושאת בעצמה ────────────────────────
//
// זה המנגנון שבו הספרייה גדלה בלי לגעת בקוד: ממקמים קדח על
// הזכוכית לפי קוטר ומרחק משתי פאות, שומרים את הצורה, והיא
// מופיעה בגלריה של הלקוחות.
//
// מוצגים כאן **רק קדחים שאינם נובעים משום מפגש**. זווית רצפה
// וקדח חופשי הם החלטה; ציר וזווית קיר נגזרים ממה שהזכוכית
// נפגשת איתו, ולתת לערוך אותם ביד היה מחזיר את אותה סתירה
// שהפילה את הקטלוג הקודם. הרשימה המותרת היא LG_CAT_OWN_ROLES,
// והיא המקור היחיד — גם למסך וגם לבדיקה לפני השמירה.
const LG_HOLE_HE={'bracket-floor':'זווית רצפה','hole':'קדח חופשי'};

// קדח חדש נולד במרחק שכבר קיים במערכת — ברירת המחדל של
// bracketInset — ולא במספר חדש שהמצאתי. מי שממקם קדח מקליד
// את המספר האמיתי בשני השדות מיד, ורואה אותו זז על הציור.
const LG_HOLE_INSET_DEF=25;

// כל הקוראים עוברים דרך getPS, כמו כל שאר המסך. רשימה שנשמרת
// בצד היתה העותק השני שהפרויקט הזה נלחם בו לאורך כל הדרך.
function _holeList(){
  const i=_sheetIdx(); if(i<0) return null;
  const ps=getPS(sheetPfx,i); if(!ps) return null;
  if(!Array.isArray(ps.holes)) ps.holes=[];
  return ps.holes;
}

function _holeRedraw(){ renderShapeSheet(); renderShapeUI(); draw(); }

function holeAdd(role){
  const L=_holeList(); if(!L) return;
  if(typeof LG_CAT_OWN_ROLES==='undefined'||!LG_CAT_OWN_ROLES[role]) return;
  L.push({role:role, dia:LG_CAT_OWN_ROLES[role],
          x:{from:'left',   mm:LG_HOLE_INSET_DEF},
          y:{from:'bottom', mm:LG_HOLE_INSET_DEF}});
  _holeRedraw();
}

function holeDel(k){
  const L=_holeList(); if(!L||!L[k]) return;
  L.splice(k,1);
  // רשימה ריקה נמחקת ולא נשארת כמערך ריק: כך המצב חוזר
  // לבדיוק מה שהיה לפני שנגעו בו.
  if(!L.length){ const ps=getPS(sheetPfx,_sheetIdx()); if(ps) delete ps.holes; }
  _holeRedraw();
}

function holeSet(k,path,val){
  const L=_holeList(), h=L&&L[k]; if(!h) return;
  if(path==='role'){
    if(typeof LG_CAT_OWN_ROLES==='undefined'||!LG_CAT_OWN_ROLES[val]) return;
    // הקוטר נגזר מהתפקיד רק כל עוד לא נגעו בו ביד
    if(h.dia===LG_CAT_OWN_ROLES[h.role]) h.dia=LG_CAT_OWN_ROLES[val];
    h.role=val;
  }
  else if(path==='x.from') h.x.from = val==='right' ? 'right' : 'left';
  else if(path==='y.from') h.y.from = val==='top'   ? 'top'   : 'bottom';
  else return;
  _holeRedraw();
}

function holeNum(k,path,el){
  const L=_holeList(), h=L&&L[k]; if(!h) return;
  const r=_dimParse(String(el.value).trim());
  if(!r.ok){ el.style.borderColor='#c0392b'; return; }
  el.style.borderColor='';
  if(path==='dia'){ if(r.mm>0) h.dia=r.mm; }
  else if(path==='x') h.x.mm=r.mm;
  else if(path==='y') h.y.mm=r.mm;
  else return;
  // בלי renderShapeSheet: ציור מחדש של הגיליון היה מוציא את הפוקוס
  // מהשדה שבו מקלידים, בדיוק באמצע ההקלדה.
  renderShapeUI(); draw();
}

// שורה אחת לקדח: תפקיד, קוטר, ומרחק משתי פאות — בדיוק
// המבנה שהמנוע קורא, ובדיוק כמו שקודחים באמת.
function _shHole(k,h){
  const roles=Object.keys((typeof LG_CAT_OWN_ROLES!=='undefined')?LG_CAT_OWN_ROLES:{});
  const seg=(path,opts,cur)=>'<div class="sh-seg">'+opts.map(o=>
    '<button type="button" class="'+(o[0]===cur?'on':'')+'" '+
    'onclick="holeSet('+k+',&quot;'+path+'&quot;,&quot;'+o[0]+'&quot;)">'+o[1]+'</button>').join('')+'</div>';
  const num=(path,val)=>'<input type="text" inputmode="decimal" value="'+_dimToUnit(val)+'" '+
    'onchange="holeNum('+k+',&quot;'+path+'&quot;,this)">';
  return '<div class="sh-hole">'+
    '<div class="sh-hole-top"><span>קדח '+(k+1)+'</span>'+
      '<button type="button" class="sh-hole-x" onclick="holeDel('+k+')" '+
      'aria-label="מחק קדח '+(k+1)+'">✕</button></div>'+
    '<div class="sh-row"><label>תפקיד</label>'+
      seg('role',roles.map(r=>[r,LG_HOLE_HE[r]||r]),h.role)+'</div>'+
    '<div class="sh-row"><label>קוטר <span class="sh-unit">'+_dimUnitLabel()+'</span></label>'+
      num('dia',h.dia)+'</div>'+
    '<div class="sh-row"><label>מהפאה</label>'+
      seg('x.from',[['left','שמאל'],['right','ימין']],h.x.from)+num('x',h.x.mm)+'</div>'+
    '<div class="sh-row"><label>מלמעלה/למטה</label>'+
      seg('y.from',[['bottom','מלמטה'],['top','מלמעלה']],h.y.from)+num('y',h.y.mm)+'</div>'+
  '</div>';
}

// הקבוצה עצמה. מוצגת לאדמין בלבד — זה כלי לבניית הספרייה,
// וקדח שמישהו הניח בטעות מגיע למפעל כזכוכית קדוחה שאי אפשר לתקן.
function _shHoles(ps){
  if(_sess.role!=='admin') return '';
  const all=Array.isArray(ps.holes)?ps.holes:[];
  const own=[], derived=[];
  all.forEach((h,i)=>{
    if(h&&h.role&&typeof LG_CAT_OWN_ROLES!=='undefined'&&LG_CAT_OWN_ROLES[h.role]) own.push([i,h]);
    else if(h&&h.role) derived.push(h);
  });
  const roles=Object.keys((typeof LG_CAT_OWN_ROLES!=='undefined')?LG_CAT_OWN_ROLES:{});
  return '<div class="sh-grp"><h4>קדחים על הצורה <span class="sub">אדמין</span></h4>'+
    own.map(e=>_shHole(e[0],e[1])).join('')+
    '<div class="sh-hole-add">'+roles.map(r=>
      '<button type="button" onclick="holeAdd(&quot;'+r+'&quot;)">+ '+
      (LG_HOLE_HE[r]||r)+'</button>').join('')+'</div>'+
    (derived.length ? '<p class="sh-note">ועוד '+derived.length+
      ' קדחים שהמנוע גזר מהמפגש — ציר או זווית קיר. הם אינם נערכים '+
      'כאן ואינם נשמרים על הצורה: הם נגזרים מחדש בכל הרכבה.</p>' : '')+
    '<p class="sh-note">מרחק נמדד מהפאה עצמה, ולכן שיפוע ומדרגה מזיזים את הקדח '+
    'איתם. בסיום — הכוכב על הרצועה שומר את הצורה בספרייה.</p>'+
  '</div>';
}

function renderShapeSheet(){
  const body=document.getElementById('shapeSheetBody');
  const i=_sheetIdx();
  const s=i<0?null:_sheetMeta(i);
  if(!body||i<0||!s) return;
  const ps=getPS(sheetPfx,i)||{};
  document.getElementById('shapeSheetTitle').innerHTML=
    _shEsc(s.label)+' <span class="sub">'+kindName(s.kind)+'</span>';

  const hasSlopeH = !!ps.hasSlope  && ps.slopeH1>0 && ps.slopeH2>0;
  const hasSlopeW = !!ps.hasSlopeW && ps.slopeW1>0 && ps.slopeW2>0;
  const hasNotch  = ps.notchW>0  && ps.notchH>0;
  const H=ps.h||2000, W=ps.w||(s.kind==='door'?800:500);
  // הפרש השיפוע שמוצע כשמדליקים. המנוע מצייר שיפוע רק כששתי
  // המידות חיוביות **ושונות זו מזו**, ולכן הפרש קבוע של 50
  // היה מחזיר את אותו כשל שקט על לוח קטן ממנו: התיבה נדלקת
  // ולא קורה כלום. עשירית המידה תמיד קטנה ממנה וגדולה מאפס.
  const drop=v=>Math.max(1, v-Math.min(50, Math.round(v/10)));

  body.innerHTML =
  '<div class="sh-grp"><h4>מידות</h4>'+
    _shNum('w','רוחב',ps.w,String(W))+
    _shNum('h','גובה',ps.h,String(H))+
  '</div>'+

  '<div class="sh-grp"><h4>שיפוע</h4>'+
    '<label class="sh-tog"><input type="checkbox" '+(hasSlopeH?'checked':'')+
      ' onchange="sheetToggle(\'slopeH\',this.checked,{hasSlope:true,slopeH1:'+H+',slopeH2:'+drop(H)+'})">'+
      'שיפוע בגובה — שתי פאות בגבהים שונים</label>'+
    (hasSlopeH ?
      _shNum('slopeH1','גובה שמאל',ps.slopeH1)+
      _shNum('slopeH2','גובה ימין',ps.slopeH2)+
      '<div class="sh-row"><label>הצד שנחתך</label>'+
        _shSeg('slopeSideH',[['bottom','רצפה'],['top','תקרה']],ps.slopeSideH||'bottom')+'</div>'+
      '<p class="sh-note">מקלחון נחתך ברצפה — האגן מנוקז.</p>' : '')+

    '<label class="sh-tog"><input type="checkbox" '+(hasSlopeW?'checked':'')+
      ' onchange="sheetToggle(\'slopeW\',this.checked,{hasSlopeW:true,slopeW1:'+W+',slopeW2:'+drop(W)+'})">'+
      'שיפוע ברוחב — קיר לא ישר</label>'+
    (hasSlopeW ?
      _shNum('slopeW1','רוחב עליון',ps.slopeW1)+
      _shNum('slopeW2','רוחב תחתון',ps.slopeW2)+
      '<div class="sh-row"><label>הפאה שנחתכת</label>'+
        _shSeg('slopeSideV',[['left','שמאל'],['right','ימין']],ps.slopeSideV||'left')+'</div>' : '')+
  '</div>'+

  (s.kind!=='fixed' ? '' :
  '<div class="sh-grp"><h4>פינוי מדרגה</h4>'+
    '<label class="sh-tog"><input type="checkbox" '+(hasNotch?'checked':'')+
      ' onchange="sheetToggle(\'notch\',this.checked,NOTCH_DEF)">'+
      'הזכוכית יושבת על מדרגה</label>'+
    (hasNotch ?
      _shNum('notchW','רוחב המדרגה',ps.notchW)+
      _shNum('notchH','גובה המדרגה',ps.notchH)+
      _shNum('notchHIn','גובה פנימי',ps.notchHIn,String(ps.notchH))+
      _shNum('notchRest','רוחב שנשאר',ps.notchRest,String((ps.w||W)-(ps.notchW||0)))+
      '<div class="sh-row"><label>צד המדרגה</label>'+
        _shSeg('notchSide',[['left','שמאל'],['right','ימין']],ps.notchSide||'left')+'</div>'+
      '<div class="sh-row"><label>הזווית התחתונה</label>'+
        _shSeg('notchBracket',[['floor','מהרצפה'],['shoulder','מהכתף'],['both','שתיהן']],
               ps.notchBracket||'floor')+'</div>'+
      '<p class="sh-note">המדרגה תמיד בצד הקיר — לא בצד שהדלת נתלית עליו. '+
      'גובה פנימי שונה מהחיצוני אומר שהמדף משופע.</p>' : '')+
  '</div>')+

  '<div class="sh-grp"><h4>זכוכית</h4>'+
    '<div class="sh-row"><label for="sh_thickness">עובי <span class="sh-unit">מ״מ</span></label>'+
      '<select id="sh_thickness" onchange="sheetSet(\'thickness\',this.value===\'\'?null:Number(this.value))">'+
        ['','6','8','10','12'].map(v=>'<option value="'+v+'"'+

  (isFreeGlass(s.kind)
    // זכוכית חופשית אינה חלק מהרכבת המקלחון: אין לה זוויות ואיש אינו
    // נתלה עליה. פינוי וחורים יקבלו מנוע משלהם.
    ? '<div class="sh-grp"><h4>פרזול</h4>'+
        '<p class="sh-note">זכוכית חופשית אינה נושאת פרזול של הרכבה. פינוי יתווסף בהמשך.</p>'+
      '</div>'

      '</div>')+

  // קדחים שהצורה נושאת בעצמה — גם על זכוכית חופשית, שהרי היא
  // הזכוכית שהכי צריכה אותם: אין לה שכנים שמהם אפשר לגזור כלום.
  _shHoles(ps);
}

// ─── הפירוט ──────────────────────────────────────────────────────────
//
// **פירוט אחד, שני טאבים.** ‏lgOrderLines כבר מאחד זכוכית ופרזול לשורות
// עם מפתח קטלוגי — הצירוף שממנו ייגזר המק"ט. המנוע אינו יודע מק"טים
// ואינו צריך: המיפוי יגיע מבחוץ, מהמחירון של חשבשבת, וייכנס כאן.
//
// עד היום הליקוט הוצג בטאב הצורות בלבד ובפרזול בלבד. זכוכית היא רוב
// המחיר, ובלעדיה הפירוט לא אומר כמעט כלום.
const LG_HW_HE={'bracket-wall':'זווית קיר','bracket-gg':'זווית זכוכית-זכוכית',
                'bracket-floor':'זווית רצפה','hinge-gg':'ציר זכוכית-זכוכית',
                'hinge-wall':'ציר קיר-זכוכית','handle':'ידית',
                // תוספות לבקשת הלקוח, והגומיות שהחוקיות שלהן עוד לא נקבעה
                'support-bar':'מוט חיזוק','black-trim':'מעטפת שחורה',
                'seal-floor-wiper':'מגב רצפה','seal-magnet-corner':'מגנט פינתי',
                'seal-magnet-straight':'מגנט ישר'};

function renderBom(el, shower){
  if(!el) return;
  const lines=(typeof lgOrderLines==='function')?lgOrderLines(shower):[];
  if(!lines.length){ el.style.display='none'; el.innerHTML=''; return; }

  const glass=lines.filter(l=>l.key.kind==='glass');
  const hw   =lines.filter(l=>l.key.kind==='hardware');
  const tot  =(typeof lgGlassTotals==='function')?lgGlassTotals(shower):null;

  const rows=[];
  if(glass.length){
    rows.push('<h5>זכוכית</h5>');
    glass.forEach(l=>{
      // המידות הן **מידות חיתוך** — מה שהחותך מקבל. השטח נמדד לפי תיבה
      // חוסמת, כמו שנקבע: הגובה הגדול ביותר והרוחב הגדול ביותר.
      const cuts=(l.detail||[]).map(d=>d.cutW+'×'+d.cutH+(d.shape&&d.shape!=='מלבן'?' ('+d.shape+')':''));
      // המק"ט מוצג לצד השורה. הוא נגזר מ-LG_SKU_MAP ולא נכתב כאן, ולכן
      // אם אין פריט לצירוף — נאמר במפורש במקום להמציא מספר.
      const sku=(typeof lgGlassSku==='function' && l.key.thickness && l.key.glassType)
                ? lgGlassSku(l.key.thickness,l.key.glassType,l.key.glassWork) : null;
      rows.push('<div class="bom-row"><span>'+
        (l.key.thickness?l.key.thickness+' מ"מ':'עובי לא נבחר')+
        (l.key.glassType?' · '+_shEsc(l.key.glassType):'')+
        (l.key.glassWork&&typeof LG_GLASS_WORK!=='undefined'&&LG_GLASS_WORK[l.key.glassWork]
          ? ' · '+LG_GLASS_WORK[l.key.glassWork].he : '')+
        (sku?' <b class="bom-sku">'+sku+'</b>':'')+
        '</span><b>'+l.qty+' מ"ר</b></div>'+
        '<div class="bom-sub">'+l.panes+' לוחות · '+cuts.join(' · ')+
        (l.key.thickness&&l.key.glassType&&!sku?' · אין פריט לצירוף הזה':'')+'</div>');
    });
  }
  if(hw.length){
    rows.push('<h5>פרזול</h5>');
    hw.forEach(l=>rows.push('<div class="bom-row"><span>'+
      (LG_HW_HE[l.key.type]||l.key.type)+'</span><b>'+l.qty+'</b></div>'));
  }
  if(tot) rows.push('<div class="bom-tot">סה"כ '+tot.panes+' לוחות · '+
    tot.m2+' מ"ר · '+tot.kg+' ק"ג · '+tot.holes+' קדחים</div>');

  el.style.display='block';
  el.innerHTML=rows.join('');
}

function renderShapeUI(){
  if(!_galleryDrawn){ _galleryDrawn=1; loadShapeLibraries(); }
  const strip=document.getElementById('shapeStrip');
  const errEl=document.getElementById('shapeErr');
  const bomEl=document.getElementById('shapeBom');
  if(!strip) return;

  const sh=_shapeShower();
  const errs=(typeof lgValidate==='function')?lgValidate(sh):[];
  const badIds={};errs.forEach(e=>{badIds[e.at]=e.msg;});

  // הקצוות אינם מוצגים יותר. shapeBoundary נשאר כמצב פנימי שמזין את
  // מנוע החוקיות — הוא זה שקובע איפה כפתור + מותר להופיע — אבל אין
  // סיבה שהמשתמש יגדיר אותו ביד, כי ה-+ כבר עונה על אותה שאלה.
  strip.innerHTML = shapeList.length ? shapeList.map((s,i)=>
    '<div class="strip-item'+(badIds[s.id]?' bad':'')+'">'+
      '<span class="sn">'+_shEsc(s.label)+(s.kind==='door'?' ('+(s.hingeSide==='right'?'ימין':'שמאל')+')':'')+'</span>'+
      '<span class="strip-row">'+
        (s.kind==='door'?'<button onclick="shapeFlipHinge(\'' + s.id + '\')" aria-label="החלף צד ציר">⇄</button>':'')+
        '<button onclick="shapeSaveOpen(\'' + s.id + '\')" aria-label="שמור בספרייה" title="שמור בספרייה">☆</button>'+
        '<button onclick="shapeRemove(\'' + s.id + '\')" aria-label="הסר">✕</button>'+
      '</span>'+
    '</div>').join('')
    : '<div style="padding:8px;color:var(--muted);font-size:13px">בחר צורה מהגלריה כדי להתחיל</div>';

  if(errs.length){
    errEl.style.display='block';
    errEl.textContent=errs.map(e=>e.msg).join(' · ');
  } else errEl.style.display='none';

  // הליקוט מוצג מהמנוע ולא נספר מחדש — שתי ספירות מתפצלות.
  renderBom(bomEl, sh);
}
function setCat(cat,btn){
  curCat=cat;

}
function renderCombos(){
  document.getElementById('comboGrid').innerHTML=COMBOS[curCat].map(c=>`
    <button class="combo-btn ${c.id===curCombo.id?'active':''}" onclick="selCombo('${c.id}')">${c.label}</button>`).join('');

function selCombo(id){
  const all=Object.values(COMBOS).flat();
  curCombo=all.find(c=>c.id===id)||curCombo;
  renderCombos();initPS();renderPanelCtrl();draw();
}

    <div class="row"><label>ידית</label>

        <button class="tb ${ps.handleType==='knob'?'active':''}" onclick="setPSs('${pfx}',${i},'handleType','knob')">כפתור</button>

      <input type="number" id="${pfx}_hEd_${i}" value="${ps.handleEdge}" min="3" max="30" oninput="setPSv('${pfx}',${i},'handleEdge',this)">

      <input type="number" value="${ps.towelSpacing}" min="20" max="120" oninput="setPSv('${pfx}',${i},'towelSpacing',this)">
      <span class="unit">ס״מ</span></div>`:''}`;
  }
  if(isFixed){

      <div class="tog" style="flex:1">
