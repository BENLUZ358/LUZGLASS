<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LuzGlass — בונה סקיצות</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">

<!-- בסיס העיצוב המשותף — אין להגדיר :root בדף הזה -->
<link rel="stylesheet" href="lg-ui.css?v=20260807">
<script src="lg-parse.js"></script>
<script src="lg-shapes.js"></script>
<script src="lg-layout.js"></script>
<style>
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 14px;position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;}
.topbar .ti{font-size:15px;font-weight:700;}.topbar .su{font-size:12px;color:var(--muted);}
.logo{font-size:16px;font-weight:900;}.logo span{color:var(--gold-text);}
.mode-tabs{display:flex;gap:2px;padding:8px 10px;background:var(--surface);border-bottom:1px solid var(--border);}
.mode-tab{flex:1;padding:9px;font-family:'Heebo',sans-serif;font-size:13px;font-weight:700;border:1px solid transparent;cursor:pointer;text-align:center;color:var(--muted);background:var(--bg);}
.mode-tab.active{background:var(--text);color:#f7f4ef;}
/* ── בונה השייפים ──────────────────────────────────────────────────
   הגלריה קצרה בכוונה. ההפרדה בין מה שנוגעים על הציור למה שנוגעים
   ברצועה היא לפי **גודל המטרה**: קו מידה הוא ~90×30px ונלחץ על הציור;
   ציר הוא ~10px ולכן יושב ברצועה. */
.build-dir{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px 10px 0;font-size:13px;}
.bd-label{color:var(--muted);}
.bd-seg{display:flex;gap:6px;flex:1;min-width:220px;}
.bd-seg button{flex:1;min-height:44px;font-size:13px;border-radius:8px;cursor:pointer;
  border:1px solid var(--border);background:var(--bg);color:var(--text);}
.bd-seg button.on{background:var(--gold);color:var(--on-gold);border-color:var(--gold);}
.bd-seg button:focus-visible{outline:2px solid var(--gold-text);outline-offset:2px;}
.bd-next{color:var(--gold-text);font-weight:600;}
.shape-gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px;}
.shape-chip{
  min-height:44px;padding:10px 8px;
  background:var(--bg);border:1px solid var(--border);border-radius:6px;
  font-family:'Heebo',sans-serif;font-size:13px;font-weight:700;
  color:var(--text);cursor:pointer;text-align:center;
  transition:background 180ms ease,border-color 180ms ease;
}
.shape-chip:hover{border-color:var(--gold);}
.shape-chip:focus-visible{outline:2px solid var(--gold-text);outline-offset:2px;}
.shape-chip .gi{display:block;font-size:20px;line-height:1.3;}

.shape-strip{
  display:flex;gap:8px;overflow-x:auto;padding:10px;
  background:var(--surface);border-top:1px solid var(--border);
  -webkit-overflow-scrolling:touch;
}
.strip-item{
  min-height:44px;min-width:88px;flex:0 0 auto;
  padding:8px 10px;border:1px solid var(--border);border-radius:6px;
  background:var(--bg);font-family:'Heebo',sans-serif;font-size:12px;
  display:flex;flex-direction:column;gap:4px;
}
.strip-item.bad{border-color:#c0392b;background:rgba(192,57,43,0.06);}
.strip-item .sn{font-weight:700;font-size:13px;}
.strip-row{display:flex;gap:4px;}
/* 32px ולא 44px במכוון: אלה פקדים משניים בתוך פריט שכולו כבר 44px,
   והם יושבים ברצועה דווקא כי הם מטרות קטנות. 8px ביניהם. */
.strip-row button{
  min-height:32px;min-width:32px;border:1px solid var(--border);
  background:var(--surface);border-radius:4px;cursor:pointer;font-size:13px;
  color:var(--text);
}
.strip-row button:hover{border-color:var(--gold);}
.strip-row button:focus-visible{outline:2px solid var(--gold-text);outline-offset:2px;}
.strip-row button.on{background:var(--gold);color:var(--on-gold);border-color:var(--gold);}
.strip-row{gap:8px;}
/* הקצוות אינם צורות — הם מה שיושב מעבר לצורה האחרונה */
/* ── גיליון המאפיינים ──────────────────────────────────────────────────
   נפתח מלמטה, כי שם האגודל. המנוע יודע פינוי, שיפוע בשני צירים, עובי
   וסוג זכוכית — ואף אחד מהם לא היה נגיש למי שבונה את הסקיצה. */
.sheet-back{position:fixed;inset:0;background:rgba(26,23,20,0.45);z-index:40;
  opacity:0;pointer-events:none;transition:opacity .2s ease;}
.sheet-back.open{opacity:1;pointer-events:auto;}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);
  border-top-left-radius:16px;border-top-right-radius:16px;
  box-shadow:0 -4px 24px rgba(0,0,0,0.18);
  transform:translateY(100%);transition:transform .24s cubic-bezier(.32,.72,0,1);
  max-height:82vh;display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom);}
.sheet.open{transform:translateY(0);}
.sheet-grip{width:36px;height:4px;border-radius:2px;background:var(--border);
  margin:8px auto 0;flex:none;}
.sheet-head{display:flex;align-items:center;gap:10px;padding:10px 16px 8px;flex:none;}
.sheet-head h3{margin:0;flex:1;font-size:16px;}
.sheet-head .sub{font-size:12px;color:var(--muted);font-weight:400;}
.sheet-x{min-width:44px;min-height:44px;border:1px solid var(--border);
  background:var(--bg);border-radius:8px;cursor:pointer;font-size:16px;color:var(--text);}
.sheet-x:focus-visible{outline:2px solid var(--gold-text);outline-offset:2px;}
.sheet-body{overflow-y:auto;padding:0 16px 16px;-webkit-overflow-scrolling:touch;}
.sh-grp{border-top:1px solid var(--border);padding:12px 0 4px;}
.sh-grp:first-child{border-top:none;}
.sh-grp>h4{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:600;}
.sh-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap;}
.sh-row label{flex:0 0 96px;font-size:13px;}
/* 16px ולא פחות: קלט קטן מזה גורם ל-iOS לזום פנימה בכל נגיעה */
.sh-row input[type=number],.sh-row input[type=text],.sh-row select{
  flex:1;min-width:88px;min-height:44px;font-size:16px;padding:6px 10px;
  border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);}
.sh-row input:focus-visible,.sh-row select:focus-visible{outline:2px solid var(--gold-text);outline-offset:1px;}
.sh-seg{display:flex;gap:6px;flex:1;}
.sh-seg button{flex:1;min-height:44px;font-size:13px;border-radius:8px;cursor:pointer;
  border:1px solid var(--border);background:var(--bg);color:var(--text);}
.sh-seg button.on{background:var(--gold);color:var(--on-gold);border-color:var(--gold);}
.sh-seg button:focus-visible{outline:2px solid var(--gold-text);outline-offset:2px;}
.sh-tog{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer;font-size:14px;}
.sh-tog input{width:22px;height:22px;accent-color:var(--gold);}
.sh-note{font-size:12px;color:var(--muted);margin:2px 0 8px;}
.sh-unit{font-size:12px;color:var(--muted);font-weight:400;}
.sh-gear{font-size:13px;}
@media (min-width:601px){
  .sheet{left:auto;right:0;top:0;bottom:0;width:380px;max-height:none;
    border-radius:0;transform:translateX(100%);border-left:1px solid var(--border);}
  .sheet.open{transform:translateX(0);}
  .sheet-grip{display:none;}
}
@media (prefers-reduced-motion:reduce){
  .sheet,.sheet-back{transition:none;}
}
.strip-item.strip-end{background:var(--surface);border-style:dashed;}
.strip-item.strip-end .sn{color:var(--muted);font-size:12px;}
.shape-err{
  margin:8px 10px;padding:10px 12px;border-radius:6px;
  background:#fdecea;border:1px solid #f5c6c2;color:#8f2d24;
  font-family:'Heebo',sans-serif;font-size:13px;line-height:1.5;
}
.shape-bom{
  margin:8px 10px;padding:10px 12px;border:1px solid var(--border);
  background:var(--bg);font-family:'Heebo',sans-serif;font-size:13px;
}
.shape-bom b{color:var(--gold-text);}
@media (prefers-reduced-motion:reduce){
  .shape-chip,.strip-item{transition:none;}
}
/* היה כאן touch-action:none, שאומר לדפדפן "אני מטפל בכל מגע כאן". אבל
   על הקנבס יש רק מאזין click ואף מטפל מחוות — כלומר הגלילה נחסמה בתמורה
   לכלום. בפלאפון הקנבס תופס כמעט את כל המסך, ולכן לא נשארה שום רצועה
   לגלול ממנה והדף נתקע.
   pan-y מחזיר את הגלילה האנכית ומשאיר את הלחיצה על קווי המידה עובדת. */
/* ‏pan-x נוסף משהוגדל הקנבס מעבר למסך: בלעדיו אי אפשר לגלול אל החלק
   שיצא, ומחצית השרטוט הופכת לבלתי נגישה באצבע. */
#sk{touch-action:pan-x pan-y;}
/* מקלחון של ארבעה פאנלים יוצא רחב מפלאפון — כל פאנל צריך מקום למידות
   שלו, אחרת המספרים מתרחקים מהזכוכית או נחתכים. הקנבס גדל, והמכל גולל
   אליו. ‏overflow:hidden חתך את החלק שיצא, ואיתו כל מה שאפשר היה ללחוץ
   עליו שם. */
.canvas-wrap{background:var(--surface);margin:10px;border:1px solid var(--border);box-shadow:0 2px 12px rgba(0,0,0,0.06);position:relative;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;}
/* הקנבס נושא רוחב מפורש מ-setupCanvas ולא נמתח למכל: כשהוא רחב ממנו,
   מותר לו לגלוש והמכל גולל. ‏width:100% היה מכווץ אותו בחזרה ומועך את
   קנה המידה. */
canvas{display:block;height:auto;cursor:pointer;}
.dim-tip{position:absolute;background:var(--gold);color:var(--on-gold);padding:2px 7px;font-size:12px;font-weight:700;border-radius:3px;pointer-events:none;display:none;z-index:5;}

/* ── מצב עריכה ────────────────────────────────────────────────────
   הצייר מגיב למגע רק כאן. בלי זה, גרירה כדי לגלול נוחתת כלחיצה
   ופותחת משהו — ובפלאפון הקנבס תופס כמעט את כל המסך. */
#btnEditMode{
  min-height:44px;width:calc(100% - 20px);margin:0 10px 10px;
  padding:10px 14px;border:1px solid var(--gold);border-radius:6px;
  background:var(--surface);color:var(--gold-text);
  font-family:'Heebo',sans-serif;font-size:14px;font-weight:700;cursor:pointer;
  transition:background 180ms ease,color 180ms ease;
}
#btnEditMode.on{background:var(--gold);color:var(--on-gold);}
#btnEditMode:focus-visible{outline:2px solid var(--gold-text);outline-offset:2px;}
.edit-hint{
  margin:0 10px 10px;padding:9px 12px;border-radius:6px;
  background:rgba(184,146,42,0.10);border:1px solid rgba(184,146,42,0.35);
  color:var(--text);font-family:'Heebo',sans-serif;font-size:13px;line-height:1.5;
}
/* הקנבס לעולם לא תופס את המחווה, גם במצב עריכה. הדפדפן כבר מבחין בין
   גרירה לנגיעה — click לא נורה על גרירה — ולכן אפשר גם לגלול מעל הציור
   וגם ללחוץ על מידה, באותו מצב. touch-action:none כאן חסם את הגלילה
   בדיוק כשהיא הכי נחוצה: כשמחפשים את המידה שרוצים לשנות. */
.canvas-wrap.editing{outline:2px solid var(--gold);outline-offset:-2px;}

#dimEditor{
  position:absolute;z-index:30;display:none;
  background:var(--surface);border:1px solid var(--gold);border-radius:8px;
  box-shadow:0 8px 28px rgba(0,0,0,0.22);padding:10px;
  flex-direction:column;gap:8px;min-width:172px;
}
#dimEditor.open{display:flex;}
#dimEditorLabel{font-family:'Heebo',sans-serif;font-size:12px;color:var(--muted);}
#dimEditorInput{
  min-height:44px;width:100%;box-sizing:border-box;
  padding:8px 10px;border:1px solid var(--border);border-radius:6px;
  background:var(--bg);color:var(--text);
  /* 16px ולא פחות — אייפון מזים את הדף כשמתמקדים בשדה קטן מזה */
  font-family:'Heebo',sans-serif;font-size:16px;font-weight:700;text-align:center;
}
#dimEditorInput:focus{border-color:var(--gold);outline:none;}
.dim-ed-row{display:flex;gap:8px;}
.dim-ed-row button{
  flex:1;min-height:44px;border-radius:6px;cursor:pointer;
  font-family:'Heebo',sans-serif;font-size:14px;font-weight:700;
}
.dim-ed-ok{background:var(--gold);color:var(--on-gold);border:1px solid var(--gold);}
.dim-ed-x{background:var(--bg);color:var(--text);border:1px solid var(--border);}
.dim-ed-row button:focus-visible{outline:2px solid var(--gold-text);outline-offset:2px;}
@media (prefers-reduced-motion:reduce){ #btnEditMode{transition:none;} }
.controls{margin:0 10px 10px;display:flex;flex-direction:column;gap:2px;}
.cs{background:var(--surface);border:1px solid var(--border);overflow:hidden;}
.ch{padding:11px 14px;font-size:12px;font-weight:600;letter-spacing:0.2em;color:var(--gold-text);text-transform:uppercase;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;background:var(--bg);}
.ch .arr{font-size:12px;transition:transform 0.2s;color:var(--muted);}
.ch.open .arr{transform:rotate(180deg);}
.cb{padding:12px 14px;display:none;flex-direction:column;gap:8px;border-top:1px solid var(--border);}
.cb.open{display:flex;}
.row{display:flex;align-items:center;gap:8px;}
.row label{font-size:13px;color:var(--muted);flex:1;}
.row input[type=number],.row input[type=text],.row select{width:80px;padding:8px 9px;background:var(--bg);border:1px solid var(--border);font-family:'Heebo',sans-serif;font-size:14px;color:var(--text);outline:none;text-align:center;-webkit-appearance:none;border-radius:0;}
.dim-prev{font-size:12px;color:var(--gold-text);min-width:44px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.row input:focus,.row select:focus{border-color:var(--gold-text);}
.row input.hi{border-color:var(--gold-text);background:rgba(184,146,42,0.07);}
.unit{font-size:12px;color:var(--muted);width:20px;}
.tog{display:flex;gap:4px;}
.tb{flex:1;padding:8px 4px;background:var(--bg);border:1px solid transparent;font-family:'Heebo',sans-serif;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;text-align:center;transition:all 0.15s;}
.tb.active{background:var(--bg2);border-color:var(--gold-text);color:var(--text);}
.sw-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;}
.sw{cursor:pointer;background:none;border:2px solid transparent;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:3px;}
.sw.active{border-color:var(--gold-text);}
.sw-dot{width:30px;height:30px;border-radius:50%;border:1px solid rgba(0,0,0,0.1);}
.sw-name{font-size:12px;color:var(--muted);text-align:center;line-height:1.3;}
.sw-price{font-size:12px;color:var(--gold-text);font-weight:700;}
.sw.active .sw-name{color:var(--text);font-weight:600;}
.sub{margin-top:4px;padding:10px;background:var(--bg2);border:1px solid var(--border);display:flex;flex-direction:column;gap:7px;}
.sub-t{font-size:12px;font-weight:700;color:var(--gold-text);letter-spacing:0.15em;text-transform:uppercase;}
.sn-wrap{margin:0 10px 8px;}
.sn-input{width:100%;padding:9px 12px;background:var(--surface);border:1px solid var(--border);font-family:'Heebo',sans-serif;font-size:14px;color:var(--text);outline:none;}
.sn-input:focus{border-color:var(--gold-text);}
.combo-wrap{padding:10px;background:var(--surface);border-bottom:1px solid var(--border);}
.cat-tabs{display:flex;gap:2px;margin-bottom:8px;}
.cat-tab{flex:1;padding:7px 4px;background:var(--bg);border:1px solid transparent;font-family:'Heebo',sans-serif;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;text-align:center;}
.cat-tab.active{background:var(--bg2);border-color:var(--gold-text);color:var(--text);}
.combo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;}
.combo-btn{padding:9px 6px;background:var(--bg);border:1px solid transparent;font-family:'Heebo',sans-serif;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;text-align:center;line-height:1.5;}
.combo-btn.active{background:var(--bg2);border-color:var(--gold-text);color:var(--text);font-weight:700;}
/* ITEM MODE */
.item-list{margin:0 10px;display:flex;flex-direction:column;gap:4px;}
.ic{background:var(--surface);border:1px solid var(--border);overflow:hidden;}
.ic-hdr{padding:10px 13px;display:flex;align-items:center;gap:8px;cursor:pointer;}
.ic-num{width:22px;height:22px;background:var(--gold);color:var(--on-gold);border-radius:50%;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ic-title{font-size:13px;font-weight:700;flex:1;}
.ic-sub{font-size:12px;color:var(--muted);}
.ic-del{padding:3px 8px;background:rgba(192,57,43,0.1);border:1px solid rgba(192,57,43,0.2);color:#c0392b;font-family:'Heebo',sans-serif;font-size:12px;cursor:pointer;border-radius:2px;}
.ic-body{padding:12px 13px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px;}
.add-grid{margin:8px 10px;display:grid;grid-template-columns:repeat(2,1fr);gap:4px;}
.add-btn{padding:11px 7px;background:var(--surface);border:1px solid var(--border);font-family:'Heebo',sans-serif;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;}
.add-btn:hover{background:var(--bg2);border-color:var(--gold-text);color:var(--text);}
.add-btn .ai{font-size:18px;}
.finish-btn{margin:6px 10px;padding:13px;background:var(--text);color:#f7f4ef;font-family:'Heebo',sans-serif;font-size:14px;font-weight:700;border:none;cursor:pointer;width:calc(100% - 20px);}
.finish-btn:hover{background:var(--gold);}
.specs{background:var(--surface);border:1px solid var(--border);margin:0 10px;padding:12px 14px;font-size:13px;line-height:1.85;color:var(--muted);border-right:3px solid var(--gold);}
.specs strong{color:var(--text);font-weight:700;font-size:13px;display:block;margin-bottom:4px;}
.btns{margin:10px;display:flex;gap:7px;}
.btn-add{flex:2;padding:14px;background:var(--gold);color:var(--on-gold);font-family:'Heebo',sans-serif;font-size:14px;font-weight:700;border:none;cursor:pointer;}
.btn-dl{flex:1;padding:14px;background:var(--text);color:var(--bg);font-family:'Heebo',sans-serif;font-size:13px;font-weight:600;border:none;cursor:pointer;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:#f7f4ef;padding:11px 20px;font-size:13px;font-weight:600;border-right:3px solid var(--gold);opacity:0;transition:all 0.3s;z-index:99;white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
.spacer{height:28px;}

/* ═══ רספונסיביות — נקודות העצירה של lg-ui.css: 600 / 900 / 1200 ═══ */
@media (min-width:901px){
  /* אייפד לרוחב ומעלה — הקנבס והפאנל זה לצד זה במקום זה מתחת לזה */
  .canvas-wrap{margin:14px;}
  /* שש הצורות נכנסות בשורה אחת, ואין צורך לגלול בשביל אף אחת מהן */
  .shape-gallery{grid-template-columns:repeat(6,1fr);}

  .shape-gallery{grid-template-columns:repeat(3,1fr);}
}
@media (max-width:600px){

     שתיים נותנות 175px — מטרה נוחה לאגודל, והטקסט לא נשבר. */
  .shape-gallery{grid-template-columns:repeat(2,1fr);gap:8px;}
  .shape-chip{font-size:14px;}

// כל מידה חישבה קודם את המרחק שלה בעצמה — 26 כאן, 28 שם, 32 במקום
// אחר — ושתי מידות באותו מקום היו באג שממתין שמישהו ישים לב. קווי
// הגובה של פאנלים צמודים נחתו זה על זה, ואי אפשר היה לדעת איזו מידה
// שייכת לאיזה שייף; את הגובה של הדלת פשוט לא ראו.
//
// שרטוט טכני פותר את זה מזה מאה שנה (ISO 129): לכל מידה נתיב במרחק
// קבוע, הקטנה קרובה לאובייקט והגדולה רחוקה — כדי שקו של מידה גדולה
// לא יחצה קו של קטנה.
//
// ההתנגשות לא נמנעת בזהירות של מי שכותב את הקוד. היא בלתי אפשרית:
// מידה מבקשת נתיב ומקבלת מרחק פנוי, ואין דרך לבקש מרחק תפוס.
// המרחקים תלויים ברוחב הקנבס. הם היו קבועים — 24 ו-32 — ומהם נגזרו
// שוליים של 128 לכל צד. על מסך של 375 פיקסלים אלה 256, שני שליש מהמסך,
// והזכוכית התכווצה לפירורים.
let LANE_FIRST=24, LANE_STEP=32;

let _dimLanes={};





// ברירות המחדל של הידית, בסנטימטרים — כפי ששדות הקלט שלה מסומנים.
// 6 ס"מ מהצד, ובאמצע גובה הזכוכית.
const HANDLE_EDGE_CM=6;
const TOWEL_SPACING_CM=55;

const C=document.getElementById('sk'),cx=C.getContext('2d');
let selG='shafu',selF='shahor',selQ='zamak',sand=false;
let appMode='combo',curCat='pinati',curCombo=COMBOS.pinati[0];
let panelState={}, items=[], dimHits=[];

function mkPS(panel){
  return {
    // דלת נמוכה מהקבוע בסנטימטר וחצי, והפער בתחתית: היא תלויה מהמשקוף
    // ומרווח הרצפה נשאר מתחתיה. בלי זה כל הפאנלים יוצאים 2000, ואז אין
    // 1985 על השרטוט ואין 215 על הציר התחתון של הקבוע — כל המקלחון
    // נראה כאילו הוא בגובה אחד.
    w:panel.type==='door'?800:panel.type==='slider'?800:500,
    h:panel.type==='door'?DOOR_H_MM:2000,
    // hinge
    extraHinge:false,hinge3pos:40,
    // brackets
    extraBracket:false,bracket3pos:40,bracketType:'normal',floorBracket:false,
    // handle
    handleType:'knob',handleEdge:HANDLE_EDGE_CM,towelSpacing:TOWEL_SPACING_CM,
    // slope
    hasSlope:false,
    slopeAxis:'height',   // 'height' or 'width'
    slopeSide:'right',    // which side is SHORTER (right/left for height, top/bottom for width)
    slopeH1:2000,         // main height (left side for height-slope, or top for width-slope)
    slopeH2:1800,         // other side
    // holes
    holes:[],
    // recess
    hasRecess:false,recessW:12,recessH:9,recessFromTop:0,recessFromSide:0,
  };
}
function initPS(){panelState={};curCombo.panels.forEach((p,i)=>panelState[i]=mkPS(p));}

// ══════════════ HELPERS ══════════════
function tog(h){h.classList.toggle('open');h.nextElementSibling.classList.toggle('open');}
function v(id){const e=document.getElementById(id);return e?parseFloat(e.value)||0:0;}
function setQ(q){selQ=q;document.getElementById('bZ').classList.toggle('active',q==='zamak');document.getElementById('bP').classList.toggle('active',q==='pliz');draw();}
function toggleSand(){sand=!sand;document.getElementById('bSand').classList.toggle('active',sand);}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}

// במצב שייפים המצב יושב לפי מזהה השייף ולא לפי מיקום, כדי שהזזה או
// מחיקה של שייף באמצע לא תזיז את המידות של השכנים.
// ‏getPStates נופל ל-mkPS כששייף עדיין בלי מצב, ולכן הציור עבד; ‏getPS
// לא נפל, ולכן **העריכה** לא עבדה — לחיצה על מספר החזירה undefined
// והחלון פשוט לא נפתח, בלי שום סימן. אותו מקור, אותה נפילה.
function getPS(pfx,i){
  if(appMode==='shape'){
    const s=shapeList[i]; if(!s) return null;
    if(!shapePS[s.id]) shapePS[s.id]=mkPS({type:s.kind});
    return shapePS[s.id];
  }
  return pfx==='combo'?panelState[i]:items[i];
}

function setPSv(pfx,i,k,el){
  const ps=getPS(pfx,i);if(!ps)return;
  if(k==='w'||k==='h'||k==='slopeH1'||k==='slopeH2'){
    const r=lgParseDimensionInput(el.value);
    const span=el.nextElementSibling;
    if(span&&span.classList&&span.classList.contains('dim-prev')){
      span.textContent=r.ok?el.value.trim()+' → '+r.mm+' מ"מ':r.error;
      span.style.color=r.ok?'var(--gold)':'#c0392b';
    }
    if(!r.ok)return;
    ps[k]=r.mm;
  }else{
    ps[k]=parseFloat(el.value)||0;
  }
  draw();
}
function setPSb(pfx,i,k,val){const ps=getPS(pfx,i);if(!ps)return;ps[k]=val;if(pfx==='combo')renderPanelCtrl();else renderItemList();draw();}
function setPSs(pfx,i,k,val){const ps=getPS(pfx,i);if(!ps)return;ps[k]=typeof val==='string'?val:val.value;if(pfx==='combo')renderPanelCtrl();else renderItemList();draw();}
function addHole(pfx,i){const ps=getPS(pfx,i);if(!ps)return;if(!ps.holes)ps.holes=[];ps.holes.push({diam:12,fromTop:100,fromRight:10});if(pfx==='combo')renderPanelCtrl();else renderItemList();draw();}
function rmHole(pfx,i,hi){const ps=getPS(pfx,i);if(!ps)return;ps.holes.splice(hi,1);if(pfx==='combo')renderPanelCtrl();else renderItemList();draw();}
function setHole(pfx,i,hi,k,el){const ps=getPS(pfx,i);if(ps&&ps.holes[hi])ps.holes[hi][k]=parseFloat(el.value)||0;draw();}

// ══════════════ בונה השייפים ══════════════
//
// הרכבה לינארית: הקבלן מניח צורה אחרי צורה, והמנוע גוזר מה יושב בכל
// צומת. אין כאן שדה פרזול — הוא נגזר, ולכן אי אפשר לסתור את הציור.
let shapeList=[];

// מה יושב בכל קצה של המקלחון. קיר או כלום.
//
// היה כאן קיר משני הצדדים, ולכן קבוע בודד קיבל ארבע זוויות — שתיים לכל
// צד. אבל קבוע בודד יושב על קיר אחד, ומהפאה השנייה אין כלום: שתי זוויות.
// זה תלוי בשטח ולא בסוג הצורה, ולכן זו בחירה של המפעיל ולא ניחוש.
//
// קבוע שדלת נתלית עליו הוא מקרה אחר לגמרי — שם הצומת הוא זכוכית-זכוכית,
// המנוע מחזיר hinge-gg, והצירים מצוירים על הקבוע. ר' _lgSidesOf.
let shapeBoundary={right:'wall',left:'open'};

function shapeSetEnd(side,val){
  shapeBoundary[side] = val;
  renderShapeUI();draw();
}

function _shapeShower(){
  return {boundary:shapeBoundary,finish:'shahor',
          quality:selQ==='pliz'?'pliz':'zamak',
          shapes:shapeList.map(s=>({id:s.id,kind:s.kind,hingeSide:s.hingeSide}))};
}

// המצב שהצייר צורך — אותו מבנה בדיוק שהקומבינציות מייצרות, כדי שלא יהיה
// נתיב ציור שני.
//
// wallSide נכתב על הפאנלים החיצוניים כי הגשר _lgShowerOf גוזר ממנו את
// הגבולות. בלעדיו קבוע במצב שייפים לא היה מקבל אף זווית קיר.
function _shapePanels(){
  const n=shapeList.length;
  return shapeList.map((s,i)=>{
    // ⚠️ שתי מוסכמות הפוכות, וזה היה הבאג:
    //
    //   המנוע:  'right' = לכיוון השייף הקודם במערך  → שמאל על הקנבס
    //   הצייר:  hingeSide==='left' ? x : x+pw       → 'left' = שמאל על הקנבס
    //
    // כלומר 'right' של המנוע הוא 'left' של הצייר. בלי ההיפוך, דלת שנתלית
    // על הקבוע צוירה עם הצירים על הקיר שמנגד — ובמקביל המנוע צייר סימוני
    // ציר בפאה המשותפת. שניהם יחד, וזה בלתי אפשרי פיזית.
    //
    // אומת מול הקומבינציות הקיימות: p_kd כותב hingeSide:'left' יחד עם
    // hingeOnFixed:'prev', כלומר אצל הצייר 'left' פונה לפאנל הקודם.
    const canvasHinge = s.hingeSide==='right' ? 'left'
                      : s.hingeSide==='left'  ? 'right' : undefined;
    const p={
      type: s.kind==='door'?'door':s.kind==='mirror'?'mirror':s.kind==='shape'?'shape':'fixed',
      label: s.label,
      hingeSide: canvasHinge,
      handleSide: canvasHinge==='right'?'left':'right',
      // prev/next נמדד על המערך, ולכן הוא נגזר מהמוסכמה של המנוע ולא מהקנבס
      hingeOnFixed: s.kind==='door' ? (s.hingeSide==='right'?'prev':'next') : undefined,
    };
    const rW=shapeBoundary.right==='wall', lW=shapeBoundary.left==='wall';
    if(n===1)            p.wallSide = rW&&lW?'both':rW?'right':lW?'left':'none';
    else if(i===0)       p.wallSide = rW?'right':'none';
    else if(i===n-1)     p.wallSide = lW?'left':'none';
    else                 p.wallSide = 'none';
    return p;
  });
}

// lgEsc מוגדר ב-firebase-db.js, שהדף הזה לא טוען. שם צורה נכתב על ידי
// המשתמש ולכן חייב בריחה — בלי זה, שם עם < היה נכנס כ-HTML.
function _shEsc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,c=>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

let _shapeSeq=0;

// כיוון הבנייה. במקלחון אמיתי מתחילים מקיר וממשיכים לכיוון אחד — לא
// מהאמצע. כשהכיוון מוצהר, הזכוכית הבאה יודעת לאן להיכנס, והבונה רואה
// את זה לפני שהוא לוחץ ולא אחרי.
//
// ‏'rtl' הוא הסדר הטבעי בעברית: הזכוכית הראשונה בימין, והבאות נוספות
// שמאלה — כלומר בסוף המערך, שהוא שמאל על הקנבס.
let buildDir = (function(){
  try { return localStorage.getItem('lgBuildDir')==='ltr' ? 'ltr' : 'rtl'; }
  catch(e){ return 'rtl'; }
})();

function setBuildDir(d){
  buildDir = d==='ltr' ? 'ltr' : 'rtl';
  try { localStorage.setItem('lgBuildDir',buildDir); } catch(e){}
  renderBuildDir();
  renderShapeUI();
}

function renderBuildDir(){
  const rtl=document.getElementById('bdRtl'), ltr=document.getElementById('bdLtr');
  if(rtl) rtl.className = buildDir==='rtl' ? 'on' : '';
  if(ltr) ltr.className = buildDir==='ltr' ? 'on' : '';
}

function shapeAdd(kind,hingeSide,slope){
  _shapeSeq++;
  const id='sh'+_shapeSeq;
  const label = kind==='door' ? 'דלת' : kind==='mirror' ? 'מראה'
              : kind==='shape' ? 'צורה' : (slope?'קבוע משופע':'קבוע');
  // אינדקס גדל => x גדל: סוף המערך הוא **ימין** על הקנבס. לכן בנייה
  // מימין לשמאל מוסיפה בתחילת המערך, ומשמאל לימין בסופו.
  const item={id,kind,hingeSide:hingeSide||undefined,label};
  if(buildDir==='rtl') shapeList.unshift(item); else shapeList.push(item);
  shapePS[id]=mkPS({type:kind});
  if(slope) shapePS[id].hasSlope=true;
  renderShapeUI();draw();
}
function shapeRemove(id){
  shapeList=shapeList.filter(s=>s.id!==id);
  delete shapePS[id];
  renderShapeUI();draw();
}
function shapeMove(id,dir){
  const i=shapeList.findIndex(s=>s.id===id);
  const j=i+dir;
  if(i<0||j<0||j>=shapeList.length) return;
  const t=shapeList[i];shapeList[i]=shapeList[j];shapeList[j]=t;
  renderShapeUI();draw();
}
// צד הציר תלוי בשטח — אותה דלת נבנית ימין או שמאל. הליקוט לא משתנה.
function shapeFlipHinge(id){
  const s=shapeList.find(x=>x.id===id);
  if(!s||s.kind!=='door') return;
  s.hingeSide = s.hingeSide==='right'?'left':'right';
  renderShapeUI();draw();
}
let shapePS={};

// שם הסוג במקום אחד. שלוש רשימות נפרדות בצייר, ברצועה ובגיליון היו
// מתפצלות — וצורה חופשית באמת הוצגה כ"קבוע" בשניים מהם.
const KIND_HE={door:'דלת',mirror:'מראה',shape:'צורה חופשית',fixed:'קבוע'};
function kindName(k){ return KIND_HE[k]||KIND_HE.fixed; }
// זכוכית שאינה חלק מהרכבת המקלחון: אין לה פרזול ואיש אינו נתלה עליה.
function isFreeGlass(k){ return k==='shape'||k==='mirror'||k==='panel'; }

// ════════════════════════════════════════════════════════════════════════
//  גיליון המאפיינים
// ════════════════════════════════════════════════════════════════════════
//
// המנוע ידע לצייר פינוי מדרגה, שיפוע בשני צירים, עובי וסוג זכוכית —
// ולאף אחד מהם לא הייתה דרך להיכנס. הגיליון הוא הדרך.
//
// הוא כותב ישירות ל-ps ומצייר מחדש. אין כאן שכבת מצב שנייה: מה שהמנוע
// קורא הוא מה שהגיליון כותב, ולכן אין מה שיתפצל.
let sheetId=null;

function openShapeSheet(id){
  const i=shapeList.findIndex(s=>s.id===id);
  if(i<0) return;
  sheetId=id;
  renderShapeSheet();
  document.getElementById('shapeSheetBack').classList.add('open');
  document.getElementById('shapeSheet').classList.add('open');
}
function closeShapeSheet(){
  sheetId=null;
  document.getElementById('shapeSheetBack').classList.remove('open');
  document.getElementById('shapeSheet').classList.remove('open');
}

// שינוי שדה בודד. ריק מוחק את השדה במקום לכתוב אפס — כך חוזרים
// לברירת המחדל של המנוע במקום לקבע ערך ששווה לה במקרה.
function sheetSet(field,val,redraw){
  const i=shapeList.findIndex(s=>s.id===sheetId);
  if(i<0) return;
  const ps=getPS('shape',i); if(!ps) return;
  if(val===''||val==null) delete ps[field];
  else ps[field]=val;
  if(redraw!==false){ renderShapeSheet(); renderShapeUI(); draw(); }
}
function sheetNum(field,el){
  const v=String(el.value).trim();
  if(v===''){ sheetSet(field,null); return; }
  const r=_dimParse(v);
  if(!r.ok){ el.style.borderColor='#c0392b'; return; }
  el.style.borderColor='';
  sheetSet(field,r.mm);
}
function sheetToggle(field,on,defaults){
  const i=shapeList.findIndex(s=>s.id===sheetId);
  if(i<0) return;
  const ps=getPS('shape',i); if(!ps) return;
  if(on) Object.keys(defaults).forEach(k=>{ if(ps[k]==null) ps[k]=defaults[k]; });
  else   Object.keys(defaults).forEach(k=>delete ps[k]);
  renderShapeSheet(); renderShapeUI(); draw();
}

function _shSeg(field,opts,cur){
  return '<span class="sh-seg">'+opts.map(o=>
    '<button type="button" class="'+(cur===o[0]?'on':'')+'" '+
    'onclick="sheetSet(\''+field+'\',\''+o[0]+'\')">'+_shEsc(o[1])+'</button>').join('')+'</span>';
}
// אותה יחידה כמו חלון המידה, ומצוינת בתווית. מספר בלי יחידה לידו הוא
// הזמנה לטעות של פי עשרה, וזו טעות שבית מלאכה לזכוכית משלם עליה.
function _shNum(field,label,val,ph){
  const shown = val==null ? '' : _dimToUnit(val);
  const hint  = (ph==null||ph==='') ? '' : String(_dimToUnit(Number(ph)||0));
  return '<div class="sh-row"><label for="sh_'+field+'">'+_shEsc(label)+
      ' <span class="sh-unit">'+_dimUnitLabel()+'</span></label>'+
    '<input id="sh_'+field+'" type="text" inputmode="decimal" value="'+shown+'" '+
    'placeholder="'+hint+'" onchange="sheetNum(\''+field+'\',this)"></div>';
}

function renderShapeSheet(){
  const body=document.getElementById('shapeSheetBody');
  const i=shapeList.findIndex(s=>s.id===sheetId);
  if(!body||i<0) return;
  const s=shapeList[i], ps=getPS('shape',i)||{};
  document.getElementById('shapeSheetTitle').innerHTML=
    _shEsc(s.label)+' <span class="sub">'+kindName(s.kind)+'</span>';

  const hasSlopeH = !!ps.hasSlope  && ps.slopeH1>0 && ps.slopeH2>0;
  const hasSlopeW = !!ps.hasSlopeW && ps.slopeW1>0 && ps.slopeW2>0;
  const hasNotch  = ps.notchW>0  && ps.notchH>0;
  const H=ps.h||2000, W=ps.w||(s.kind==='door'?800:500);

  body.innerHTML =
  '<div class="sh-grp"><h4>מידות</h4>'+
    _shNum('w','רוחב',ps.w,String(W))+
    _shNum('h','גובה',ps.h,String(H))+
  '</div>'+

  '<div class="sh-grp"><h4>שיפוע</h4>'+
    '<label class="sh-tog"><input type="checkbox" '+(hasSlopeH?'checked':'')+
      ' onchange="sheetToggle(\'slopeH\',this.checked,{hasSlope:true,slopeH1:'+H+',slopeH2:'+(H-50)+'})">'+
      'שיפוע בגובה — שתי פאות בגבהים שונים</label>'+
    (hasSlopeH ?
      _shNum('slopeH1','גובה שמאל',ps.slopeH1)+
      _shNum('slopeH2','גובה ימין',ps.slopeH2)+
      '<div class="sh-row"><label>הצד שנחתך</label>'+
        _shSeg('slopeSideH',[['bottom','רצפה'],['top','תקרה']],ps.slopeSideH||'bottom')+'</div>'+
      '<p class="sh-note">מקלחון נחתך ברצפה — האגן מנוקז.</p>' : '')+

    '<label class="sh-tog"><input type="checkbox" '+(hasSlopeW?'checked':'')+
      ' onchange="sheetToggle(\'slopeW\',this.checked,{hasSlopeW:true,slopeW1:'+W+',slopeW2:'+(W-45)+'})">'+
      'שיפוע ברוחב — קיר לא ישר</label>'+
    (hasSlopeW ?
      _shNum('slopeW1','רוחב עליון',ps.slopeW1)+

      _shNum('notchH','גובה המדרגה',ps.notchH)+

      '<div class="sh-row"><label>צד המדרגה</label>'+
        _shSeg('notchSide',[['left','שמאל'],['right','ימין']],ps.notchSide||'left')+'</div>'+
      '<div class="sh-row"><label>הזווית התחתונה</label>'+

               ps.notchBracket||'floor')+'</div>'+

      'גובה פנימי שונה מהחיצוני אומר שהמדף משופע.</p>' : '')+

  '<div class="sh-grp"><h4>זכוכית</h4>'+

      '</select></div>'+

  (isFreeGlass(s.kind)
    // זכוכית חופשית אינה חלק מהרכבת המקלחון: אין לה זוויות ואיש אינו
    // נתלה עליה. פינוי וחורים יקבלו מנוע משלהם.
    ? '<div class="sh-grp"><h4>פרזול</h4>'+

          ' onchange="sheetSet(\'floorBracket\',this.checked?true:null)">זווית רצפה</label>'+

        '<p class="sh-note">2.5 ס"מ כברירת מחדל, ואז המידה לא מופיעה בשרטוט.</p>'+

function renderShapeUI(){
  renderBuildDir();
  const strip=document.getElementById('shapeStrip');
  const errEl=document.getElementById('shapeErr');
  const bomEl=document.getElementById('shapeBom');
  if(!strip) return;

  const sh=_shapeShower();
  const errs=(typeof lgValidate==='function')?lgValidate(sh):[];
  const badIds={};errs.forEach(e=>{badIds[e.at]=e.msg;});

  // קצה = קיר או כלום. יושב בקצוות הרצועה, במקום שהוא מייצג על הציור.
  // הבנייה מתקדמת לצד אחד. הצד הזה מסומן ברצועה כדי שהבונה יראה לאן
  // הזכוכית הבאה נכנסת לפני שהוא לוחץ, ולא אחרי.
  const growSide = buildDir==='rtl' ? 'left' : 'right';
  const endBtn=(side)=>
    '<div class="strip-item strip-end">'+
      '<span class="sn">'+(side==='right'?'קצה ימין':'קצה שמאל')+
        (side===growSide?' <span class="bd-next">· הבאה כאן</span>':'')+'</span>'+
      '<span class="strip-row">'+
        '<button class="'+(shapeBoundary[side]==='wall'?'on':'')+'" '+
          'onclick="shapeSetEnd(\''+side+'\',\'wall\')">קיר</button>'+
        '<button class="'+(shapeBoundary[side]==='open'?'on':'')+'" '+
          'onclick="shapeSetEnd(\''+side+'\',\'open\')">פתוח</button>'+
      '</span>'+
    '</div>';

  strip.innerHTML = shapeList.length ? endBtn('right') + shapeList.map((s,i)=>
    '<div class="strip-item'+(badIds[s.id]?' bad':'')+'">'+
      '<span class="sn">'+_shEsc(s.label)+(s.kind==='door'?' ('+(s.hingeSide==='right'?'ימין':'שמאל')+')':'')+'</span>'+
      '<span class="strip-row">'+
        '<button onclick="shapeMove(\''+s.id+'\',-1)" aria-label="הזז ימינה">→</button>'+
        '<button onclick="shapeMove(\''+s.id+'\',1)" aria-label="הזז שמאלה">←</button>'+
        (s.kind==='door'?'<button onclick="shapeFlipHinge(\''+s.id+'\')" aria-label="החלף צד ציר">⇄</button>':'')+
        '<button class="sh-gear" onclick="openShapeSheet(\''+s.id+'\')" aria-label="מאפייני הזכוכית">⚙</button>'+
        '<button onclick="shapeRemove(\''+s.id+'\')" aria-label="הסר">✕</button>'+
      '</span>'+
    '</div>').join('') + endBtn('left')
    : '<div style="padding:8px;color:var(--muted);font-size:13px">בחר צורה מהגלריה כדי להתחיל</div>';

  if(errs.length){
    errEl.style.display='block';
    errEl.textContent=errs.map(e=>e.msg).join(' · ');
  } else errEl.style.display='none';

  // הליקוט מוצג מהמנוע ולא נספר מחדש — שתי ספירות מתפצלות.
  const bom=(typeof lgBOM==='function')?lgBOM(sh):[];
  if(bom.length){
    const NAME={'bracket-wall':'זווית קיר','bracket-gg':'זווית זכוכית-זכוכית',
                'bracket-floor':'מחזיק רצפה','hinge-gg':'ציר זכוכית-זכוכית',
                'hinge-wall':'ציר קיר-זכוכית','handle':'ידית'};
    bomEl.style.display='block';
    bomEl.innerHTML='<b>ליקוט</b> — '+bom.map(b=>(NAME[b.type]||b.type)+' ×'+b.qty).join(' · ');
  } else bomEl.style.display='none';
}
function setCat(cat,btn){
  curCat=cat;
  document.querySelectorAll('.cat-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  curCombo=COMBOS[cat][0];
  renderCombos();initPS();renderPanelCtrl();draw();
}
function renderCombos(){
  document.getElementById('comboGrid').innerHTML=COMBOS[curCat].map(c=>`
    <button class="combo-btn ${c.id===curCombo.id?'active':''}" onclick="selCombo('${c.id}')">${c.label}</button>`).join('');
}
function selCombo(id){
  const all=Object.values(COMBOS).flat();
  curCombo=all.find(c=>c.id===id)||curCombo;
  renderCombos();initPS();renderPanelCtrl();draw();
}

function buildPanelHTML(panel,ps,i,pfx){

  let h=`
    <div class="row"><label>רוחב</label>
      <input type="text" id="${pfx}_w_${i}" value="${lgMmToInputStr(ps.w)}"
        oninput="setPSv('${pfx}',${i},'w',this);this.classList.add('hi')" onblur="this.classList.remove('hi')">
      <span class="unit dim-prev"></span></div>
    <div class="row"><label>גובה${ps.hasSlope&&ps.slopeAxis==='height'?' (שמאל)':''}</label>
      <input type="text" id="${pfx}_h_${i}" value="${lgMmToInputStr(ps.h)}"
        oninput="setPSv('${pfx}',${i},'h',this);this.classList.add('hi')" onblur="this.classList.remove('hi')">
      <span class="unit dim-prev"></span></div>`;

  if(isDoor){
    h+=`
    <div class="row"><label>צירים</label>
      <div class="tog" style="flex:1">
        <button class="tb ${!ps.extraHinge?'active':''}" onclick="setPSb('${pfx}',${i},'extraHinge',false)">2 סטנד׳</button>
        <button class="tb ${ps.extraHinge?'active':''}" onclick="setPSb('${pfx}',${i},'extraHinge',true)">3 צירים</button>
      </div></div>
    ${ps.extraHinge?`<div class="row"><label>ציר 3 מלמעלה</label>
      <input type="number" id="${pfx}_hg3_${i}" value="${ps.hinge3pos}" min="10" max="200" oninput="setPSv('${pfx}',${i},'hinge3pos',this)">
      <span class="unit">ס״מ</span></div>`:''}
    <div class="row"><label>ידית</label>
      <div class="tog" style="flex:1">
        <button class="tb ${ps.handleType==='knob'?'active':''}" onclick="setPSs('${pfx}',${i},'handleType','knob')">כפתור</button>
        <button class="tb ${ps.handleType==='towel'?'active':''}" onclick="setPSs('${pfx}',${i},'handleType','towel')">מגבת</button>
      </div></div>
    <div class="row"><label>מרחק מקצה</label>
      <input type="number" id="${pfx}_hEd_${i}" value="${ps.handleEdge}" min="3" max="30" oninput="setPSv('${pfx}',${i},'handleEdge',this)">
      <span class="unit">ס״מ</span></div>
    ${ps.handleType==='towel'?`<div class="row"><label>מרחק בין חורים</label>
      <input type="number" value="${ps.towelSpacing}" min="20" max="120" oninput="setPSv('${pfx}',${i},'towelSpacing',this)">
      <span class="unit">ס״מ</span></div>`:''}`;
  }
  if(isFixed){
    const ws=panel.wallSide||ps.wallSide||'both';
    const showBrackets=ws!=='none';
    if(showBrackets) h+=`
    <div class="row"><label>זוויות קיר</label>
      <div class="tog" style="flex:1">
        <button class="tb ${!ps.extraBracket?'active':''}" onclick="setPSb('${pfx}',${i},'extraBracket',false)">2 סטנד׳</button>
        <button class="tb ${ps.extraBracket?'active':''}" onclick="setPSb('${pfx}',${i},'extraBracket',true)">3 זוויות</button>
      </div></div>
    ${ps.extraBracket?`<div class="row"><label>זווית 3 מלמעלה</label>
      <input type="number" value="${ps.bracket3pos}" min="10" max="200" oninput="setPSv('${pfx}',${i},'bracket3pos',this)">
      <span class="unit">ס״מ</span></div>`:''}
    <div class="row"><label>סוג זווית</label>
      <select onchange="setPSs('${pfx}',${i},'bracketType',this)" style="width:130px">
        <option value="normal" ${ps.bracketType==='normal'?'selected':''}>רגילה</option>
        <option value="open" ${ps.bracketType==='open'?'selected':''}>פתוחה</option>
      </select><span class="unit"></span></div>
    ${ws==='both'?`<div class="row"><label>זווית רצפה</label>
      <div class="tog" style="flex:1">
        <button class="tb ${!ps.floorBracket?'active':''}" onclick="setPSb('${pfx}',${i},'floorBracket',false)">ללא</button>
        <button class="tb ${ps.floorBracket?'active':''}" onclick="setPSb('${pfx}',${i},'floorBracket',true)">+ רצפה</button>
      </div></div>`:''}`;
  }

  // SLOPE
  h+=`<div class="sub">${buildSlope(ps,i,pfx)}</div>`;
  // HOLES
  h+=`<div class="sub">${buildHoles(ps,i,pfx)}</div>`;
  // RECESS (mirrors only)
  if(isMirror||panel.type==='mirror') h+=`<div class="sub">${buildRecess(ps,i,pfx)}</div>`;

  return h;

function addItem(type){
  const fakePanel={type,label:({fixed:'קבוע',door:'דלת',shape:'צורה',mirror:'מראה'}[type])||type,wallSide:'both',hingeSide:'right',handleSide:'left'};
  const ps=mkPS(fakePanel);
  ps._panel=fakePanel;
  items.push(ps);
  renderItemList(); draw();
}
function removeItem(i){items.splice(i,1);renderItemList();draw();}
function renderItemList(){
  const el=document.getElementById('itemList'); el.innerHTML='';
  items.forEach((ps,i)=>{
    const panel=ps._panel||{type:ps.type||'fixed',label:'פריט',wallSide:'both',hingeSide:'right',handleSide:'left'};
    const typeIcon={'fixed':'⬡','door':'🚪','shape':'▭','mirror':'🪞'}[panel.type]||'●';
    const card=document.createElement('div'); card.className='ic';
    card.innerHTML=`
      <div class="ic-hdr">
        <div class="ic-num">${i+1}</div>
        <div style="flex:1"><div class="ic-title">${typeIcon} ${panel.label}</div>
          <div class="ic-sub">${ps.w}×${ps.h} ס״מ${ps.hasSlope?' | שיפוע':''}${(ps.holes||[]).length?' | '+(ps.holes||[]).length+' חורים':''}</div>

        <button class="ic-del" onclick="removeItem(${i})">הסר</button>
      </div>
      <div class="ic-body">${buildPanelHTML(panel,ps,i,'item')}</div>`;
    el.appendChild(card);
  });
}

// ══════════════ DRAW ENGINE ══════════════
function getPanels(){
  // מצב השייפים מזין את אותו נתיב ציור בדיוק כמו הקומבינציות — אותו מבנה
  // פאנלים, אותו drawComboMode. נתיב ציור שני היה מתפצל מהראשון.
  if(appMode==='shape') return _shapePanels();
  return appMode==='combo'?curCombo.panels:items.map(it=>it._panel||{type:'fixed',label:'פריט',wallSide:'both'});
}
function getPStates(){
  if(appMode==='shape') return Object.fromEntries(shapeList.map((s,i)=>[i,shapePS[s.id]||mkPS({type:s.kind})]));
  if(appMode==='combo') return panelState;
  return Object.fromEntries(items.map((it,i)=>[i,it]));
}

function draw(){
  const panels=getPanels(), pss=getPStates();
  if(!panels.length){drawEmpty();return;}

  const DPR=window.devicePixelRatio||1;
  const cW=C.parentElement.clientWidth;

  // In item mode, draw panels SEPARATELY (stacked vertically)
  if(appMode==='item'){
    drawItemMode(panels,pss,DPR,cW); return;
  }
  drawComboMode(panels,pss,DPR,cW);
}

// הגאומטריה עברה ל-lg-layout.js, וכאן נשארה רק ההפניה אליה. הצייר הישן
// חישב מיקומים תוך כדי ציור, ולכן אי אפשר היה לבדוק אותו בלי דפדפן —
// וכל באג ציור בפרויקט הזה עבר את כל הבדיקות.
function drawComboMode(panels,pss,DPR,cW){
  drawFromEngine(panels,pss,DPR,cW,'combo');
}


// במצב פריטים כל זכוכית עומדת בפני עצמה — היא לא מחוברת לשכנותיה ואין
// ביניהן צמתים. לכן כל אחת עוברת במנוע לחוד ומקבלת את המידות המלאות
// שלה, והן נערמות אנכית: לצייר אותן זו לצד זו על מסך פלאפון היה מקטין
// כל אחת לרבע ומעלים את המספרים.
function drawItemMode(panels,pss,DPR,cW){
  const GAP=18;
  const Ls=panels.map((p,i)=>lgLayout(_lgShowerOf([p],{0:(pss[i]||{})}),{canvasW:cW}));
  const maxW=Math.max.apply(null,Ls.map(L=>L.canvas.w));
  const totalH=Ls.reduce((n,L)=>n+L.canvas.h+GAP,0)+28;

  setupCanvas(DPR,maxW,totalH);
  drawGrid(maxW,totalH);
  dimHits=[];

  let dy=0;
  Ls.forEach((L,i)=>{ engPaint(L,'item',dy,()=>i); dy+=L.canvas.h+GAP; });

  drawTitleBar(maxW,totalH);
  updateSpecs();
}


function setupCanvas(DPR,cW,cH){
  C.width=cW*DPR; C.height=cH*DPR;
  C.style.width=cW+'px'; C.style.height=cH+'px';
  cx.setTransform(1,0,0,1,0,0);
  cx.scale(DPR,DPR);
  cx.clearRect(0,0,cW,cH);
  cx.fillStyle='#fff'; cx.fillRect(0,0,cW,cH);
}
function drawGrid(cW,cH){
  cx.strokeStyle='rgba(0,0,0,0.025)'; cx.lineWidth=1;
  const gs=30;
  for(let x=0;x<cW;x+=gs){cx.beginPath();cx.moveTo(x,0);cx.lineTo(x,cH);cx.stroke();}
  for(let y=0;y<cH;y+=gs){cx.beginPath();cx.moveTo(0,y);cx.lineTo(cW,y);cx.stroke();}
}
function drawEmpty(){
  const DPR=window.devicePixelRatio||1,cW=C.parentElement.clientWidth,cH=160;
  setupCanvas(DPR,cW,cH);
  cx.font='14px Heebo,sans-serif'; cx.fillStyle='#ccc'; cx.textAlign='center';
  cx.fillText('הוסף פריטים לסקיצה',cW/2,cH/2);
}


// ══════════════ הגשר אל מנוע החוקים ══════════════
//
// הפאנלים נושאים את אוצר המילים הישן — wallSide, glassGlass, hingeMarks,
// hingeOnFixed — ארבעה שדות שנכתבו ביד לכל קומבינציה ואינם עקביים
// ביניהם. hingeSide הוא גאומטריה על הקנבס; hingeOnFixed הוא מי השכן.
// רק השני אומר אילו שייפים באמת מחוברים, וזה מה שצומת הוא.
//
// הגאומטריה של הציור לא משתנה בשורה אחת. מה שמשתנה הוא מאיפה מגיעה
// ההחלטה כמה חתיכות לצייר ואיפה.
// ההמרה עצמה עברה למנוע — ‏lgFromPanels. היא הנקודה היחידה שבה שני
// המודלים נוגעים, ושם היא גם נבדקת: המרה שיושבת בצייר אי אפשר להריץ
// בלי דפדפן, וזה בדיוק איך ששתי מוסכמות הציר ההפוכות שרדו כל כך הרבה
// זמן. כאן נשארת רק העטיפה שמוסיפה את מה שהמסך יודע.
function _lgShowerOf(allPanels, allPS){
  return lgFromPanels(allPanels, allPS, {
    finish:'shahor',
    quality: selQ==='pliz' ? 'pliz' : 'zamak',
  });
}

// הצמתים משני צדי פאנל idx. junction[idx] הוא הצד הימני שלו,
// junction[idx+1] הצד השמאלי — n שייפים נותנים n+1 צמתים.
function _lgSidesOf(allPanels,allPS,idx){
  const js=(typeof lgJunctions==='function') ? lgJunctions(_lgShowerOf(allPanels,allPS)) : [];
  return {right:js[idx]||{type:null,qty:0}, left:js[idx+1]||{type:null,qty:0}};
}


// מפת מיקומים: איזה שייף יושב באיזה מלבן על הקנבס. בלעדיה אי אפשר יהיה
// להצביע על צורה — לא כאן ולא בתחנת הבדיקה — והוספה מאוחרת מחייבת לחזור
// לתוך הציור.
window._lgShapeRects=[];


// ══════════════ DRAW HELPERS ══════════════
// הסמל המקורי. ניסיתי להחליף אותו בלוחית-ציר-מלחציים, והתוצאה על המסך
// הייתה גרועה מהמלבן — המפעיל דחה אותה. אם מחליפים אותו שוב, זה נבדק
// מול העין לפני שזה נכנס, לא אחרי.
function drwHinge(x,y){
  const hw=7,hh=14;
  cx.fillStyle='#b8922a';cx.fillRect(x-hw/2,y-hh/2,hw,hh);
  cx.strokeStyle='#7a5e10';cx.lineWidth=1;cx.strokeRect(x-hw/2,y-hh/2,hw,hh);
  cx.fillStyle='#fff';cx.beginPath();cx.arc(x,y,2,0,Math.PI*2);cx.fill();
}
function drwHingeOnFixed(x,y){
  // hinge mark on fixed panel — smaller, hollow
  const hw=6,hh=12;
  cx.strokeStyle='#b8922a';cx.lineWidth=1.5;cx.strokeRect(x-hw/2,y-hh/2,hw,hh);
  cx.fillStyle='rgba(184,146,42,0.15)';cx.fillRect(x-hw/2,y-hh/2,hw,hh);
  cx.fillStyle='#b8922a';cx.beginPath();cx.arc(x,y,2,0,Math.PI*2);cx.fill();
}
function drwBracket(x,y,fR,open){
  const s=10;
  cx.strokeStyle='#b8922a';cx.lineWidth=2.5;cx.setLineDash([]);
  if(open) cx.setLineDash([3,3]);
  cx.beginPath();fR?cx.moveTo(x+s,y):cx.moveTo(x-s,y);cx.lineTo(x,y);cx.lineTo(x,y+s);cx.stroke();
  cx.setLineDash([]);
  cx.fillStyle='#b8922a';cx.beginPath();cx.arc(x,y,3,0,Math.PI*2);cx.fill();
}
function drwGGBracket(x,y){
  const s=8;
  cx.fillStyle='rgba(184,146,42,0.75)';
  cx.beginPath();cx.moveTo(x,y-s);cx.lineTo(x+s*0.7,y);cx.lineTo(x,y+s);cx.lineTo(x-s*0.7,y);cx.closePath();cx.fill();
  cx.strokeStyle='#7a5e10';cx.lineWidth=1;cx.stroke();
}
function drwFloorBracket(x,y){
  const s=11;
  cx.strokeStyle='#b8922a';cx.lineWidth=2.5;
  cx.beginPath();cx.moveTo(x-s,y);cx.lineTo(x,y);cx.lineTo(x,y-s);cx.stroke();
  cx.beginPath();cx.moveTo(x+s,y);cx.lineTo(x,y);cx.stroke();
  cx.fillStyle='#b8922a';cx.beginPath();cx.arc(x,y,3,0,Math.PI*2);cx.fill();
  cx.font='8px Heebo,sans-serif';cx.fillStyle='#b8922a';cx.textAlign='center';
  cx.fillText('רצפה',x,y+13);
}
function drwHole(x,y){
  const r=3.5;
  cx.beginPath();cx.arc(x,y,r,0,Math.PI*2);
  cx.fillStyle='rgba(184,146,42,0.15)';cx.fill();
  cx.strokeStyle='#b8922a';cx.lineWidth=1.5;cx.stroke();
  cx.beginPath();cx.moveTo(x-r+1,y);cx.lineTo(x+r-1,y);cx.stroke();
  cx.beginPath();cx.moveTo(x,y-r+1);cx.lineTo(x,y+r-1);cx.stroke();
}

// DIM LINE with clickable hit area
//
// המטרה האחרונה היא או מזהה שדה טופס (הקריאות הוותיקות) או אובייקט
// {pfx, field, idx} — הצורה החדשה, שאינה תלויה בכך שהפקד מרונדר על המסך.
// במצב שייפים הפקדים אינם קיימים כלל, ולכן מזהה מחרוזת לבדו לא הספיק.
function dLine(x1,y1,x2,y2,txt,off,horiz,inputId){
  if(x1===x2&&y1===y2)return;
  cx.save();
  cx.strokeStyle='#b8922a';cx.fillStyle='#b8922a';cx.lineWidth=0.8;cx.setLineDash([3,3]);
  const ox=horiz?0:off, oy=horiz?off:0;
  cx.beginPath();cx.moveTo(x1,y1);cx.lineTo(x1+ox,y1+oy);cx.stroke();
  cx.beginPath();cx.moveTo(x2,y2);cx.lineTo(x2+ox,y2+oy);cx.stroke();
  cx.setLineDash([]);
  cx.beginPath();cx.moveTo(x1+ox,y1+oy);cx.lineTo(x2+ox,y2+oy);cx.stroke();
  const ang=Math.atan2(y2+oy-y1-oy,x2+ox-x1-ox),al=7;
  [[x1+ox,y1+oy,ang+Math.PI],[x2+ox,y2+oy,ang]].forEach(([ax,ay,a])=>{
    cx.beginPath();cx.moveTo(ax,ay);
    cx.lineTo(ax+Math.cos(a-0.3)*al,ay+Math.sin(a-0.3)*al);
    cx.lineTo(ax+Math.cos(a+0.3)*al,ay+Math.sin(a+0.3)*al);
    cx.closePath();cx.fill();
  });
  const mx=(x1+ox+x2+ox)/2,my=(y1+oy+y2+oy)/2;
  cx.font='bold 9px Heebo,sans-serif';cx.textAlign='center';cx.textBaseline='middle';
  const tw=cx.measureText(txt).width+8;
  // רקע אטום קודם, ורק אחריו הגוון של מידה הניתנת לעריכה. הגוון לבדו
  // היה שקוף ב-80% והקו נראה מבעדו — המספר יצא מטושטש ולא נקרא.
  cx.fillStyle='#fbf9f5';
  cx.fillRect(mx-tw/2,my-8,tw,16);
  if(inputId){ cx.fillStyle='rgba(184,146,42,0.18)'; cx.fillRect(mx-tw/2,my-8,tw,16); }
  cx.fillStyle='#1a1714';cx.fillText(txt,mx,my);
  cx.restore();
  // יעד המגע מורחב מעבר לטקסט: 14 פיקסלים על קנבס הם מטרה שאי אפשר
  // לפגוע בה באצבע. ר' כלל המגע בסקיל העיצוב — 44px.
  if(inputId){
    const HIT=22;
    dimHits.push({
      x:mx-Math.max(tw,44)/2, y:my-HIT,
      w:Math.max(tw,44),      h:HIT*2,
      id:  typeof inputId==='string'?inputId:null,
      t:   typeof inputId==='object'?inputId:null,
    });
  }
}

// ════════════════════════════════════════════════════════════════════════
//  הצייר שצורך את המנוע
// ════════════════════════════════════════════════════════════════════════
//
// הגאומטריה כבר לא כאן. ‏lgLayout מקבל מקלחון ומחזיר קואורדינטות; מה
// שנשאר לצייר הוא למשוך קווים. הוא לא יודע מה זה שיפוע, באיזה צד יורד
// הפינוי, או איפה יושב הציר — הוא מקבל נקודות ומצייר אותן.
//
// זה מה שמאפשר לבדוק את הציור בלי דפדפן, וזו הסיבה שכל באג ציור בפרויקט
// הזה עבר בעבר את כל הבדיקות.

// כל מידה נושאת סוג; מצב העריכה צריך לדעת איזה שדה היא משנה.
const ENG_FIELD={
  'width':'w', 'height':'h', 'total':null,
  'hinge-top':'hingeTop', 'hinge-bot':'hingeBot',
  'bracket-top':'bracketTop', 'bracket-bot':'bracketBot',
  'bracket-inset':'bracketInset',
  'handle-edge':'handleEdge', 'handle-dist':'handleDist',
  'notch-w':'notchW', 'notch-h':'notchH',
};

// מידה: הקו נשבר סביב המספר במקום שהמספר יישב בקופסה מעליו, ותווית על
// קו אנכי נקראת מלמטה למעלה. שניהם מהמנוע — ‏rot ו-‏t — כדי שהצייר
// והבדיקות יסכימו על אותו מקום בדיוק.
function engDim(d,pfx){
  const t=d.t==null?0.5:d.t;
  const mx=d.x1+(d.x2-d.x1)*t, my=d.y1+(d.y2-d.y1)*t;
  const sz=d.size||10;
  cx.save();
  cx.font='bold '+sz+'px Heebo,sans-serif';
  const tw=cx.measureText(d.text).width, gap=tw+8;

  cx.strokeStyle='#b8922a'; cx.fillStyle='#b8922a'; cx.lineWidth=0.8;
  (d.ext||[]).forEach(e=>{ cx.save(); cx.setLineDash([3,3]); cx.lineWidth=0.6;
    cx.beginPath(); cx.moveTo(e.x1,e.y1); cx.lineTo(e.x2,e.y2); cx.stroke(); cx.restore(); });

  const inside = t>0.02 && t<0.98;
  cx.beginPath();
  if(d.rot){
    if(inside){ cx.moveTo(d.x1,d.y1); cx.lineTo(d.x1,my-gap/2);
                cx.moveTo(d.x1,my+gap/2); cx.lineTo(d.x2,d.y2); }
    else      { cx.moveTo(d.x1,d.y1); cx.lineTo(d.x2,d.y2); }
    cx.stroke();
    [[d.x1,d.y1],[d.x2,d.y2]].forEach(([ax,ay])=>{
      cx.beginPath(); cx.moveTo(ax-4,ay); cx.lineTo(ax+4,ay); cx.stroke(); });
  } else {
    if(inside){ cx.moveTo(d.x1,d.y1); cx.lineTo(mx-gap/2,d.y1);
                cx.moveTo(mx+gap/2,d.y2); cx.lineTo(d.x2,d.y2); }
    else      { cx.moveTo(d.x1,d.y1); cx.lineTo(d.x2,d.y2); }
    cx.stroke();
    [[d.x1,d.y1],[d.x2,d.y2]].forEach(([ax,ay])=>{
      cx.beginPath(); cx.moveTo(ax,ay-4); cx.lineTo(ax,ay+4); cx.stroke(); });
  }

  cx.translate(mx,my); if(d.rot) cx.rotate(-Math.PI/2);
  cx.textAlign='center'; cx.textBaseline='middle';
  cx.fillStyle='#1a1714'; cx.fillText(d.text,0,0);
  cx.restore();

  // יעד מגע של 44 פיקסלים, גם כשהמספר קטן ממנו
  // המנוע יודע מה כל מידה מתארת, ולכן הוא זה שאומר איזה שדה היא משנה.
  // ‏ENG_FIELD נשאר כמפה לפי סוג, למידות שאין להן שדה משלהן — אבל שתי
  // מידות גובה של אותו שיפוע הן אותו סוג ושני שדות שונים, ומיפוי לפי
  // סוג בלבד פתח לשתיהן את הגובה הכללי.
  const field=d.field||ENG_FIELD[d.kind];
  if(field && d.idx!=null){
    const w=Math.max(tw+10,44), h=44;
    // הערך שמוצג נוסע עם היעד. המנוע מחשב מידות שאינן יושבות ב-ps —
    // זווית שעוקבת אחרי הצירים, גובה שנגזר משכן — ולכן קריאה מ-ps בלבד
    // פתחה את החלון על ברירת המחדל בזמן שעל השרטוט כתוב מספר אחר.
    // מי שלוחץ על 700 מתכוון לערוך את 700.
    const shown=Number(d.text);
    dimHits.push({ x:mx-w/2, y:my-h/2, w:w, h:h,
                   t:{pfx:pfx, field:field, idx:d.idx,
                      shown:isFinite(shown)?shown:null} });
  }
}

// כל הפרזול הוא **קדח**, ומה שהחותך צריך הוא המיקום והקוטר. זווית וציר
// יושבים על בורג של 20 מ"מ, ידית על 12 — והחור מצויר בקנה המידה של
// הציור, כך שההפרש ביניהם נראה בעין ולא רק ברשימה.
// ציר וזווית אינם אותו דבר, ולכן אינם נראים אותו דבר.
//
// **זווית** מוברגת דרך קדח, וזה כל מה שיש לחותך לדעת — עיגול חשוף
// בקוטר 20, בדיוק כמו הידית ב-12. **ציר** נשאר הסמל שהיה לו מאז ומעולם:
// גוף מלא היושב על הפאה, כי הוא אוחז בשתי הזכוכיות ולא נקדח לתוך אחת.
function engHardware(h,sc){
  cx.save();
  if(h.kind==='hinge'){
    // ‏24x16 ולא 14x10: בציר נכנסים שני קדחים של 20, אחד בכל צד של
    // הפאה, ועוד רווח ביניהם — בגודל הקודם הוא נראה קטן ממה שהוא.
    cx.fillStyle='#2b2620';
    cx.beginPath();
    if(cx.roundRect) cx.roundRect(h.x-12,h.y-8,24,16,3);
    else cx.rect(h.x-12,h.y-8,24,16);
    cx.fill();
  } else {
    const mm = h.dia || (h.kind==='hole' ? 12 : 20);
    const r  = Math.max(mm*(sc||0)/2, 3);   // לעולם לא קטן מכדי להיראות
    cx.beginPath(); cx.arc(h.x,h.y,r,0,Math.PI*2);
    cx.fillStyle='#fff'; cx.fill();
    cx.strokeStyle = h.kind==='bracket' ? '#8a6a2a' : '#3a3128';
    cx.lineWidth=1.4; cx.stroke();
  }
  cx.restore();
}

// מצייר פריסה אחת בהיסט נתון. ההיסט הוא מה שמאפשר לערום כמה פריטים על
// קנבס אחד בלי שכל אחד יחשב מיקומים אחרים — הוא מקבל את אותן קואורדינטות
// ורק מוזז.
function engPaint(L,pfx,dy,idxOf){
  cx.save(); cx.translate(0,dy);

  L.shapes.forEach(s=>{
    cx.save();
    cx.beginPath();
    s.poly.forEach((p,i)=>i?cx.lineTo(p[0],p[1]):cx.moveTo(p[0],p[1]));
    cx.closePath();
    const g=cx.createLinearGradient(s.x,s.y,s.x+s.w,s.y+s.h);
    g.addColorStop(0, s.kind==='door'?'rgba(160,190,205,0.30)':'rgba(170,200,210,0.16)');
    g.addColorStop(1, s.kind==='door'?'rgba(160,190,205,0.14)':'rgba(170,200,210,0.07)');
    cx.fillStyle=g; cx.fill();
    cx.strokeStyle='#2f6b6b'; cx.lineWidth=1.6; cx.stroke();

    cx.fillStyle='rgba(58,49,40,0.45)';
    cx.font='11px Heebo,sans-serif'; cx.textAlign='center'; cx.textBaseline='middle';
    cx.fillText(s.label || kindName(s.kind), s.x+s.w/2, s.y+s.h/2);
    cx.restore();
  });

  L.hardware.forEach(h=>engHardware(h,L.scale));

  // אזורי המגע נרשמים בקואורדינטות הקנבס ולא בקואורדינטות המוזזות: הם
  // נבדקים מול נקודת הלחיצה אחרי שה-transform כבר נגמר.
  const before=dimHits.length;
  L.dims.forEach(d=>engDim(d,pfx));
  for(let i=before;i<dimHits.length;i++){
    dimHits[i].y+=dy;
    if(idxOf && dimHits[i].t) dimHits[i].t.idx=idxOf(dimHits[i].t.idx);
  }
  cx.restore();
}

function drawFromEngine(panels,pss,DPR,cW,pfx){
  const L=lgLayout(_lgShowerOf(panels,pss),{canvasW:cW});

  // הקנבס יכול לצאת רחב מהמסך: מקלחון של חמישה פאנלים לא נכנס לפלאפון
  // בלי שהמספרים יתרחקו מהזכוכית או ייחתכו זה על זה. שרטט מצייר גדול
  // וגולל — הוא לא מקטין את הסקיצה עד שאי אפשר לקרוא אותה.
  setupCanvas(DPR,L.canvas.w,L.canvas.h+28);
  drawGrid(L.canvas.w,L.canvas.h+28);
  dimHits=[];
  engPaint(L,pfx||'combo',0,null);
  drawTitleBar(L.canvas.w,L.canvas.h+28);
  updateSpecs();
}

function drawTitleBar(cW,cH){
  const ty=cH-28;
  cx.fillStyle='#f7f4ef';cx.fillRect(0,ty,cW,28);
  cx.strokeStyle='rgba(0,0,0,0.07)';cx.lineWidth=1;
  cx.beginPath();cx.moveTo(0,ty);cx.lineTo(cW,ty);cx.stroke();
  cx.font='bold 11px Heebo,sans-serif';cx.fillStyle='#b8922a';cx.textAlign='right';
  cx.fillText('LuzGlass',cW-10,ty+18);
  const sn=document.getElementById('sketchName')?.value||'';
  cx.font='10px Heebo,sans-serif';cx.fillStyle='#8a8278';cx.textAlign='center';
  cx.fillText(sn||new Date().toLocaleDateString('he-IL'),cW/2,ty+18);
  cx.textAlign='left';cx.fillText(new Date().toLocaleDateString('he-IL'),10,ty+18);
}

// ══════════════ מצב עריכה ══════════════
//
// לחיצה על מידה הייתה גוללת את הדף אל שדה טופס מתחת לציור — כלומר מרחיקה
// את העין בדיוק מהדבר שרוצים לראות בזמן השינוי. עכשיו נפתח חלון קטן על
// המידה עצמה, והציור מתעדכן מיד.
//
// אבל קנבס שמגיב לכל מגע אי אפשר לגלול מעליו: גרירה כדי לגלול נוחתת
// כלחיצה ופותחת משהו, ובפלאפון הקנבס תופס כמעט את כל המסך. לכן התגובה
// יושבת מאחורי מצב עריכה מפורש — כבוי כברירת מחדל.
let editMode=false;
let dimEditTarget=null;

function setEditMode(on){
  editMode=!!on;
  const btn=document.getElementById('btnEditMode');
  const wrap=document.getElementById('canvasWrap');
  const hint=document.getElementById('editHint');
  if(btn){
    btn.classList.toggle('on',editMode);
    btn.textContent=editMode?'✓ שמור וסיים':'✎ מצב עריכה';
  }
  C.classList.toggle('editing',editMode);
  if(wrap) wrap.classList.toggle('editing',editMode);
  if(hint) hint.style.display=editMode?'block':'none';
  if(!editMode) closeDimEditor();
}

// מה כל מטרה משנה בפועל. השדות במ"מ, חוץ מ-handleEdge שהפקד שלו בס"מ —
// העורך מדבר מ"מ תמיד, וממיר לו.
const DIM_FIELDS={
  w:          {label:'רוחב'},
  h:          {label:'גובה'},
  slopeH1:    {label:'גובה הפאה השמאלית'},
  slopeH2:    {label:'גובה הפאה הימנית'},
  slopeW1:    {label:'הרוחב העליון'},
  slopeW2:    {label:'הרוחב התחתון'},
  hingeTop:   {label:'הציר העליון — מלמעלה'},
  hingeBot:   {label:'הציר התחתון — מלמטה'},
  // ref מציין שלמידה יש נקודת ייחוס שאפשר להחליף — מלמעלה או מלמטה
  handleDist: {label:'גובה הידית', ref:'handleRef', refDefault:'bottom'},
  handleEdge: {label:'מרחק הידית מהפאה', cm:true},
  // המידות שהמנוע הוסיף. מידה שאי אפשר לתקן גרועה ממידה שאינה קיימת:
  // היא נראית סמכותית ואי אפשר לסדר אותה במקום.
  bracketTop:   {label:'הזווית העליונה — מלמעלה'},
  bracketBot:   {label:'הזווית התחתונה — מלמטה'},
  bracketInset: {label:'מרחק הזווית מהפאה'},
  notchW:       {label:'רוחב פינוי המדרגה'},
  notchH:       {label:'גובה פינוי המדרגה'},
};

// המטרה מתוארת כ-{pfx, field, idx} ולא כמזהה של שדה טופס. במצב שייפים
// פקדי הפאנל אינם מרונדרים כלל, ולכן getElementById החזיר null והחלון
// פשוט לא נפתח — בדיוק מה שנראה על המסך.
function _dimTarget(hit){
  if(hit.t) return hit.t;
  const m=String(hit.id||'').match(/^(.+)_([a-zA-Z0-9]+)_(\d+)$/);
  return m?{pfx:m[1],field:m[2],idx:Number(m[3])}:null;
}
function _dimRead(t){
  const ps=getPS(t.pfx,t.idx); if(!ps) return null;
  const f=DIM_FIELDS[t.field]||{};
  // מה שכתוב על השרטוט קודם לברירת מחדל, אבל לא לערך שהוזן: אם הלקוח
  // כבר קבע מספר, הוא זה שנפתח לעריכה.
  let v=ps[t.field];
  if(v==null && t.shown!=null) v = (DIM_FIELDS[t.field]||{}).cm ? t.shown/10 : t.shown;
  // ברירת מחדל לכל שדה שהמנוע יודע לצייר בלי שהוזן. בלעדיה הערך יוצא
  // undefined, ‏openDimEditor יוצא בשקט, והלחיצה לא עושה כלום — מידה
  // שרואים על השרטוט ואי אפשר לגעת בה.
  if(v==null){
    if(t.field==='hingeTop'||t.field==='hingeBot')       v=EDGE_MM;
    else if(t.field==='bracketTop'||t.field==='bracketBot') v=EDGE_MM;
    else if(t.field==='bracketInset')  v=BRACKET_INSET_MM;
    else if(t.field==='handleDist')    v=Math.round((ps.h||2000)/2);
    else if(t.field==='handleEdge')    v=HANDLE_EDGE_CM;
    else if(t.field==='slopeH1'||t.field==='slopeH2') v=ps.h||2000;
    else if(t.field==='slopeW1'||t.field==='slopeW2') v=ps.w||500;
  }
  if(v==null) return null;
  return f.cm?Math.round(v*10):v;      // תמיד מ"מ החוצה
}
function _dimWrite(t,mm){
  const ps=getPS(t.pfx,t.idx); if(!ps) return false;
  const f=DIM_FIELDS[t.field]||{};
  ps[t.field]=f.cm?(mm/10):mm;
  return true;
}

function openDimEditor(hit,clientX,clientY){
  const t=_dimTarget(hit);
  const cur=t&&_dimRead(t);
  if(!t||cur==null) return;
  dimEditTarget=t;
  const rect=C.getBoundingClientRect();
  const ed=document.getElementById('dimEditor');
  const inp=document.getElementById('dimEditorInput');
  const lbl=document.getElementById('dimEditorLabel');
  lbl.style.color='';
  const f=DIM_FIELDS[t.field]||{};
  lbl.textContent=(f.label||'מידה')+' — '+_dimUnitLabel();
  // מתחיל מהערך שיושב שם עכשיו, כדי שאפשר יהיה לתקן ולא רק להקליד מחדש
  inp.value=String(_dimToUnit(cur));
  _dimUnitPaint();
  // בורר נקודת הייחוס, למידות שיש להן אחת
  const refRow=document.getElementById('dimEditorRef');
  if(f.ref){
    const ps=getPS(t.pfx,t.idx)||{};
    const curRef=ps[f.ref]||f.refDefault;
    refRow.style.display='flex';
    document.getElementById('dimRefBot').className=curRef==='bottom'?'dim-ed-ok':'dim-ed-x';
    document.getElementById('dimRefTop').className=curRef==='top'?'dim-ed-ok':'dim-ed-x';
  } else refRow.style.display='none';
  ed.classList.add('open');
  // נפתח ליד הנגיעה, ונדחף פנימה אם הוא גולש מהמעטפת
  // החלון ממוקם ביחס למעטפת — היא ה-offsetParent — ומוגבל לאזור **הנראה**
  // שלה, לא לרוחב הקנבס.
  //
  // זה היה הבאג: משהוגדל הקנבס מעבר למסך, ההגבלה לרוחבו אפשרה לחלון
  // לשבת רחוק מעבר לשפת המעטפת, ושם הוא נחתך ולא נראה כלל. לחיצה על
  // מידה נראתה כאילו לא קרה כלום — ובקבוע בודד, שבו הקנבס לא גדל, הכל
  // עבד. אותו קוד, שני מצבים.
  const wrap=C.parentElement, wr=wrap.getBoundingClientRect();
  const sx=wrap.scrollLeft||0, sy=wrap.scrollTop||0;
  const w=ed.offsetWidth||180, h=ed.offsetHeight||140;
  let left=clientX-wr.left+sx-w/2;
  left=Math.max(sx+6, Math.min(left, sx+wrap.clientWidth-w-6));
  let top=clientY-wr.top+sy-h-10;
  if(top<sy+6) top=clientY-wr.top+sy+14;
  ed.style.left=left+'px'; ed.style.top=top+'px';
  setTimeout(()=>{inp.focus();inp.select();},30);
}

function closeDimEditor(){
  dimEditTarget=null;
  document.getElementById('dimEditor')?.classList.remove('open');
}

// החלפת נקודת הייחוס. הידית **לא זזה** — רק המספר משתנה למרחק מהפאה
// החדשה. אחרת החלפת "מלמטה" ל"מלמעלה" הייתה מקפיצה אותה לצד השני של
// הזכוכית, וזו לא בקשה שמישהו התכוון אליה.
// היחידה היא **שפת ההקלדה בלבד**. כל מידה נשמרת במילימטרים, כי זה מה
// שהחותך מקבל ומה שהמנוע מחשב בו; היחידה קובעת רק מה נוח למי שמזין.
// מי שרגיל למדוד בסנטימטרים יקליד 20 במקום 200.
//
// ההעדפה נשמרת, כי מי שמודד בסנטימטרים ימשיך למדוד בסנטימטרים.
let dimUnit = (function(){
  try { return localStorage.getItem('lgDimUnit')==='cm' ? 'cm' : 'mm'; }
  catch(e){ return 'mm'; }
})();

function _dimUnitLabel(){ return dimUnit==='cm' ? 'ס"מ' : 'מ"מ'; }
function _dimToUnit(mm){ return dimUnit==='cm' ? mm/10 : mm; }
function _dimFromUnit(v){ return dimUnit==='cm' ? Math.round(v*10) : Math.round(v); }

// ‏lgParseDimensionInput מנחש: "20" הופך ל-200 ו-"200" ל-2000, כי בלי
// יחידה מוצהרת אין דרך אחרת. ברגע שהיחידה מוצהרת הניחוש מזיק — מי
// שבמצב מ"מ והקליד 200 מתכוון ל-200.
function _dimParse(str){
  const raw=String(str==null?'':str).trim().replace(',','.');
  if(!raw) return {ok:false,error:'צריך מספר'};
  const n=parseFloat(raw);
  if(!isFinite(n)) return {ok:false,error:'צריך מספר'};
  if(n<0) return {ok:false,error:'מידה לא יכולה להיות שלילית'};
  const mm=_dimFromUnit(n);
  if(mm>5000) return {ok:false,error:'מידה גדולה מדי — מקסימום '+_dimToUnit(5000)+' '+_dimUnitLabel()};
  return {ok:true,mm:mm};
}

function _dimUnitPaint(){
  const mmB=document.getElementById('dimUnitMm'), cmB=document.getElementById('dimUnitCm');
  if(mmB) mmB.className = dimUnit==='mm' ? 'dim-ed-ok' : 'dim-ed-x';
  if(cmB) cmB.className = dimUnit==='cm' ? 'dim-ed-ok' : 'dim-ed-x';
}

function dimEditorSetUnit(u){
  const next = u==='cm' ? 'cm' : 'mm';
  if(next===dimUnit){ _dimUnitPaint(); return; }
  // המספר שכבר מוקלד עובר יחידה איתו, כדי שלא ישתנה מתחת ליד
  const inp=document.getElementById('dimEditorInput');
  const cur=_dimParse(inp.value);
  dimUnit=next;
  try { localStorage.setItem('lgDimUnit',dimUnit); } catch(e){}
  const t=dimEditTarget;
  const mm = cur.ok ? cur.mm : (t ? _dimRead(t) : null);
  if(mm!=null) inp.value=String(_dimToUnit(mm));
  const lbl=document.getElementById('dimEditorLabel');
  const f=(t&&DIM_FIELDS[t.field])||{};
  if(lbl) lbl.textContent=(f.label||'מידה')+' — '+_dimUnitLabel();
  _dimUnitPaint();
  inp.focus(); inp.select();
}

function dimEditorSetRef(val){
  const t=dimEditTarget; if(!t) return;
  const f=DIM_FIELDS[t.field]||{}; if(!f.ref) return;
  const ps=getPS(t.pfx,t.idx); if(!ps) return;

  const h=ps.h||2000;
  const typed=_dimParse(document.getElementById('dimEditorInput').value);
  const curRef=ps[f.ref]||f.refDefault;
  const curDist=typed.ok?typed.mm:(ps[t.field]!=null?ps[t.field]:Math.round(h/2));
  if(val!==curRef) ps[t.field]=Math.max(0,h-curDist);   // אותו מקום, מדידה מהצד השני
  ps[f.ref]=val;

  document.getElementById('dimEditorInput').value=String(_dimToUnit(ps[t.field]));
  document.getElementById('dimRefBot').className=val==='bottom'?'dim-ed-ok':'dim-ed-x';
  document.getElementById('dimRefTop').className=val==='top'?'dim-ed-ok':'dim-ed-x';
  draw();
}

// אותו פרסר של כל המערכת — 200 הם 2000, 1985 נשארים 1985.
function dimEditorApply(){
  if(!dimEditTarget) return;
  const raw=document.getElementById('dimEditorInput').value;
  const r=_dimParse(raw);
  if(!r.ok){
    const lbl=document.getElementById('dimEditorLabel');
    lbl.textContent=r.error; lbl.style.color='#c0392b';
    return;
  }
  document.getElementById('dimEditorLabel').style.color='';
  if(!_dimWrite(dimEditTarget,r.mm)) return;
  // הפקדים שמתחת לציור, אם הם מרונדרים במצב הזה, צריכים להראות את הערך החדש
  if(appMode==='combo') renderPanelCtrl();
  else if(appMode==='item') renderItemList();
  closeDimEditor();
  draw();
}

// המרת נקודת מסך לקואורדינטת ציור.
//
// setupCanvas עושה cx.scale(DPR,DPR), ולכן כל הציור — ואיתו dimHits —
// נמצא בפיקסלי CSS. החישוב הקודם היה:
//
//     ratio = C.width/(rect.width*DPR)     ← מצטמצם ל-cssW/rect.width
//     cx2   = (clientX-left) * DPR * ratio ← כלומר מוכפל ב-DPR מיותר
//
// כלומר הנקודה יצאה גדולה פי DPR מהיעד. בטלפון עם DPR=3 נגיעה ב-100
// חושבה כ-300 ולעולם לא פגעה בשום מידה. בדסקטופ עם DPR=1 זה עבד במקרה,
// ולכן הבאג שרד: אף אחד לא לחץ על מידה בטלפון עד עכשיו.
//
// טהורה בכוונה, כדי שאפשר יהיה לבדוק אותה עם DPR=3 בלי דפדפן.
function _canvasPoint(clientX,clientY,rect,cssW){
  // שני צירים, שני יחסים. יחס אחד לשניהם מניח שהקנבס נמתח באותה מידה
  // לרוחב ולגובה — וזה נשבר ברגע שהוא רחב מהמסך: הרוחב מוקטן, הגובה
  // נשאר, וכל נקודת מגע נופלת גבוה או נמוך ממה שהיא באמת.
  //
  // כך נראה הבאג מבחוץ: לחיצה על הרוחב הכולל פתחה את **עורך הרוחב של
  // הפאנל** שמתחתיו, וכל שאר המידות לא הגיבו כלל. המידה היחידה שאין לה
  // עורך היא בדיוק זו שנראתה עובדת.
  //
  // המקור הוא C.width ולא style.width: הוא נקבע ב-setupCanvas ואינו
  // תלוי ב-CSS שעשוי למתוח את האלמנט.
  const dpr = window.devicePixelRatio || 1;
  const cw = (C.width  / dpr) || cssW || rect.width;
  const ch = (C.height / dpr) || rect.height;
  const sx = rect.width  ? (cw / rect.width)  : 1;
  const sy = rect.height ? (ch / rect.height) : sx;
  return { x:(clientX-rect.left)*sx, y:(clientY-rect.top)*sy };
}

C.addEventListener('click',function(e){
  if(!editMode) return;              // מחוץ למצב עריכה הצייר אינו מגיב כלל
  const rect=C.getBoundingClientRect();
  const p=_canvasPoint(e.clientX,e.clientY,rect,parseFloat(C.style.width)||rect.width);
  const cx2=p.x, cy2=p.y;
  for(const hit of dimHits){
    if(cx2>=hit.x&&cx2<=hit.x+hit.w&&cy2>=hit.y&&cy2<=hit.y+hit.h){
      openDimEditor(hit,e.clientX,e.clientY);
      return;
    }
  }
  closeDimEditor();                  // נגיעה מחוץ למידה סוגרת
});

document.addEventListener('keydown',function(e){
  if(e.key==='Escape') closeDimEditor();
});

// ══════════════ SPECS & ORDER ══════════════
function updateSpecs(){
  const panels=getPanels(),pss=getPStates();
  if(!panels.length){document.getElementById('specs').innerHTML='<strong>פרטי הזמנה</strong>הוסף פריטים';return;}
  const g=GL.find(x=>x.id===selG),f=FN.find(x=>x.id===selF);
  const totalW=panels.reduce((s,_,i)=>s+(pss[i]?.w||500),0);
  const maxH=panels.length?Math.max(...panels.map((_,i)=>Math.max(pss[i]?.h||2000,pss[i]?.slopeH1||0,pss[i]?.slopeH2||0))):2000;
  const area=(totalW*maxH/1000000).toFixed(2);
  const total=Math.round(parseFloat(area)*g.price)+(selQ==='zamak'?f.pZ:f.pP);
  const sn=document.getElementById('sketchName')?.value;
  const det=panels.map((p,i)=>`${p.label||p.type}: ${pss[i]?.w||500}×${pss[i]?.h||2000} מ"מ`).join(' | ');
  document.getElementById('specs').innerHTML=`<strong>פרטי הזמנה</strong>
    ${sn?`<span style="color:var(--gold-text);font-weight:700">${sn}</span><br>`:''}
    ${det}<br>
    זכוכית: ${g.name} 8מ״מ מחוסם · ₪${g.price}/מ״ר<br>
    פרזול: ${f.name} (${selQ==='zamak'?'זאמק':'פליז'})<br>${sand?'+ התזת חול<br>':''}
    שטח: ${area} מ״ר<br>
    <strong style="color:var(--gold-text)">סה״כ: ₪${total.toLocaleString()}</strong>`;
}

function handleAddToSketch(){
  if(appMode==='item'){
    // In item mode: scroll to add buttons
    document.querySelector('.add-grid')?.scrollIntoView({behavior:'smooth',block:'center'});
    showToast('בחר סוג פריט להוספה');
  } else {
    // In combo mode: add current combo to sketch list (up to 3)
    addComboToSketch();
  }
}

let sketchParts=[]; // holds up to 3 combos/sketches

function addComboToSketch(){
  const panels=getPanels(),pss=getPStates();
  if(!panels.length){showToast('בחר קומבינציה תחילה');return;}
  if(sketchParts.length>=3){showToast('ניתן להוסיף עד 3 מקלחונים לסקיצה');return;}
  const g=GL.find(x=>x.id===selG),f=FN.find(x=>x.id===selF);
  const totalW=panels.reduce((s,_,i)=>s+(pss[i]?.w||500),0);
  const maxH=Math.max(...panels.map((_,i)=>pss[i]?.h||2000));
  const area=(totalW*maxH/1000000).toFixed(2);
  sketchParts.push({
    label:curCombo.label,
    panels:panels.map((p,i)=>({...p,w:pss[i]?.w||500,h:pss[i]?.h||2000,...pss[i]})),
    glass:g.name,area,
    sketch:(()=>{try{return C.toDataURL('image/png',0.6);}catch(e){return null;}})()
  });
  showToast(`✓ נוסף (${sketchParts.length}/3) — לחץ "סיים הזמנה" או הוסף עוד`);
}

function saveAndSendOrder(){
  const panels=getPanels(),pss=getPStates();
  // בקומבינציה תמיד יש פאנלים - רק בפריט פריט בודקים
  if(appMode==='item' && !items.length && !sketchParts.length){showToast('הוסף פריטים תחילה');return null;}
  const g=GL.find(x=>x.id===selG),f=FN.find(x=>x.id===selF);
  const totalW=panels.reduce((s,_,i)=>s+(pss[i]?.w||500),0);
  const maxH=panels.length?Math.max(...panels.map((_,i)=>Math.max(pss[i]?.h||2000,pss[i]?.slopeH1||0,pss[i]?.slopeH2||0))):2000;
  const area=(totalW*maxH/1000000).toFixed(2);
  const total=Math.round(parseFloat(area)*g.price)+(selQ==='zamak'?f.pZ:f.pP);
  const orders=JSON.parse(safeStorage.getItem('lgOrders')||'[]');
  const _s = JSON.parse(sessionStorage.getItem('lgSession')||'{}');
  const _cName = (_s.role==='admin' && window._sketchClient)
    ? window._sketchClient.name
    : (_s.name || _clientName || 'לקוח');
  const _cPhone = (_s.role==='admin' && window._sketchClient)
    ? window._sketchClient.phone
    : (_s.phone || _clientPhone || '');
  const _orderNum = '2026-' + String(Date.now()).slice(-5);
  const newOrder={
    id:Date.now(),
    sketchName:document.getElementById('sketchName')?.value||'',
    orderClient:_cName,
    orderNum:_orderNum,
    phone:_cPhone,
    source:'system',
    type:appMode==='combo'?(sketchParts.length>0?'סקיצה מרובה':curCombo.label):'פריט פריט',
    glass:g.name,glassPrice:g.price,finish:f.name,quality:selQ,sand,area,total,
    panels:panels.map((p,i)=>({label:p.label||p.type,type:p.type,w:pss[i]?.w||500,h:pss[i]?.h||2000})),
    parts:sketchParts,
    date:new Date().toLocaleDateString('he-IL'),
    status:'התקבלה',
    sketch:(()=>{try{return C.toDataURL('image/png',0.6);}catch(e){return null;}})()
  };
  orders.push(newOrder);
  try{
    safeStorage.setItem('lgOrders',JSON.stringify(orders));
    console.log('Order saved, total orders:', orders.length, 'id:', newOrder.id);
  }catch(err){
    console.error('Save failed:', err);
    showToast('שגיאה בשמירה — נסה שוב');
    return null;
  }
  return newOrder;
}

function finishOrder(){
  const panels=getPanels(),pss=getPStates();
  if(appMode==='item'&&!items.length&&!sketchParts.length){showToast('הוסף פריטים תחילה');return;}
  const saved=saveAndSendOrder();
  if(saved===null){return;} // save failed
  sketchParts=[];
  showFinishPopup();
}


function showFinishPopup(){
  const ov=document.createElement('div');
  ov.id='finishPopup';
  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.72);z-index:600;display:flex;align-items:center;justify-content:center;font-family:Heebo,sans-serif;direction:rtl;padding:16px;';
  const box=document.createElement('div');
  box.style.cssText='background:#fff;border-radius:12px;padding:28px 24px;max-width:340px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.3);';
  box.innerHTML='<div style="font-size:44px;margin-bottom:12px">✅</div>'
    +'<div style="font-size:16px;font-weight:900;color:#1a1714;margin-bottom:8px;">הסקיצה נשלחה לתור!</div>'
    +'<div style="font-size:13px;color:#8a8278;margin-bottom:24px;">רוצה לבנות סקיצה נוספת?</div>';
  const btns=document.createElement('div');
  btns.style.cssText='display:flex;gap:10px;';
  const b1=document.createElement('button');
  b1.style.cssText='flex:1;padding:13px;background:#b8922a;color:var(--on-gold);font-family:Heebo,sans-serif;font-size:14px;font-weight:900;border:none;cursor:pointer;border-radius:6px;';
  b1.textContent='כן, בנה עוד';
  b1.onclick=function(){buildAnother();ov.remove();};
  const b2=document.createElement('button');
  b2.style.cssText='flex:1;padding:13px;background:#1a1714;color:#f7f4ef;font-family:Heebo,sans-serif;font-size:14px;font-weight:700;border:none;cursor:pointer;border-radius:6px;';
  b2.textContent='לא, חזרה לדף הראשי';
  b2.onclick=function(){ov.remove();goHome();};
  btns.appendChild(b1);btns.appendChild(b2);
  box.appendChild(btns);ov.appendChild(box);
  document.body.appendChild(ov);
}

function buildAnother(){
  // Reset for new sketch
  items=[];sketchParts=[];
  document.getElementById('sketchName').value='';
  if(appMode==='item') renderItemList();
  else {initPanelState();renderPanelCtrl();}
  draw();
  window.scrollTo({top:0,behavior:'smooth'});
  showToast('בנה סקיצה חדשה');
}

function goHome(){
  try{window.location.replace('index.html');}
  catch(e){window.location.href='index.html';}
}

function dlPNG(){const l=document.createElement('a');l.download=`luzglass-${Date.now()}.png`;l.href=C.toDataURL();l.click();}

// ══════════════ SWATCHES ══════════════
function renderSw(){
  document.getElementById('gSw').innerHTML=GL.map(g=>`
    <button class="sw ${g.id===selG?'active':''}" onclick="selG='${g.id}';renderSw();draw()">
      <div class="sw-dot" style="background:${g.dot};${g.b?'border:'+g.b:''}"></div>
      <div class="sw-name">${g.name}</div><div class="sw-price">₪${g.price}</div>
    </button>`).join('');
  document.getElementById('fSw').innerHTML=FN.map(f=>`
    <button class="sw ${f.id===selF?'active':''}" onclick="selF='${f.id}';renderSw();draw()">
      <div class="sw-dot" style="background:${f.dot}"></div><div class="sw-name">${f.name}</div>
    </button>`).join('');
}

// ══════════════ INIT ══════════════
renderCombos(); initPS(); renderPanelCtrl(); renderSw();
window.addEventListener('resize',draw); draw();
</script>
