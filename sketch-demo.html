        <button class="ic-del" onclick="removeItem(${i})">הסר</button>
      </div>
      <div class="ic-body">${buildPanelHTML(panel,ps,i,'item')}</div>`;
    el.appendChild(card);
  });
}

// ══════════════ DRAW ENGINE ══════════════
function getPanels(){
  // מצב השייפים מזין את אותו נתיב ציור בדיוק כמו הקומבינציות — אותו מבנה
  // פאנלים, אותו drawComboMode. נתיב ציור שני היה מתפצל מהראשון.
  if(appMode==='shape') return _shapePanels();
  return appMode==='combo'?curCombo.panels:items.map(it=>it._panel||{type:'fixed',label:'פריט',wallSide:'both'});
}
// כל קורא של מצב זכוכית עובר דרך getPS, שגם **שומר** את מה שהוא יצר.
//
// קודם היו שני מסלולים: ‏getPS יצר ושמר, ו-getPStates יצר ולא שמר. לוח
// שהמצב שלו חסר קיבל ברירות מחדל טריות בכל ציור, ושתי הפונקציות החזירו
// **אובייקטים שונים לאותו לוח** — מה שנכתב דרך אחת נעלם דרך השנייה.
// זה הדפוס שגורם לפרטים של לוח אחד להיעלם בעקבות פעולה על לוח אחר.
function getPStates(){
  if(appMode==='shape')
    return Object.fromEntries(shapeList.map((s,i)=>[i,getPS('shape',i)]));
  if(appMode==='combo')
    return Object.fromEntries(curCombo.panels.map((p,i)=>[i,getPS('combo',i)]));
  return Object.fromEntries(items.map((it,i)=>[i,it]));
}

// ─── הצעה לזווית רצפה ──────────────────────────────
//
// את הקצה החופשי של קבוע לא מחזיק שום דבר חוץ מזוויות הקיר.
// כשהקבוע גדול יש לקוחות שמעדיפים להוסיף זווית רצפה לחיזוק.
//
// **זו הצעה, לא חוק.** המנוע אינו מוסיף זווית ואינו פוסל קבוע רחב
// בלעדיה; המסך שואל פעם אחת ומכבד את התשובה. מי שסירב יכול תמיד
// להדליק אותה בעצמו בגיליון המאפיינים, שם היא הייתה מאז ומתמיד.
const LG_FLOOR_OFFER_MM = 800;      // 80 ס"מ. מספר אחד, במקום אחד.

// מי כבר נשאל. בלי זה השאלה הייתה חוזרת בכל ציור מחדש עד
// שהלקוח היה עונה "כן" רק כדי שתיפסיק — וזו לא הסכמה.
const _fbAsked = new Set();
let _fbSeeded = false, _fbTarget = null;

// מפתח יציב ללוח. במצב השייפים יש מזהה אמיתי; בשאר המצבים
// האינדקס הוא מה שיש. מחיקת לוח מזיזה שם את האינדקסים, והמחיר
// הוא שאלה אחת מיותרת — לא זווית שנוספה לבד.
function _fbKey(p,i){ return appMode+':'+((p&&p.id)||i); }

// קבוע רחב אחד שעדיין לא נשאל עליו. אחד בלבד: שתי שאלות זו על
// גבי זו הן חסימה, לא הצעה. השנייה תעלה בציור הבא.
function _fbCandidate(){
  const panels=getPanels(), pss=getPStates();
  for(let i=0;i<panels.length;i++){
    const p=panels[i]||{}, st=pss[i]||{};
    if(((p.type)||'fixed')!=='fixed') continue;   // דלת, מראה וצורה אינן נשענות על רצפה
    if(st.floorBracket) continue;                 // כבר יש לו
    if((Number(st.w)||0)<=LG_FLOOR_OFFER_MM) continue;
    const key=_fbKey(p,i);
    if(_fbAsked.has(key)) continue;
    return {i:i, key:key, w:Number(st.w)};
  }
  return null;
}

function offerFloorBracket(){
  const panels=getPanels();

  // הזרעה בציור הראשון שיש בו משהו: סקיצה שנפתחת עם קבוע רחב
  // שמור אינה שאלה שהלקוח שאל — ההצעה עוקבת אחרי מה שנעשה עכשיו.
  if(!_fbSeeded){
    if(!panels.length) return;
    const pss=getPStates();
    panels.forEach((p,i)=>{
      const st=pss[i]||{};
      if(((p&&p.type)||'fixed')==='fixed' && (Number(st.w)||0)>LG_FLOOR_OFFER_MM)
        _fbAsked.add(_fbKey(p,i));
    });
    _fbSeeded=true;
    return;
  }

  if(_fbTarget) return;                       // שאלה אחת פתוחה בכל רגע

  // לא קופצים מעל חלון שפתוח. מי שמקליד מידה עוד לא סיים
  // להחליט, והשאלה תעלה בציור הבא — בלי לסמן אותו כנשאל.
  if(document.querySelector('.sheet.open')) return;
  if(document.getElementById('dimEditor')?.classList.contains('open')) return;

  const c=_fbCandidate();
  if(!c) return;
  _fbTarget=c;

  const txt=document.getElementById('offerText');
  if(txt) txt.innerHTML='הקבוע הזה ברוחב <b>'+Math.round(c.w/10)+' ס"מ</b> ('+c.w+' ממ). '+
    'בקבוע רחב יש לקוחות שמעדיפים להוסיף זווית רצפה לחיזוק.<br>'+
    'אין בזה חובה — הקבוע מוחזק בזוויות הקיר.';

  document.getElementById('offerBack')?.classList.add('open');
  const sh=document.getElementById('offerSheet');
  if(sh){ sh.classList.add('open'); sh.querySelector('.offer-yes')?.focus(); }
}

// שתי התשובות נגמרות אותו דבר: הלוח נרשם כנשאל ולא יישאל שוב.
function offerAnswer(yes){
  const t=_fbTarget; _fbTarget=null;
  document.getElementById('offerBack')?.classList.remove('open');
  document.getElementById('offerSheet')?.classList.remove('open');
  if(!t) return;
  _fbAsked.add(t.key);
  if(yes){
    const ps=getPS(appMode==='combo'?'combo':appMode, t.i);
    if(ps) ps.floorBracket=true;
    // המסלול הרגיל של שינוי מצב: הליקוט והציור מתעדכנים יחד
    renderPanelCtrl();
    if(appMode==='shape') renderShapeUI();
    draw();
  }
}

// הציור והשאלה מופרדים, ולכן יש נקודה אחת בלבד שבה ההצעה עולה.
// שלושה מקומות משנים רוחב — הפקד, גיליון המאפיינים וחלון המידה —
// וכולם מסתיימים ב-draw(). בדיקה בכל אחד מהם הייתה שלוש אמיתות.
function draw(){
  _drawFrame();
  offerFloorBracket();
}

function _drawFrame(){
  const panels=getPanels(), pss=getPStates();
  if(!panels.length){lastL=null;drawEmpty();renderAddButtons();return;}

  const DPR=window.devicePixelRatio||1;
  const cW=C.parentElement.clientWidth;

  // In item mode, draw panels SEPARATELY (stacked vertically)
  if(appMode==='item'){
    lastL=null; drawItemMode(panels,pss,DPR,cW); renderAddButtons(); return;
  }
  drawComboMode(panels,pss,DPR,cW);
  // הכפתורים נגזרים מהפריסה שהציור בדיוק יצר, ולכן הם באים אחריו
  renderAddButtons();
}

// הגאומטריה עברה ל-lg-layout.js, וכאן נשארה רק ההפניה אליה. הצייר הישן
// חישב מיקומים תוך כדי ציור, ולכן אי אפשר היה לבדוק אותו בלי דפדפן —
// וכל באג ציור בפרויקט הזה עבר את כל הבדיקות.
function drawComboMode(panels,pss,DPR,cW){
  drawFromEngine(panels,pss,DPR,cW,'combo');
}


// במצב פריטים כל זכוכית עומדת בפני עצמה — היא לא מחוברת לשכנותיה ואין
// ביניהן צמתים. לכן כל אחת עוברת במנוע לחוד ומקבלת את המידות המלאות
// שלה, והן נערמות אנכית: לצייר אותן זו לצד זו על מסך פלאפון היה מקטין
// כל אחת לרבע ומעלים את המספרים.
function drawItemMode(panels,pss,DPR,cW){
  const GAP=18;
  const Ls=panels.map((p,i)=>lgLayout(_lgShowerOf([p],{0:(pss[i]||{})}),{canvasW:cW}));
  const maxW=Math.max.apply(null,Ls.map(L=>L.canvas.w));
  const totalH=Ls.reduce((n,L)=>n+L.canvas.h+GAP,0)+28;

  setupCanvas(DPR,maxW,totalH);
  drawGrid(maxW,totalH);
  dimHits=[];

  let dy=0;
  Ls.forEach((L,i)=>{ engPaint(L,'item',dy,()=>i); dy+=L.canvas.h+GAP; });

  drawTitleBar(maxW,totalH);
  updateSpecs();
}


function setupCanvas(DPR,cW,cH){
  C.width=cW*DPR; C.height=cH*DPR;
  C.style.width=cW+'px'; C.style.height=cH+'px';
  cx.setTransform(1,0,0,1,0,0);
  cx.scale(DPR,DPR);
  cx.clearRect(0,0,cW,cH);
  cx.fillStyle='#fff'; cx.fillRect(0,0,cW,cH);
}
function drawGrid(cW,cH){
  cx.strokeStyle='rgba(0,0,0,0.025)'; cx.lineWidth=1;
  const gs=30;
  for(let x=0;x<cW;x+=gs){cx.beginPath();cx.moveTo(x,0);cx.lineTo(x,cH);cx.stroke();}
  for(let y=0;y<cH;y+=gs){cx.beginPath();cx.moveTo(0,y);cx.lineTo(cW,y);cx.stroke();}
}
function drawEmpty(){
  const DPR=window.devicePixelRatio||1,cW=C.parentElement.clientWidth,cH=160;
  setupCanvas(DPR,cW,cH);
  cx.font='14px Heebo,sans-serif'; cx.fillStyle='#ccc'; cx.textAlign='center';
  cx.fillText('הוסף פריטים לסקיצה',cW/2,cH/2);
}


// ══════════════ הגשר אל מנוע החוקים ══════════════
//
// הפאנלים נושאים את אוצר המילים הישן — wallSide, glassGlass, hingeMarks,
// hingeOnFixed — ארבעה שדות שנכתבו ביד לכל קומבינציה ואינם עקביים
// ביניהם. hingeSide הוא גאומטריה על הקנבס; hingeOnFixed הוא מי השכן.
// רק השני אומר אילו שייפים באמת מחוברים, וזה מה שצומת הוא.
//
// הגאומטריה של הציור לא משתנה בשורה אחת. מה שמשתנה הוא מאיפה מגיעה
// ההחלטה כמה חתיכות לצייר ואיפה.
// ההמרה עצמה עברה למנוע — ‏lgFromPanels. היא הנקודה היחידה שבה שני
// המודלים נוגעים, ושם היא גם נבדקת: המרה שיושבת בצייר אי אפשר להריץ
// בלי דפדפן, וזה בדיוק איך ששתי מוסכמות הציר ההפוכות שרדו כל כך הרבה
// זמן. כאן נשארת רק העטיפה שמוסיפה את מה שהמסך יודע.
function _lgShowerOf(allPanels, allPS){
  return lgFromPanels(allPanels, allPS, {
    finish:'shahor',
    quality: selQ==='pliz' ? 'pliz' : 'zamak',
    thickness: selMM,
    glassType: selG,
    glassWork: selWork,
    // התוספות נכנסות כאן, במקום היחיד שבו המסך בונה מקלחון.
    supportBar: selSupportBar ? 1 : null,
    blackTrim:  selBlackTrim  ? 1 : null,
  });
}

// הצמתים משני צדי פאנל idx. junction[idx] הוא הצד הימני שלו,
// junction[idx+1] הצד השמאלי — n שייפים נותנים n+1 צמתים.
function _lgSidesOf(allPanels,allPS,idx){
  const js=(typeof lgJunctions==='function') ? lgJunctions(_lgShowerOf(allPanels,allPS)) : [];
  return {right:js[idx]||{type:null,qty:0}, left:js[idx+1]||{type:null,qty:0}};
}


// מפת מיקומים: איזה שייף יושב באיזה מלבן על הקנבס. בלעדיה אי אפשר יהיה
// להצביע על צורה — לא כאן ולא בתחנת הבדיקה — והוספה מאוחרת מחייבת לחזור
// לתוך הציור.
window._lgShapeRects=[];


// ══════════════ DRAW HELPERS ══════════════
// הסמל המקורי. ניסיתי להחליף אותו בלוחית-ציר-מלחציים, והתוצאה על המסך
// הייתה גרועה מהמלבן — המפעיל דחה אותה. אם מחליפים אותו שוב, זה נבדק
// מול העין לפני שזה נכנס, לא אחרי.
function drwHinge(x,y){
  const hw=7,hh=14;
  cx.fillStyle='#b8922a';cx.fillRect(x-hw/2,y-hh/2,hw,hh);
  cx.strokeStyle='#7a5e10';cx.lineWidth=1;cx.strokeRect(x-hw/2,y-hh/2,hw,hh);
  cx.fillStyle='#fff';cx.beginPath();cx.arc(x,y,2,0,Math.PI*2);cx.fill();
}
function drwHingeOnFixed(x,y){
  // hinge mark on fixed panel — smaller, hollow
  const hw=6,hh=12;
  cx.strokeStyle='#b8922a';cx.lineWidth=1.5;cx.strokeRect(x-hw/2,y-hh/2,hw,hh);
  cx.fillStyle='rgba(184,146,42,0.15)';cx.fillRect(x-hw/2,y-hh/2,hw,hh);
  cx.fillStyle='#b8922a';cx.beginPath();cx.arc(x,y,2,0,Math.PI*2);cx.fill();
}
function drwBracket(x,y,fR,open){
  const s=10;
  cx.strokeStyle='#b8922a';cx.lineWidth=2.5;cx.setLineDash([]);
  if(open) cx.setLineDash([3,3]);
  cx.beginPath();fR?cx.moveTo(x+s,y):cx.moveTo(x-s,y);cx.lineTo(x,y);cx.lineTo(x,y+s);cx.stroke();
  cx.setLineDash([]);
  cx.fillStyle='#b8922a';cx.beginPath();cx.arc(x,y,3,0,Math.PI*2);cx.fill();
}
function drwGGBracket(x,y){
  const s=8;
  cx.fillStyle='rgba(184,146,42,0.75)';
  cx.beginPath();cx.moveTo(x,y-s);cx.lineTo(x+s*0.7,y);cx.lineTo(x,y+s);cx.lineTo(x-s*0.7,y);cx.closePath();cx.fill();
  cx.strokeStyle='#7a5e10';cx.lineWidth=1;cx.stroke();
}
function drwFloorBracket(x,y){
  const s=11;
  cx.strokeStyle='#b8922a';cx.lineWidth=2.5;
  cx.beginPath();cx.moveTo(x-s,y);cx.lineTo(x,y);cx.lineTo(x,y-s);cx.stroke();
  cx.beginPath();cx.moveTo(x+s,y);cx.lineTo(x,y);cx.stroke();
  cx.fillStyle='#b8922a';cx.beginPath();cx.arc(x,y,3,0,Math.PI*2);cx.fill();
  cx.font='8px Heebo,sans-serif';cx.fillStyle='#b8922a';cx.textAlign='center';
  cx.fillText('רצפה',x,y+13);
}
function drwHole(x,y){
  const r=3.5;
  cx.beginPath();cx.arc(x,y,r,0,Math.PI*2);
  cx.fillStyle='rgba(184,146,42,0.15)';cx.fill();
  cx.strokeStyle='#b8922a';cx.lineWidth=1.5;cx.stroke();
  cx.beginPath();cx.moveTo(x-r+1,y);cx.lineTo(x+r-1,y);cx.stroke();
  cx.beginPath();cx.moveTo(x,y-r+1);cx.lineTo(x,y+r-1);cx.stroke();
}

// DIM LINE with clickable hit area
//
// המטרה האחרונה היא או מזהה שדה טופס (הקריאות הוותיקות) או אובייקט
// {pfx, field, idx} — הצורה החדשה, שאינה תלויה בכך שהפקד מרונדר על המסך.
// במצב שייפים הפקדים אינם קיימים כלל, ולכן מזהה מחרוזת לבדו לא הספיק.
function dLine(x1,y1,x2,y2,txt,off,horiz,inputId){
  if(x1===x2&&y1===y2)return;
  cx.save();
  cx.strokeStyle='#b8922a';cx.fillStyle='#b8922a';cx.lineWidth=0.8;cx.setLineDash([3,3]);
  const ox=horiz?0:off, oy=horiz?off:0;
  cx.beginPath();cx.moveTo(x1,y1);cx.lineTo(x1+ox,y1+oy);cx.stroke();
  cx.beginPath();cx.moveTo(x2,y2);cx.lineTo(x2+ox,y2+oy);cx.stroke();
  cx.setLineDash([]);
  cx.beginPath();cx.moveTo(x1+ox,y1+oy);cx.lineTo(x2+ox,y2+oy);cx.stroke();
  const ang=Math.atan2(y2+oy-y1-oy,x2+ox-x1-ox),al=7;
  [[x1+ox,y1+oy,ang+Math.PI],[x2+ox,y2+oy,ang]].forEach(([ax,ay,a])=>{
    cx.beginPath();cx.moveTo(ax,ay);
    cx.lineTo(ax+Math.cos(a-0.3)*al,ay+Math.sin(a-0.3)*al);
    cx.lineTo(ax+Math.cos(a+0.3)*al,ay+Math.sin(a+0.3)*al);
    cx.closePath();cx.fill();
  });
  const mx=(x1+ox+x2+ox)/2,my=(y1+oy+y2+oy)/2;
  cx.font='bold 9px Heebo,sans-serif';cx.textAlign='center';cx.textBaseline='middle';
  const tw=cx.measureText(txt).width+8;
  // רקע אטום קודם, ורק אחריו הגוון של מידה הניתנת לעריכה. הגוון לבדו
  // היה שקוף ב-80% והקו נראה מבעדו — המספר יצא מטושטש ולא נקרא.
  cx.fillStyle='#fbf9f5';
  cx.fillRect(mx-tw/2,my-8,tw,16);
  if(inputId){ cx.fillStyle='rgba(184,146,42,0.18)'; cx.fillRect(mx-tw/2,my-8,tw,16); }
  cx.fillStyle='#1a1714';cx.fillText(txt,mx,my);
  cx.restore();
  // יעד המגע מורחב מעבר לטקסט: 14 פיקסלים על קנבס הם מטרה שאי אפשר
  // לפגוע בה באצבע. ר' כלל המגע בסקיל העיצוב — 44px.
  if(inputId){
    const HIT=22;
    dimHits.push({
      x:mx-Math.max(tw,44)/2, y:my-HIT,
      w:Math.max(tw,44),      h:HIT*2,
      id:  typeof inputId==='string'?inputId:null,
      t:   typeof inputId==='object'?inputId:null,
    });
  }
}

// ════════════════════════════════════════════════════════════════════════
//  הצייר שצורך את המנוע
// ════════════════════════════════════════════════════════════════════════
//
// הגאומטריה כבר לא כאן. ‏lgLayout מקבל מקלחון ומחזיר קואורדינטות; מה
// שנשאר לצייר הוא למשוך קווים. הוא לא יודע מה זה שיפוע, באיזה צד יורד
// הפינוי, או איפה יושב הציר — הוא מקבל נקודות ומצייר אותן.
//
// זה מה שמאפשר לבדוק את הציור בלי דפדפן, וזו הסיבה שכל באג ציור בפרויקט
// הזה עבר בעבר את כל הבדיקות.

// כל מידה נושאת סוג; מצב העריכה צריך לדעת איזה שדה היא משנה.
const ENG_FIELD={
  'width':'w', 'height':'h', 'total':null,
  'hinge-top':'hingeTop', 'hinge-bot':'hingeBot',
  'bracket-top':'bracketTop', 'bracket-bot':'bracketBot',
  'bracket-inset':'bracketInset',
  'handle-edge':'handleEdge', 'handle-dist':'handleDist',
  'notch-w':'notchW', 'notch-h':'notchH',
};

// מידה: הקו נשבר סביב המספר במקום שהמספר יישב בקופסה מעליו, ותווית על
// קו אנכי נקראת מלמטה למעלה. שניהם מהמנוע — ‏rot ו-‏t — כדי שהצייר
// והבדיקות יסכימו על אותו מקום בדיוק.
function engDim(d,pfx){
  const t=d.t==null?0.5:d.t;
  const mx=d.x1+(d.x2-d.x1)*t, my=d.y1+(d.y2-d.y1)*t;
  const sz=d.size||10;
  cx.save();
  cx.font='bold '+sz+'px Heebo,sans-serif';
  const tw=cx.measureText(d.text).width, gap=tw+8;

  cx.strokeStyle='#b8922a'; cx.fillStyle='#b8922a'; cx.lineWidth=0.8;
  (d.ext||[]).forEach(e=>{ cx.save(); cx.setLineDash([3,3]); cx.lineWidth=0.6;
    cx.beginPath(); cx.moveTo(e.x1,e.y1); cx.lineTo(e.x2,e.y2); cx.stroke(); cx.restore(); });

  const inside = t>0.02 && t<0.98;
  cx.beginPath();
  if(d.rot){
    if(inside){ cx.moveTo(d.x1,d.y1); cx.lineTo(d.x1,my-gap/2);
                cx.moveTo(d.x1,my+gap/2); cx.lineTo(d.x2,d.y2); }
    else      { cx.moveTo(d.x1,d.y1); cx.lineTo(d.x2,d.y2); }
    cx.stroke();
    [[d.x1,d.y1],[d.x2,d.y2]].forEach(([ax,ay])=>{
      cx.beginPath(); cx.moveTo(ax-4,ay); cx.lineTo(ax+4,ay); cx.stroke(); });
  } else {
    if(inside){ cx.moveTo(d.x1,d.y1); cx.lineTo(mx-gap/2,d.y1);
                cx.moveTo(mx+gap/2,d.y2); cx.lineTo(d.x2,d.y2); }
    else      { cx.moveTo(d.x1,d.y1); cx.lineTo(d.x2,d.y2); }
    cx.stroke();
    [[d.x1,d.y1],[d.x2,d.y2]].forEach(([ax,ay])=>{
      cx.beginPath(); cx.moveTo(ax,ay-4); cx.lineTo(ax,ay+4); cx.stroke(); });
  }

  cx.translate(mx,my); if(d.rot) cx.rotate(-Math.PI/2);
  cx.textAlign='center'; cx.textBaseline='middle';
  cx.fillStyle='#1a1714'; cx.fillText(d.text,0,0);
  cx.restore();

  // יעד מגע של 44 פיקסלים, גם כשהמספר קטן ממנו
  // המנוע יודע מה כל מידה מתארת, ולכן הוא זה שאומר איזה שדה היא משנה.
  // ‏ENG_FIELD נשאר כמפה לפי סוג, למידות שאין להן שדה משלהן — אבל שתי
  // מידות גובה של אותו שיפוע הן אותו סוג ושני שדות שונים, ומיפוי לפי
  // סוג בלבד פתח לשתיהן את הגובה הכללי.
  const field=d.field||ENG_FIELD[d.kind];
  if(field && d.idx!=null){
    const w=Math.max(tw+10,44), h=44;
    // הערך שמוצג נוסע עם היעד. המנוע מחשב מידות שאינן יושבות ב-ps —
    // זווית שעוקבת אחרי הצירים, גובה שנגזר משכן — ולכן קריאה מ-ps בלבד
    // פתחה את החלון על ברירת המחדל בזמן שעל השרטוט כתוב מספר אחר.
    // מי שלוחץ על 700 מתכוון לערוך את 700.
    const shown=Number(d.text);
    dimHits.push({ x:mx-w/2, y:my-h/2, w:w, h:h,
                   t:{pfx:pfx, field:field, idx:d.idx,
                      shown:isFinite(shown)?shown:null} });
  }
}

// כל הפרזול הוא **קדח**, ומה שהחותך צריך הוא המיקום והקוטר. זווית וציר
// יושבים על בורג של 20 מ"מ, ידית על 12 — והחור מצויר בקנה המידה של
// הציור, כך שההפרש ביניהם נראה בעין ולא רק ברשימה.
// ציר וזווית אינם אותו דבר, ולכן אינם נראים אותו דבר.
//
// **זווית** מוברגת דרך קדח, וזה כל מה שיש לחותך לדעת — עיגול חשוף
// בקוטר 20, בדיוק כמו הידית ב-12. **ציר** נשאר הסמל שהיה לו מאז ומעולם:
// גוף מלא היושב על הפאה, כי הוא אוחז בשתי הזכוכיות ולא נקדח לתוך אחת.
function engHardware(h,sc,min){
  // ‏min הוא רצפת הקריאוּת **בפיקסלים הסופיים**. בקנבס היא 3; בכרטיס
  // גלריה, שמצויר מוקטן, היא גדולה יותר באותו יחס — אחרת הרצפה עצמה
  // מתכווצת ונעלמת, וזה בדיוק מה שקרה: הזוויות נעלמו מהכרטיסים והציר
  // שרד רק כי הוא מצויר בפיקסלים קבועים.
  const floor = min || 3, mul = floor/3;
  cx.save();
  if(h.kind==='hinge'){
    // בציר נכנסים שני קדחים של 20, אחד בכל צד של הפאה, ועוד רווח ביניהם.
    const w=24*mul, hh=16*mul;
    cx.fillStyle='#2b2620';
    cx.beginPath();
    if(cx.roundRect) cx.roundRect(h.x-w/2,h.y-hh/2,w,hh,3*mul);
    else cx.rect(h.x-w/2,h.y-hh/2,w,hh);
    cx.fill();
  } else {
    const mm = h.dia || (h.kind==='hole' ? 12 : 20);
    const r  = Math.max(mm*(sc||0)/2, floor);
    cx.beginPath(); cx.arc(h.x,h.y,r,0,Math.PI*2);
    cx.fillStyle='#fff'; cx.fill();
    cx.strokeStyle = h.kind==='bracket' ? '#8a6a2a' : '#3a3128';
    cx.lineWidth=1.4*Math.min(mul,2); cx.stroke();
  }
  cx.restore();
}


// מצייר פריסה אחת בהיסט נתון. ההיסט הוא מה שמאפשר לערום כמה פריטים על
// קנבס אחד בלי שכל אחד יחשב מיקומים אחרים — הוא מקבל את אותן קואורדינטות
// ורק מוזז.
function engPaint(L,pfx,dy,idxOf,opts){
  const _o=opts||{};
  cx.save(); cx.translate(0,dy);

  L.shapes.forEach(s=>{
    cx.save();
    cx.beginPath();
    s.poly.forEach((p,i)=>i?cx.lineTo(p[0],p[1]):cx.moveTo(p[0],p[1]));
    cx.closePath();
    const g=cx.createLinearGradient(s.x,s.y,s.x+s.w,s.y+s.h);
    g.addColorStop(0, s.kind==='door'?'rgba(160,190,205,0.30)':'rgba(170,200,210,0.16)');
    g.addColorStop(1, s.kind==='door'?'rgba(160,190,205,0.14)':'rgba(170,200,210,0.07)');
    cx.fillStyle=g; cx.fill();
    cx.strokeStyle='#2f6b6b'; cx.lineWidth=1.6; cx.stroke();

    cx.fillStyle='rgba(58,49,40,0.45)';
    cx.font='11px Heebo,sans-serif'; cx.textAlign='center'; cx.textBaseline='middle';
    cx.fillText(s.label || kindName(s.kind), s.x+s.w/2, s.y+s.h/2);
    cx.restore();
  });

  L.hardware.forEach(h=>engHardware(h,L.scale,_o.hwMin));

  // אזורי המגע נרשמים בקואורדינטות הקנבס ולא בקואורדינטות המוזזות: הם
  // נבדקים מול נקודת הלחיצה אחרי שה-transform כבר נגמר.
  const before=dimHits.length;
  L.dims.forEach(d=>engDim(d,pfx));
  for(let i=before;i<dimHits.length;i++){
    dimHits[i].y+=dy;
    if(idxOf && dimHits[i].t) dimHits[i].t.idx=idxOf(dimHits[i].t.idx);
  }
  cx.restore();
}

function drawFromEngine(panels,pss,DPR,cW,pfx){
  const L=lgLayout(_lgShowerOf(panels,pss),{canvasW:cW});
  lastL=L;   // העריכה וכפתורי ההוספה צריכים לדעת איפה כל לוח יושב

  // הקנבס יכול לצאת רחב מהמסך: מקלחון של חמישה פאנלים לא נכנס לפלאפון
  // בלי שהמספרים יתרחקו מהזכוכית או ייחתכו זה על זה. שרטט מצייר גדול
  // וגולל — הוא לא מקטין את הסקיצה עד שאי אפשר לקרוא אותה.
  setupCanvas(DPR,L.canvas.w,L.canvas.h+28);
  drawGrid(L.canvas.w,L.canvas.h+28);
  dimHits=[];
  paintPick(L);            // ההדגשה מתחת למספרים, כדי שיישארו קריאים
  engPaint(L,pfx||'combo',0,null);
  drawTitleBar(L.canvas.w,L.canvas.h+28);
  updateSpecs();
}

function drawTitleBar(cW,cH){
  const ty=cH-28;
  cx.fillStyle='#f7f4ef';cx.fillRect(0,ty,cW,28);
  cx.strokeStyle='rgba(0,0,0,0.07)';cx.lineWidth=1;
  cx.beginPath();cx.moveTo(0,ty);cx.lineTo(cW,ty);cx.stroke();
  cx.font='bold 11px Heebo,sans-serif';cx.fillStyle='#b8922a';cx.textAlign='right';
  cx.fillText('LuzGlass',cW-10,ty+18);
  const sn=document.getElementById('sketchName')?.value||'';
  cx.font='10px Heebo,sans-serif';cx.fillStyle='#8a8278';cx.textAlign='center';
  cx.fillText(sn||new Date().toLocaleDateString('he-IL'),cW/2,ty+18);
  cx.textAlign='left';cx.fillText(new Date().toLocaleDateString('he-IL'),10,ty+18);
}

// ══════════════ בחירת זכוכית לעריכה ══════════════
//
// "עריכה מתקדמת" אינו פותח חלון מיד. קודם בוחרים על מה עובדים — הזכוכית
// הנבחרת מודגשת על הציור והחיצים מדלגים ביניהן — ורק אז "ערוך" פותח את
// **אותו חלון** שהיה קודם מאחורי גלגל השיניים ברצועה. החלון לא השתנה;
// רק הדרך אליו.
//
// הניווט אינו חוקיות: הוא רק בורר. הסדר הוא הסדר על הציור, כי זה מה
// שהעין רואה — ולא הסדר במערך, שיכול להיות הפוך.
let pickMode=false, pickIdx=0;

function pickOrder(){
  if(appMode==='shape') return shapeList.map((s,i)=>({id:s.id,i:i,label:s.label}));
  const p=getPanels()||[];
  return p.map((x,i)=>({id:i,i:i,label:(x&&x.label)||('זכוכית '+(i+1))}));
}

function setPickMode(on){
  pickMode=!!on && pickOrder().length>0;
  pickIdx=Math.min(pickIdx,Math.max(0,pickOrder().length-1));
  const bar=document.getElementById('pickBar');
  const btn=document.getElementById('btnAdvEdit');
  if(bar) bar.style.display=pickMode?'flex':'none';
  if(btn) btn.classList.toggle('on',pickMode);
  renderPickBar();
  syncFullEdit();
}

function pickStep(d){
  const n=pickOrder().length; if(!n) return;
  // ‏d=+1 הוא ימינה על הציור. הסדר על הציור עולה עם x, כמו האינדקס.
  pickIdx=(pickIdx+d+n)%n;
  renderPickBar();
  draw();
}

function renderPickBar(){
  const el=document.getElementById('pickName'); if(!el) return;
  const list=pickOrder();
  const cur=list[pickIdx];
  el.textContent=cur?(cur.label+' ('+(pickIdx+1)+' מתוך '+list.length+')'):'אין זכוכית';
}

function pickEdit(){
  const cur=pickOrder()[pickIdx]; if(!cur) return;
  // אותו חלון בשני הטאבים — רק המטרה שונה
  openShapeSheet(appMode==='shape'?cur.id:cur.i, appMode==='shape'?'shape':appMode);
}

// ההדגשה מצוירת אחרי הזכוכית ולפני המידות, כדי שהמספרים יישארו קריאים.
function paintPick(L){
  if(!pickMode||!L||!L.shapes) return;
  const order=[...L.shapes].sort((a,b)=>a.x-b.x);
  const g=order[pickIdx];
  if(!g||!g.poly) return;
  cx.save();
  cx.beginPath();
  g.poly.forEach((q,i)=>i?cx.lineTo(q[0],q[1]):cx.moveTo(q[0],q[1]));
  cx.closePath();
  cx.fillStyle='rgba(184,146,42,0.16)';
  cx.fill();
  cx.strokeStyle='#b8922a'; cx.lineWidth=2.5; cx.setLineDash([]); cx.stroke();
  cx.restore();
}

// ══════════════ מצב עריכה ══════════════
//
// לחיצה על מידה הייתה גוללת את הדף אל שדה טופס מתחת לציור — כלומר מרחיקה
// את העין בדיוק מהדבר שרוצים לראות בזמן השינוי. עכשיו נפתח חלון קטן על
// המידה עצמה, והציור מתעדכן מיד.
//
// אבל קנבס שמגיב לכל מגע אי אפשר לגלול מעליו: גרירה כדי לגלול נוחתת
// כלחיצה ופותחת משהו, ובפלאפון הקנבס תופס כמעט את כל המסך. לכן התגובה
// יושבת מאחורי מצב עריכה מפורש — כבוי כברירת מחדל.
let editMode=false;
let dimEditTarget=null;

// ─── מסך מלא לעריכה ──────────────────────────────────────────────────
//
// הפקדים שיושבים בתחתית משתנים בגובהם לפי המצב, הגופן ורוחב המסך,
// ולכן המקום שנשמר להם נמדד ולא מנוחש. מספר קבוע נשבר בשקט:
// הציור נחתך מאחורי הפקדים במקום שתוצג שגיאה.
function fitFullBottom(){
  const bs=document.body.style;
  if(!document.body.classList.contains('sketch-full')){
    bs.setProperty('--full-bottom','0px'); return;
  }
  // offsetParent של אלמנט fixed הוא null תמיד, ולכן הבדיקה היא על display
  const hOf=id=>{
    const e=document.getElementById(id);
    if(!e || getComputedStyle(e).display==='none') return 0;
    return e.offsetHeight;
  };
  const bar=hOf('editBar'), pick=hOf('pickBar'), hint=hOf('editHint');
  bs.setProperty('--full-bar-h',  bar +'px');
  bs.setProperty('--full-pick-h', pick+'px');
  bs.setProperty('--full-bottom', (bar+pick+hint)+'px');
}

// **תצוגה בלבד.** אין כאן שום החלטה על שייפים, על + או על מידות — רק
// מחלקה על body ו-draw() אחריה, כי רוחב הקנבס נגזר מרוחב המעטפת.
//
// שני המצבים חולקים את הפונקציה הזאת, ולכן אין מצב שבו אחד פתח מסך מלא
// והשני סגר אותו מתחתיו.
function syncFullEdit(){
  const on = editMode || pickMode;
  document.body.classList.toggle('sketch-full', on);
  fitFullBottom();
  const t=document.getElementById('fullBarTitle');
  if(t) t.textContent = pickMode ? 'עריכה מתקדמת' : 'מצב עריכה';
  const bar=document.getElementById('fullBar');
  if(bar) bar.setAttribute('aria-hidden', on?'false':'true');
  // הרוחב השתנה, ולכן הציור נבנה מחדש. הפריסה, החוקיות והמצב לא נגעו.
  draw();
}

// ה-X יוצא ממה שפתוח. הוא קורא לאותן פונקציות שהכפתורים קוראים, ולכן
// אין לו התנהגות משלו שיכולה להיפרד מהן.
function exitFullEdit(){
  if(pickMode) setPickMode(false);
  if(editMode) setEditMode(false);
}

function setEditMode(on){
  editMode=!!on;
  const btn=document.getElementById('btnEditMode');
  const wrap=document.getElementById('canvasWrap');
  const hint=document.getElementById('editHint');
  if(btn){
    btn.classList.toggle('on',editMode);
    btn.textContent=editMode?'✓ שמור וסיים':'✎ מצב עריכה';
  }
  C.classList.toggle('editing',editMode);
  if(wrap) wrap.classList.toggle('editing',editMode);
  if(hint) hint.style.display=editMode?'block':'none';
  if(!editMode) closeDimEditor();
  syncFullEdit();
}

// מה כל מטרה משנה בפועל. השדות במ"מ, חוץ מ-handleEdge שהפקד שלו בס"מ —
// העורך מדבר מ"מ תמיד, וממיר לו.
const DIM_FIELDS={
  w:          {label:'רוחב'},
  h:          {label:'גובה'},
  slopeH1:    {label:'גובה הפאה השמאלית'},
  slopeH2:    {label:'גובה הפאה הימנית'},
  slopeW1:    {label:'הרוחב העליון'},
  slopeW2:    {label:'הרוחב התחתון'},
  hingeTop:   {label:'הציר העליון — מלמעלה'},
  hingeBot:   {label:'הציר התחתון — מלמטה'},
  // ref מציין שלמידה יש נקודת ייחוס שאפשר להחליף — מלמעלה או מלמטה
  handleDist: {label:'גובה הידית', ref:'handleRef', refDefault:'bottom'},
  handleEdge: {label:'מרחק הידית מהפאה', cm:true},
  // המידות שהמנוע הוסיף. מידה שאי אפשר לתקן גרועה ממידה שאינה קיימת:
  // היא נראית סמכותית ואי אפשר לסדר אותה במקום.
  bracketTop:   {label:'הזווית העליונה — מלמעלה'},
  bracketBot:   {label:'הזווית התחתונה — מלמטה'},
  bracketInset: {label:'מרחק הזווית מהפאה'},
  notchW:       {label:'רוחב פינוי המדרגה'},
  notchH:       {label:'גובה פינוי המדרגה'},
};

// המטרה מתוארת כ-{pfx, field, idx} ולא כמזהה של שדה טופס. במצב שייפים
// פקדי הפאנל אינם מרונדרים כלל, ולכן getElementById החזיר null והחלון
// פשוט לא נפתח — בדיוק מה שנראה על המסך.
function _dimTarget(hit){
  if(hit.t) return hit.t;
  const m=String(hit.id||'').match(/^(.+)_([a-zA-Z0-9]+)_(\d+)$/);
  return m?{pfx:m[1],field:m[2],idx:Number(m[3])}:null;
}
function _dimRead(t){
  const ps=getPS(t.pfx,t.idx); if(!ps) return null;
  const f=DIM_FIELDS[t.field]||{};
  // מה שכתוב על השרטוט קודם לברירת מחדל, אבל לא לערך שהוזן: אם הלקוח
  // כבר קבע מספר, הוא זה שנפתח לעריכה.
  let v=ps[t.field];
  if(v==null && t.shown!=null) v = (DIM_FIELDS[t.field]||{}).cm ? t.shown/10 : t.shown;
  // ברירת מחדל לכל שדה שהמנוע יודע לצייר בלי שהוזן. בלעדיה הערך יוצא
  // undefined, ‏openDimEditor יוצא בשקט, והלחיצה לא עושה כלום — מידה
  // שרואים על השרטוט ואי אפשר לגעת בה.
  if(v==null){
    if(t.field==='hingeTop'||t.field==='hingeBot')       v=EDGE_MM;
    else if(t.field==='bracketTop'||t.field==='bracketBot') v=EDGE_MM;
    else if(t.field==='bracketInset')  v=BRACKET_INSET_MM;
    else if(t.field==='handleDist')    v=Math.round((ps.h||2000)/2);
    else if(t.field==='handleEdge')    v=HANDLE_EDGE_CM;
    else if(t.field==='slopeH1'||t.field==='slopeH2') v=ps.h||2000;
    else if(t.field==='slopeW1'||t.field==='slopeW2') v=ps.w||500;
  }
  if(v==null) return null;
  return f.cm?Math.round(v*10):v;      // תמיד מ"מ החוצה
}
// ─── מי שותף לציר הזה ────────────────────────────────────────────────
//
// הציר הוא פיסת מתכת אחת שעוברת דרך שתי הזכוכיות, ולכן שני המספרים
// שעליו מתארים **אותו ציר** משתי נקודות מדידה. הדלת תלויה מהמשקוף
// והקבוע עומד על הרצפה, ולכן התחתית שלהם נפרדת — 330 על הדלת ו-345 על
// הקבוע הם אותו בורג.
//
// המנוע מקשיב לדלת בלבד. לכן עריכה מצד הדלת הזיזה את שניהם, ועריכה מצד
// הקבוע נפלה לבור ולא עשתה כלום.
//
// ההמרה אינה מחושבת כאן מחדש אלא **נלקחת מהפריסה**: המנוע כותב את
// המספר כ-(תחתית הלוח פחות גובה הציר), ולכן ההפרש בין שני המספרים הוא
// בדיוק ההפרש בין תחתיות הלוחות. חישוב מקביל היה נפרד מהמנוע ביום שבו
// מישהו ישנה שם משהו.
function _hingePartner(idx){
  if(!lastL||!lastL.hardware) return null;
  const hw=lastL.hardware.filter(h=>h.kind==='hinge'&&h.source!=='declared');
  if(!hw.length) return null;
  const me=lastL.shapes.find(s=>s.idx===idx);
  if(!me) return null;
  // הצומת שבו יושב הציר נוגע בשני לוחות; השני הוא זה שאינו אני
  const near=hw.find(h=>Math.abs(h.x-me.x)<2||Math.abs(h.x-(me.x+me.w))<2);
  if(!near) return null;
  const other=lastL.shapes.find(s=>s.idx!==idx&&
    (Math.abs(near.x-s.x)<2||Math.abs(near.x-(s.x+s.w))<2));
  return other?{me:me,other:other}:null;
}

function _dimWrite(t,mm){
  const ps=getPS(t.pfx,t.idx); if(!ps) return false;
  const f=DIM_FIELDS[t.field]||{};
  const val=f.cm?(mm/10):mm;
  ps[t.field]=val;

  // ציר משותף: המספר נכתב גם על הלוח שממול, מתורגם לנקודת המדידה שלו,
  // כדי ששני הצדדים יישארו תואמים לא משנה מאיזה מהם ערכו.
  if(t.field==='hingeTop'||t.field==='hingeBot'){
    const pair=_hingePartner(t.idx);
    if(pair&&lastL.scale){
      const sc=lastL.scale, me=pair.me, other=pair.other;
      const shift = t.field==='hingeBot'
        ? ((other.y+other.h)-(me.y+me.h))/sc     // תחתיות נפרדות
        : (me.y-other.y)/sc;                     // ראשים, בדרך כלל זהים
      const ops=getPS(t.pfx,other.idx);
      if(ops) ops[t.field]=Math.round(val+shift);
    }
  }
  return true;
}

function openDimEditor(hit,clientX,clientY){
  const t=_dimTarget(hit);
  const cur=t&&_dimRead(t);
  if(!t||cur==null) return;
  dimEditTarget=t;
  const rect=C.getBoundingClientRect();
  const ed=document.getElementById('dimEditor');
  const inp=document.getElementById('dimEditorInput');
  const lbl=document.getElementById('dimEditorLabel');
  lbl.style.color='';
  const f=DIM_FIELDS[t.field]||{};
  lbl.textContent=(f.label||'מידה')+' — '+_dimUnitLabel();
  // מתחיל מהערך שיושב שם עכשיו, כדי שאפשר יהיה לתקן ולא רק להקליד מחדש
  inp.value=String(_dimToUnit(cur));
  _dimUnitPaint();
  // בורר נקודת הייחוס, למידות שיש להן אחת
  const refRow=document.getElementById('dimEditorRef');
  if(f.ref){
    const ps=getPS(t.pfx,t.idx)||{};
    const curRef=ps[f.ref]||f.refDefault;
    refRow.style.display='flex';
    document.getElementById('dimRefBot').className=curRef==='bottom'?'dim-ed-ok':'dim-ed-x';
    document.getElementById('dimRefTop').className=curRef==='top'?'dim-ed-ok':'dim-ed-x';
  } else refRow.style.display='none';
  ed.classList.add('open');
  // נפתח ליד הנגיעה, ונדחף פנימה אם הוא גולש מהמעטפת
  // החלון ממוקם ביחס למעטפת — היא ה-offsetParent — ומוגבל לאזור **הנראה**
  // שלה, לא לרוחב הקנבס.
  //
  // זה היה הבאג: משהוגדל הקנבס מעבר למסך, ההגבלה לרוחבו אפשרה לחלון
  // לשבת רחוק מעבר לשפת המעטפת, ושם הוא נחתך ולא נראה כלל. לחיצה על
  // מידה נראתה כאילו לא קרה כלום — ובקבוע בודד, שבו הקנבס לא גדל, הכל
  // עבד. אותו קוד, שני מצבים.
  const wrap=C.parentElement, wr=wrap.getBoundingClientRect();
  const sx=wrap.scrollLeft||0, sy=wrap.scrollTop||0;
  const w=ed.offsetWidth||180, h=ed.offsetHeight||140;
  let left=clientX-wr.left+sx-w/2;
  left=Math.max(sx+6, Math.min(left, sx+wrap.clientWidth-w-6));
  let top=clientY-wr.top+sy-h-10;
  if(top<sy+6) top=clientY-wr.top+sy+14;
  ed.style.left=left+'px'; ed.style.top=top+'px';
  setTimeout(()=>{inp.focus();inp.select();},30);
}

function closeDimEditor(){
  dimEditTarget=null;
  document.getElementById('dimEditor')?.classList.remove('open');
}

// החלפת נקודת הייחוס. הידית **לא זזה** — רק המספר משתנה למרחק מהפאה
// החדשה. אחרת החלפת "מלמטה" ל"מלמעלה" הייתה מקפיצה אותה לצד השני של
// הזכוכית, וזו לא בקשה שמישהו התכוון אליה.
// היחידה היא **שפת ההקלדה בלבד**. כל מידה נשמרת במילימטרים, כי זה מה
// שהחותך מקבל ומה שהמנוע מחשב בו; היחידה קובעת רק מה נוח למי שמזין.
// מי שרגיל למדוד בסנטימטרים יקליד 20 במקום 200.
//
// ההעדפה נשמרת, כי מי שמודד בסנטימטרים ימשיך למדוד בסנטימטרים.
let dimUnit = (function(){
  try { return localStorage.getItem('lgDimUnit')==='cm' ? 'cm' : 'mm'; }
  catch(e){ return 'mm'; }
})();

function _dimUnitLabel(){ return dimUnit==='cm' ? 'ס"מ' : 'מ"מ'; }
function _dimToUnit(mm){ return dimUnit==='cm' ? mm/10 : mm; }
function _dimFromUnit(v){ return dimUnit==='cm' ? Math.round(v*10) : Math.round(v); }

// ‏lgParseDimensionInput מנחש: "20" הופך ל-200 ו-"200" ל-2000, כי בלי
// יחידה מוצהרת אין דרך אחרת. ברגע שהיחידה מוצהרת הניחוש מזיק — מי
// שבמצב מ"מ והקליד 200 מתכוון ל-200.
function _dimParse(str){
  const raw=String(str==null?'':str).trim().replace(',','.');
  if(!raw) return {ok:false,error:'צריך מספר'};
  const n=parseFloat(raw);
  if(!isFinite(n)) return {ok:false,error:'צריך מספר'};
  if(n<0) return {ok:false,error:'מידה לא יכולה להיות שלילית'};
  const mm=_dimFromUnit(n);
  if(mm>5000) return {ok:false,error:'מידה גדולה מדי — מקסימום '+_dimToUnit(5000)+' '+_dimUnitLabel()};
  return {ok:true,mm:mm};
}

function _dimUnitPaint(){
  const mmB=document.getElementById('dimUnitMm'), cmB=document.getElementById('dimUnitCm');
  if(mmB) mmB.className = dimUnit==='mm' ? 'dim-ed-ok' : 'dim-ed-x';
  if(cmB) cmB.className = dimUnit==='cm' ? 'dim-ed-ok' : 'dim-ed-x';
}

function dimEditorSetUnit(u){
  const next = u==='cm' ? 'cm' : 'mm';
  if(next===dimUnit){ _dimUnitPaint(); return; }
  // המספר שכבר מוקלד עובר יחידה איתו, כדי שלא ישתנה מתחת ליד
  const inp=document.getElementById('dimEditorInput');
  const cur=_dimParse(inp.value);
  dimUnit=next;
  try { localStorage.setItem('lgDimUnit',dimUnit); } catch(e){}
  const t=dimEditTarget;
  const mm = cur.ok ? cur.mm : (t ? _dimRead(t) : null);
  if(mm!=null) inp.value=String(_dimToUnit(mm));
  const lbl=document.getElementById('dimEditorLabel');
  const f=(t&&DIM_FIELDS[t.field])||{};
  if(lbl) lbl.textContent=(f.label||'מידה')+' — '+_dimUnitLabel();
  _dimUnitPaint();
  inp.focus(); inp.select();
}

function dimEditorSetRef(val){
  const t=dimEditTarget; if(!t) return;
  const f=DIM_FIELDS[t.field]||{}; if(!f.ref) return;
  const ps=getPS(t.pfx,t.idx); if(!ps) return;

  const h=ps.h||2000;
  const typed=_dimParse(document.getElementById('dimEditorInput').value);
  const curRef=ps[f.ref]||f.refDefault;
  const curDist=typed.ok?typed.mm:(ps[t.field]!=null?ps[t.field]:Math.round(h/2));
  if(val!==curRef) ps[t.field]=Math.max(0,h-curDist);   // אותו מקום, מדידה מהצד השני
  ps[f.ref]=val;

  document.getElementById('dimEditorInput').value=String(_dimToUnit(ps[t.field]));
  document.getElementById('dimRefBot').className=val==='bottom'?'dim-ed-ok':'dim-ed-x';
  document.getElementById('dimRefTop').className=val==='top'?'dim-ed-ok':'dim-ed-x';
  draw();
}

// אותו פרסר של כל המערכת — 200 הם 2000, 1985 נשארים 1985.
function dimEditorApply(){
  if(!dimEditTarget) return;
  const raw=document.getElementById('dimEditorInput').value;
  const r=_dimParse(raw);
  if(!r.ok){
    const lbl=document.getElementById('dimEditorLabel');
    lbl.textContent=r.error; lbl.style.color='#c0392b';
    return;
  }
  document.getElementById('dimEditorLabel').style.color='';
  if(!_dimWrite(dimEditTarget,r.mm)) return;
  // הפקדים שמתחת לציור, אם הם מרונדרים במצב הזה, צריכים להראות את הערך החדש
  if(appMode==='combo') renderPanelCtrl();
  else if(appMode==='item') renderItemList();
  closeDimEditor();
  draw();
}

// המרת נקודת מסך לקואורדינטת ציור.
//
// setupCanvas עושה cx.scale(DPR,DPR), ולכן כל הציור — ואיתו dimHits —
// נמצא בפיקסלי CSS. החישוב הקודם היה:
//
//     ratio = C.width/(rect.width*DPR)     ← מצטמצם ל-cssW/rect.width
//     cx2   = (clientX-left) * DPR * ratio ← כלומר מוכפל ב-DPR מיותר
//
// כלומר הנקודה יצאה גדולה פי DPR מהיעד. בטלפון עם DPR=3 נגיעה ב-100
// חושבה כ-300 ולעולם לא פגעה בשום מידה. בדסקטופ עם DPR=1 זה עבד במקרה,
// ולכן הבאג שרד: אף אחד לא לחץ על מידה בטלפון עד עכשיו.
//
// טהורה בכוונה, כדי שאפשר יהיה לבדוק אותה עם DPR=3 בלי דפדפן.
function _canvasPoint(clientX,clientY,rect,cssW){
  // שני צירים, שני יחסים. יחס אחד לשניהם מניח שהקנבס נמתח באותה מידה
  // לרוחב ולגובה — וזה נשבר ברגע שהוא רחב מהמסך: הרוחב מוקטן, הגובה
  // נשאר, וכל נקודת מגע נופלת גבוה או נמוך ממה שהיא באמת.
  //
  // כך נראה הבאג מבחוץ: לחיצה על הרוחב הכולל פתחה את **עורך הרוחב של
  // הפאנל** שמתחתיו, וכל שאר המידות לא הגיבו כלל. המידה היחידה שאין לה
  // עורך היא בדיוק זו שנראתה עובדת.
  //
  // המקור הוא C.width ולא style.width: הוא נקבע ב-setupCanvas ואינו
  // תלוי ב-CSS שעשוי למתוח את האלמנט.
  const dpr = window.devicePixelRatio || 1;
  const cw = (C.width  / dpr) || cssW || rect.width;
  const ch = (C.height / dpr) || rect.height;
  const sx = rect.width  ? (cw / rect.width)  : 1;
  const sy = rect.height ? (ch / rect.height) : sx;
  return { x:(clientX-rect.left)*sx, y:(clientY-rect.top)*sy };
}

C.addEventListener('click',function(e){
  if(!editMode) return;              // מחוץ למצב עריכה הצייר אינו מגיב כלל
  const rect=C.getBoundingClientRect();
  const p=_canvasPoint(e.clientX,e.clientY,rect,parseFloat(C.style.width)||rect.width);
  const cx2=p.x, cy2=p.y;
  for(const hit of dimHits){
    if(cx2>=hit.x&&cx2<=hit.x+hit.w&&cy2>=hit.y&&cy2<=hit.y+hit.h){
      openDimEditor(hit,e.clientX,e.clientY);
      return;
    }
  }
  closeDimEditor();                  // נגיעה מחוץ למידה סוגרת
});

document.addEventListener('keydown',function(e){
  if(e.key==='Escape') closeDimEditor();
});

function updateSpecs(){
  const panels=getPanels(),pss=getPStates();
  if(!panels.length){document.getElementById('specs').innerHTML='<strong>פרטי הזמנה</strong>הוסף פריטים';return;}
  const g=GL.find(x=>x.id===selG),f=FN.find(x=>x.id===selF);
  const totalW=panels.reduce((s,_,i)=>s+(pss[i]?.w||500),0);
  const maxH=panels.length?Math.max(...panels.map((_,i)=>Math.max(pss[i]?.h||2000,pss[i]?.slopeH1||0,pss[i]?.slopeH2||0))):2000;
  const area=(totalW*maxH/1000000).toFixed(2);
  const total=Math.round(parseFloat(area)*g.price)+(selQ==='zamak'?f.pZ:f.pP);
  const sn=document.getElementById('sketchName')?.value;
  const det=panels.map((p,i)=>`${p.label||p.type}: ${pss[i]?.w||500}×${pss[i]?.h||2000} מ"מ`).join(' | ');
  document.getElementById('specs').innerHTML=`<strong>פרטי הזמנה</strong>
    ${sn?`<span style="color:var(--gold-text);font-weight:700">${sn}</span><br>`:''}
    ${det}<br>
    זכוכית: ${g.name} 8מ״מ מחוסם · ₪${g.price}/מ״ר<br>
    פרזול: ${f.name} (${selQ==='zamak'?'זאמק':'פליז'})<br>${sand?'+ התזת חול<br>':''}
    שטח: ${area} מ״ר<br>
    <strong style="color:var(--gold-text)">סה״כ: ₪${total.toLocaleString()}</strong>`;
}

function handleAddToSketch(){
  if(appMode==='item'){
    // In item mode: scroll to add buttons
    document.querySelector('.add-grid')?.scrollIntoView({behavior:'smooth',block:'center'});
    showToast('בחר סוג פריט להוספה');
  } else {
    // In combo mode: add current combo to sketch list (up to 3)
    addComboToSketch();
  }
}

let sketchParts=[]; // holds up to 3 combos/sketches

function addComboToSketch(){
  const panels=getPanels(),pss=getPStates();
  if(!panels.length){showToast('בחר קומבינציה תחילה');return;}
  if(sketchParts.length>=3){showToast('ניתן להוסיף עד 3 מקלחונים לסקיצה');return;}
  const g=GL.find(x=>x.id===selG),f=FN.find(x=>x.id===selF);
  const totalW=panels.reduce((s,_,i)=>s+(pss[i]?.w||500),0);
  const maxH=Math.max(...panels.map((_,i)=>pss[i]?.h||2000));
  const area=(totalW*maxH/1000000).toFixed(2);
  sketchParts.push({
    label:curCombo.label,
    panels:panels.map((p,i)=>({...p,w:pss[i]?.w||500,h:pss[i]?.h||2000,...pss[i]})),
    glass:g.name,area,
    sketch:(()=>{try{return C.toDataURL('image/png',0.6);}catch(e){return null;}})()
  });
  showToast(`✓ נוסף (${sketchParts.length}/3) — לחץ "סיים הזמנה" או הוסף עוד`);
}

function saveAndSendOrder(){
  const panels=getPanels(),pss=getPStates();
  // בקומבינציה תמיד יש פאנלים - רק בפריט פריט בודקים
  if(appMode==='item' && !items.length && !sketchParts.length){showToast('הוסף פריטים תחילה');return null;}
  const g=GL.find(x=>x.id===selG),f=FN.find(x=>x.id===selF);
  const totalW=panels.reduce((s,_,i)=>s+(pss[i]?.w||500),0);
  const maxH=panels.length?Math.max(...panels.map((_,i)=>Math.max(pss[i]?.h||2000,pss[i]?.slopeH1||0,pss[i]?.slopeH2||0))):2000;
  const area=(totalW*maxH/1000000).toFixed(2);
  const total=Math.round(parseFloat(area)*g.price)+(selQ==='zamak'?f.pZ:f.pP);
  const orders=JSON.parse(safeStorage.getItem('lgOrders')||'[]');
  const _s = JSON.parse(sessionStorage.getItem('lgSession')||'{}');
  const _cName = (_s.role==='admin' && window._sketchClient)
    ? window._sketchClient.name
    : (_s.name || _clientName || 'לקוח');
  const _cPhone = (_s.role==='admin' && window._sketchClient)
    ? window._sketchClient.phone
    : (_s.phone || _clientPhone || '');
  const _orderNum = '2026-' + String(Date.now()).slice(-5);
  const newOrder={
    id:Date.now(),
    sketchName:document.getElementById('sketchName')?.value||'',
    orderClient:_cName,
    orderNum:_orderNum,
    phone:_cPhone,
    source:'system',
    type:appMode==='combo'?(sketchParts.length>0?'סקיצה מרובה':curCombo.label):'פריט פריט',
    glass:g.name,glassPrice:g.price,finish:f.name,quality:selQ,sand,area,total,
    // התוספות נוסעות עם ההזמנה. בחירה שנראית בליקוט ונעלמת
    // בשמירה גרועה מבחירה שלא היתה — הלקוח בטוח שהזמין אותה.
    supportBar:selSupportBar, blackTrim:selBlackTrim,
    panels:panels.map((p,i)=>({label:p.label||p.type,type:p.type,w:pss[i]?.w||500,h:pss[i]?.h||2000})),
    parts:sketchParts,
    date:new Date().toLocaleDateString('he-IL'),
    status:'התקבלה',
    sketch:(()=>{try{return C.toDataURL('image/png',0.6);}catch(e){return null;}})()
  };
  orders.push(newOrder);
  try{
    safeStorage.setItem('lgOrders',JSON.stringify(orders));
    console.log('Order saved, total orders:', orders.length, 'id:', newOrder.id);
  }catch(err){
    console.error('Save failed:', err);
    showToast('שגיאה בשמירה — נסה שוב');
    return null;
  }
  return newOrder;
}

function finishOrder(){
  const panels=getPanels(),pss=getPStates();
  if(appMode==='item'&&!items.length&&!sketchParts.length){showToast('הוסף פריטים תחילה');return;}
  const saved=saveAndSendOrder();
  if(saved===null){return;} // save failed
  sketchParts=[];
  showFinishPopup();
}

  const box=document.createElement('div');
  box.style.cssText='background:#fff;border-radius:12px;padding:28px 24px;max-width:340px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.3);';
  box.innerHTML='<div style="font-size:44px;margin-bottom:12px">✅</div>'
    +'<div style="font-size:16px;font-weight:900;color:#1a1714;margin-bottom:8px;">הסקיצה נשלחה לתור!</div>'
    +'<div style="font-size:13px;color:#8a8278;margin-bottom:24px;">רוצה לבנות סקיצה נוספת?</div>';
  const btns=document.createElement('div');
  btns.style.cssText='display:flex;gap:10px;';
  const b1=document.createElement('button');
  b1.style.cssText='flex:1;padding:13px;background:#b8922a;color:var(--on-gold);font-family:Heebo,sans-serif;font-size:14px;font-weight:900;border:none;cursor:pointer;border-radius:6px;';
  b1.textContent='כן, בנה עוד';
  b1.onclick=function(){buildAnother();ov.remove();};
  const b2=document.createElement('button');
  b2.style.cssText='flex:1;padding:13px;background:#1a1714;color:#f7f4ef;font-family:Heebo,sans-serif;font-size:14px;font-weight:700;border:none;cursor:pointer;border-radius:6px;';
  b2.textContent='לא, חזרה לדף הראשי';
  b2.onclick=function(){ov.remove();goHome();};
  btns.appendChild(b1);btns.appendChild(b2);
  box.appendChild(btns);ov.appendChild(box);
  document.body.appendChild(ov);
}

function buildAnother(){
  // Reset for new sketch
  items=[];sketchParts=[];
  document.getElementById('sketchName').value='';
  if(appMode==='item') renderItemList();
  else {initPanelState();renderPanelCtrl();}
  draw();
  window.scrollTo({top:0,behavior:'smooth'});
  showToast('בנה סקיצה חדשה');
}

function goHome(){
  try{window.location.replace('index.html');}
  catch(e){window.location.href='index.html';}
}

function dlPNG(){const l=document.createElement('a');l.download=`luzglass-${Date.now()}.png`;l.href=C.toDataURL();l.click();}

// ══════════════ SWATCHES ══════════════
function renderSw(){
  const opts=(typeof lgGlassOptions==='function')?lgGlassOptions():{};
  // העוביים שמוצעים הם אלה שבאמת יש להם פריטים, ולא רשימה קבועה שתשקר
  // ביום שהמפעל יוסיף או יוריד עובי.
  const mms=Object.keys(opts).map(Number).filter(m=>m>=6).sort((a,b)=>a-b);
  if(mms.length && mms.indexOf(selMM)<0) selMM=mms.indexOf(8)>=0?8:mms[0];

  const mmEl=document.getElementById('mmSw');
  if(mmEl) mmEl.innerHTML=mms.map(m=>
    '<button type="button" class="'+(m===selMM?'on':'')+'" '+
    'onclick="setGlassMM('+m+')">'+m+' מ"מ</button>').join('');

  // הסוגים הם מה שקיים **בעובי הזה**. ‏GL נותן רק את העיגול הצבעוני
  // ואת המחיר; מה שקובע מי מופיע הוא הפריטים בחשבשבת.
  const types=(opts[selMM]||[]);
  if(types.length && !types.some(t=>t.type===selG)) selG=types[0].type;
  const look=n=>GL.filter(g=>g.name===n)[0]||{};

  const gEl=document.getElementById('gSw');
  // האינדקס ולא השם: שם עברי בתוך onclick חייב בריחה, ובריחה בתוך מחרוזת
  // בתוך HTML היא בדיוק המקום שבו ציטוט אחד שגוי שובר את כל הדף.
  if(gEl) gEl.innerHTML=types.map((t,i)=>{ const v=look(t.type);
    return '<button class="sw '+(t.type===selG?'active':'')+'" '+
      'onclick="setGlassType('+i+')">'+
      '<div class="sw-dot" style="background:'+(v.dot||'rgba(210,230,245,0.6)')+';'+
        (v.b?'border:'+v.b:'')+'"></div>'+
      '<div class="sw-name">'+t.type+'</div>'+
      (v.price?'<div class="sw-price">₪'+v.price+'</div>':'')+
    '</button>'; }).join('');

  // ── עבודת פנים ──
  //
  // מוצעות רק העבודות שיש להן פריט בעובי ובסוג שנבחרו: חלבי הוא התזת
  // חול על שקוף ואינו קיים על גרניט, וגרפיקה קיימת בשקוף ובקליר בלבד.
  // בחירה שאין לה פריט אינה בחירה.
  const works=(typeof lgGlassWorks==='function')?lgGlassWorks(selMM,selG):[''];
  if(works.indexOf(selWork)<0){ selWork=''; sand=false; }
  const wEl=document.getElementById('workSw');
  if(wEl) wEl.innerHTML=works.map(w=>{
    const he=(typeof LG_GLASS_WORK!=='undefined'&&LG_GLASS_WORK[w])?LG_GLASS_WORK[w].he:'';
    return '<button type="button" class="'+(w===selWork?'on':'')+'" '+
      'onclick="setGlassWork(&quot;'+w+'&quot;)">'+(he||'ללא')+'</button>'; }).join('');

  // המק"ט מוצג כפי שהוא, כדי שמי שמזמין יראה בדיוק מה יוזמן.
  const sku=(typeof lgGlassSku==='function')?lgGlassSku(selMM,selG,selWork):null;
  const nm=(sku&&typeof LG_SKU_MAP!=='undefined')?LG_SKU_MAP[sku]:'';
  [['glassSku',sku,nm],['workSku',sku,nm]].forEach(([id,k,n])=>{
    const el=document.getElementById(id); if(!el) return;
    el.innerHTML = k ? 'מק"ט: <b>'+k+'</b> · '+_shEsc(n) : 'אין פריט לצירוף הזה'; });

  document.getElementById('fSw').innerHTML=FN.map(f=>`
    <button class="sw ${f.id===selF?'active':''}" onclick="selF='${f.id}';renderSw();draw()">
      <div class="sw-dot" style="background:${f.dot}"></div><div class="sw-name">${f.name}</div>
    </button>`).join('');
}

function setGlassMM(mm){ selMM=Number(mm); afterGlassChange(); }
function setGlassType(i){
  const list=((typeof lgGlassOptions==='function')?lgGlassOptions():{})[selMM]||[];
  if(list[i]) selG=list[i].type;
  afterGlassChange();
}

// העובי והסוג הם של **המקלחון**, ולכן הם נכנסים למקלחון ולא ללוח בודד.
// לוח שקיבל עובי משלו בגיליון המאפיינים גובר, כמו שהיה תמיד.
function afterGlassChange(){
  renderSw();
  renderPanelCtrl();
  if(appMode==='shape') renderShapeUI();
  draw();
}


// ══════════════ INIT ══════════════
renderCombos(); initPS(); renderPanelCtrl(); renderSw(); renderExtras();
window.addEventListener('resize',()=>{ fitFullBottom(); draw(); }); draw();
// ‏Escape יוצא ממסך מלא — אותה יציאה בדיוק, לא מסלול נוסף. כשחלון מידה
// פתוח הוא נסגר קודם, כי הוא השכבה העליונה.
window.addEventListener('keydown',e=>{
  if(e.key!=='Escape') return;
  if(document.getElementById('dimEditor')?.classList.contains('open')){ closeDimEditor(); return; }
  if(editMode||pickMode) exitFullEdit();
});
</script>
