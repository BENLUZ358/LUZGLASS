<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>LuzGlass — הדפסות</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&display=swap" rel="stylesheet">

<!-- בסיס העיצוב המשותף — אין להגדיר :root בדף הזה -->
<link rel="stylesheet" href="lg-ui.css?v=20260807">
<style>
/* ═══ לוח בקרה של הדפסות (בן, 3/11) ═════════════════════════════════════
   כל ההדפסות מ-/api/print (waMeta/printJobs): מתי, מי, לקוח, כמה, מצב.
   פתיחה → המדבקות מהטקסט השמור, עריכה, בחירה, "הדפס שוב" = הדפסה חדשה.
   ההדפסה עצמה: הכלי במחשב במשרד (tools/invoice-watcher). אפיון:
   docs/superpowers/specs/2026-11-03-print-center-labels-design.md
   ═════════════════════════════════════════════════════════════════════════ */
body{background:var(--bg);color:var(--text);}
.topbar{position:sticky;top:0;z-index:10;min-height:56px;background:var(--surface);border-bottom:1px solid var(--border);
  padding:0 var(--space-3);padding-top:env(safe-area-inset-top);display:flex;align-items:center;gap:var(--space-2);}
.tb-btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);min-width:44px;min-height:44px;
  padding:0 var(--space-3);border:1px solid var(--border);background:var(--surface);color:var(--text);
  border-radius:var(--radius);font-size:var(--fs-sm);font-weight:var(--fw-bold);cursor:pointer;text-decoration:none;}
.tb-title{flex:1;min-width:0;font-size:var(--fs-lg);font-weight:var(--fw-black);}
.tb-title small{display:block;font-size:var(--fs-xs);font-weight:var(--fw-medium);color:var(--muted);}
.wrap{max-width:960px;margin:0 auto;padding:var(--space-4) 16px;}
.agent{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-3);border-radius:var(--radius-lg);
  font-size:var(--fs-sm);font-weight:var(--fw-bold);margin-bottom:var(--space-3);}
.agent.ok{background:#e7f3ec;color:#155d33;border:1px solid var(--green);}
.agent.bad{background:#fbeae7;color:#7c241b;border:2px solid var(--red);}
.filters{display:flex;gap:var(--space-2);flex-wrap:wrap;margin-bottom:var(--space-3);}
.filters input{flex:1;min-width:180px;min-height:44px;padding:0 var(--space-3);border:1px solid var(--border);border-radius:var(--radius);
  background:var(--surface);font-size:var(--fs-base);color:var(--text);}
.chip-btn{min-height:44px;padding:0 var(--space-3);border:1px solid var(--border);background:var(--surface);border-radius:var(--radius);
  font-size:var(--fs-sm);font-weight:var(--fw-bold);cursor:pointer;color:var(--text);}
.chip-btn[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--on-gold);}
.job{display:grid;grid-template-columns:1fr auto;gap:4px var(--space-3);align-items:center;width:100%;padding:var(--space-3) var(--space-4);
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:var(--space-2);
  text-align:right;cursor:pointer;color:var(--text);font-family:inherit;}
.job:hover{border-color:var(--gold);}
.job b{font-size:var(--fs-base);}
.job .meta{grid-column:1;font-size:var(--fs-xs);color:var(--muted);}
.job .err{grid-column:1 / -1;font-size:var(--fs-xs);color:#7c241b;}
.st{font-size:var(--fs-xs);font-weight:var(--fw-bold);padding:3px 8px;border-radius:999px;white-space:nowrap;}
.st-queued,.st-printing{background:#fbf3df;color:#5c4510;}
.st-printed{background:#e7f3ec;color:#155d33;}
.st-failed,.st-unknown{background:#fbeae7;color:#7c241b;}
.empty{text-align:center;color:var(--muted);padding:var(--space-6) 0;}
/* חלון הדפסה */
.ov{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:50;display:flex;align-items:center;justify-content:center;padding:12px;}
.ov[hidden]{display:none;}
.box{background:var(--surface);border-radius:12px;max-width:820px;width:100%;max-height:92vh;display:flex;flex-direction:column;}
.box-h{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-3) var(--space-4);border-bottom:1px solid var(--border);}
.box-h h2{flex:1;font-size:var(--fs-base);font-weight:var(--fw-black);margin:0;}
.grid{padding:var(--space-3) var(--space-4);overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:var(--space-3);}
.lbl{border:1px solid var(--border);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px;}
.lbl canvas{width:100%;aspect-ratio:1;border:1px dashed var(--border);border-radius:4px;background:#fff;}
.lbl input[type=text]{padding:6px;border:1px solid var(--border);border-radius:4px;font-size:13px;font-family:inherit;}
.lbl label{display:flex;align-items:center;gap:6px;font-size:var(--fs-xs);min-height:32px;}
.box-f{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap;padding:var(--space-3) var(--space-4);border-top:1px solid var(--border);}
.box-f .go{flex:1;min-height:48px;background:var(--gold);color:var(--on-gold);border:none;border-radius:8px;font-size:var(--fs-base);
  font-weight:var(--fw-black);cursor:pointer;font-family:inherit;}
.box-f .go:disabled{opacity:.5;cursor:default;}
#boxSt{width:100%;font-size:var(--fs-sm);font-weight:var(--fw-bold);color:var(--muted);}
@media (max-width:600px){ .tb-btn span:not([data-icon]){display:none;} }
</style>
</head>
<body>
<header class="topbar">
  <a class="tb-btn" href="admin.html" aria-label="חזרה לאדמין"><span data-icon="arrow-right"></span></a>
  <div class="tb-title">הדפסות<small>מדבקות וכל מה שנשלח להדפסה — מצב, היסטוריה והדפסה חוזרת</small></div>
  <a class="tb-btn" href="workday.html"><span data-icon="factory"></span><span>יום עבודה</span></a>
  <button class="tb-btn" id="btnRefresh" type="button" aria-label="רענן"><span data-icon="refresh"></span></button>
</header>

<main class="wrap">
  <div id="agent" class="agent bad" role="status">בודק את המחשב במשרד…</div>
  <div class="filters">
    <input id="q" type="search" placeholder="חיפוש לפי לקוח או מספר הזמנה" autocomplete="off" aria-label="חיפוש">
    <button class="chip-btn" type="button" data-days="7">שבוע</button>
    <button class="chip-btn" type="button" data-days="30">חודש</button>
    <button class="chip-btn" type="button" data-days="90">3 חודשים</button>
  </div>
  <div id="list"><div class="empty">טוען…</div></div>
</main>

<div class="ov" id="ov" hidden role="dialog" aria-modal="true" aria-labelledby="boxTitle">
  <div class="box">
    <div class="box-h">
      <h2 id="boxTitle"></h2>
      <button class="tb-btn" type="button" id="boxClose" aria-label="סגור"><span data-icon="x"></span></button>
    </div>
    <div class="grid" id="boxGrid"></div>
    <div class="box-f">
      <button class="go" type="button" id="boxGo">🖨 הדפס שוב</button>
      <div id="boxSt" role="status"></div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="firebase-db.js?v=20261103"></script>
<script src="print-labels.js?v=20261103"></script>
<script src="lg-icons.js?v=20261103"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => lgEsc(s);
const STATE = { queued: 'בתור', printing: 'מדפיס', printed: 'הודפס', failed: 'נכשל', unknown: 'לא ידוע — בדוק את המדפסת' };
const KIND = { labels: 'מדבקות' };
// שגיאת מדפסת במילים (הכלי מדווח את קוד הרשת)
const ERR = { ECONNREFUSED: 'המדפסת לא ענתה — כבויה או לא ברשת', EHOSTUNREACH: 'המדפסת לא ברשת',
  ETIMEDOUT: 'המדפסת לא ענתה בזמן', ECONNRESET: 'החיבור למדפסת נקטע' };
const errText = e => ERR[e] || e || '';
let JOBS = [], AGENT = 0, DAYS = 30, OPEN = null;

const post = async body => {
  const r = await _lgAuthPost('/api/print', body);
  const d = await r.json().catch(() => ({}));
  if (!r.ok || !d.ok) throw new Error(d.code || ('HTTP ' + r.status));
  return d;
};
const when = t => t ? new Date(t).toLocaleString('he-IL', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
const ago = t => { const m = Math.round((Date.now() - t) / 60000); return m < 1 ? 'עכשיו' : m < 60 ? 'לפני ' + m + ' דק׳' : 'לפני ' + Math.round(m / 60) + ' שע׳'; };

async function load() {
  try {
    const d = await post({ action: 'list', from: Date.now() - DAYS * 86400000 });
    JOBS = d.items; AGENT = (d.agent && d.agent.lastSeenAt) || 0;
  } catch (e) { $('list').innerHTML = '<div class="empty">הטעינה נכשלה — בדוק חיבור ורענן</div>'; return; }
  render();
}

function render() {
  //  הכלי במחשב שואל כל כמה שניות. 2 דקות בלי קשר = כנראה כבוי
  const fresh = AGENT && Date.now() - AGENT < 120000;
  $('agent').className = 'agent ' + (fresh ? 'ok' : 'bad');
  $('agent').textContent = fresh ? '✓ המחשב במשרד מחובר (' + ago(AGENT) + ') — הדפסות יוצאות תוך שניות'
    : AGENT ? '✗ המחשב במשרד לא מחובר מאז ' + when(AGENT) + ' — ההדפסות מחכות בתור עד שיחזור'
    : '✗ המחשב במשרד עוד לא התחבר — ההדפסות מחכות בתור';
  document.querySelectorAll('[data-days]').forEach(b => b.setAttribute('aria-pressed', String(Number(b.dataset.days) === DAYS)));
  const q = $('q').value.trim().toLowerCase();
  const items = JOBS.filter(j => !q || [j.client, j.createdBy, ...(j.orderIds || [])].some(x => String(x || '').toLowerCase().includes(q)));
  $('list').innerHTML = items.length ? items.map(j => `
    <button class="job" type="button" data-id="${esc(j.id)}">
      <b>${esc(KIND[j.kind] || j.kind)} · ${esc(j.client || '—')} · ${j.count}</b>
      <span class="st st-${esc(j.state)}">${esc(STATE[j.state] || j.state)}</span>
      <span class="meta">${esc(when(j.createdAt))} · ${esc(j.createdBy || '')}${j.reprintOf ? ' · הדפסה חוזרת' : ''}${j.printedAt ? ' · הודפס ' + esc(when(j.printedAt)) : ''}</span>
      ${j.error && j.state !== 'printed' ? `<span class="err">${esc(errText(j.error))}</span>` : ''}
    </button>`).join('') : '<div class="empty">אין הדפסות בטווח הזה</div>';
}

async function openJob(id) {
  let d;
  try { d = await post({ action: 'get', id }); } catch (e) { alert('לא נפתח: ' + e.message); return; }
  OPEN = { id, job: d.job, labels: d.job.labels.map(l => Object.assign({ on: true }, l)) };
  $('boxTitle').textContent = (KIND[d.job.kind] || '') + ' · ' + (d.job.client || '') + ' · ' + when(d.job.createdAt);
  $('boxSt').textContent = '';
  $('ov').hidden = false;
  drawBox();
}

function drawBox() {
  if (!OPEN) return;
  const inp = (i, f, v, extra) => `<input type="text" aria-label="${f === 'title' ? 'שם לקוח' : f === 'dims' ? 'מידה' : 'שם סקיצה'}" value="${esc(v)}" data-i="${i}" data-f="${f}" ${extra || ''}>`;
  $('boxGrid').innerHTML = OPEN.labels.map((l, i) => `
    <div class="lbl">
      <canvas width="560" height="560" data-c="${i}"></canvas>
      ${inp(i, 'title', l.title)}${inp(i, 'dims', l.dims, 'dir="ltr" style="text-align:center"')}${inp(i, 'sketchName', l.sketchName)}
      <label><input type="checkbox" data-pick="${i}" ${l.on ? 'checked' : ''}> להדפיס</label>
    </div>`).join('');
  paint();
  count();
}
async function paint(i) {
  try { await document.fonts.load('700 64px Heebo', 'אבג 0123'); } catch (e) {}
  document.querySelectorAll('#boxGrid canvas').forEach(c => {
    const k = Number(c.dataset.c);
    if (i == null || i === k) lgLabelDraw(c.getContext('2d'), OPEN.labels[k]);
  });
}
function count() {
  const n = OPEN.labels.filter(l => l.on).length;
  $('boxGo').textContent = n === 1 ? '🖨 הדפס שוב מדבקה אחת' : '🖨 הדפס שוב ' + n + ' מדבקות';
  $('boxGo').disabled = !n;
}

async function reprint() {
  const pick = OPEN.labels.filter(l => l.on);
  if (!pick.length) return;
  $('boxGo').disabled = true; $('boxSt').textContent = 'שולח…';
  try {
    try { await document.fonts.load('700 64px Heebo', 'אבג 0123'); } catch (e) {}
    const labels = pick.map(l => ({ title: l.title, dims: l.dims, sketchName: l.sketchName, orderNum: l.orderNum }));
    const bitmaps = labels.map(l => lgLabelRender(l).bitmap);
    await post({ action: 'create', kind: OPEN.job.kind, printer: OPEN.job.printer, client: OPEN.job.client,
                 orderIds: OPEN.job.orderIds, labels, bitmaps, reprintOf: OPEN.id });
    $('boxSt').textContent = '⏳ בתור — יודפס תוך כמה שניות. המצב ברשימה.';
    load();
  } catch (e) {
    $('boxSt').textContent = '✗ לא נשלח: ' + e.message;
    $('boxGo').disabled = false;
  }
}

$('list').addEventListener('click', e => { const b = e.target.closest('[data-id]'); if (b) openJob(b.dataset.id); });
$('q').addEventListener('input', render);
document.querySelectorAll('[data-days]').forEach(b => b.addEventListener('click', () => { DAYS = Number(b.dataset.days); load(); }));
$('btnRefresh').addEventListener('click', load);
$('boxClose').addEventListener('click', () => { $('ov').hidden = true; OPEN = null; });
$('ov').addEventListener('click', e => { if (e.target === $('ov')) { $('ov').hidden = true; OPEN = null; } });
$('boxGrid').addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.f) { OPEN.labels[Number(t.dataset.i)][t.dataset.f] = t.value; paint(Number(t.dataset.i)); }
});
$('boxGrid').addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.pick != null) { OPEN.labels[Number(t.dataset.pick)].on = t.checked; count(); }
});
$('boxGo').addEventListener('click', reprint);

lgRequireAuthAsync('admin').then(session => {
  if (!session) return;
  load();
  //  מצב עדכני בלי לרענן — כל 10 שניות
  setInterval(() => { if (!document.hidden) load(); }, 10000);
});
</script>
</body>
</html>
